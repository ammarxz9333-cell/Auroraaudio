# AuroraOS-S6 appliance defaults.
# Values that require physical validation remain conservative and configurable.

[engine]
sample_rate = 48000
block_frames = 40
layout = "7.1.4"
realtime = true

[source_manager]
priority = ["hdmi_earc", "music", "bluetooth", "multiroom"]
fade_ms = 300
hdmi_release_timeout_ms = 5000

[external.omniphony]
enabled = true
binary = "/opt/aurora/external/orender"
bridge = "/opt/aurora/external/libharletty_bridge.so"
layout = "/etc/aurora/layouts/7.1.4.yaml"

[music]
backend = "navidrome"
navidrome_url = "http://127.0.0.1:4533"
library = "/srv/music"
# Aurora Music Player owns PCM playback; Navidrome is catalog/API only.
direct_audio_from_navidrome = false

[display]
backend = "lvgl"
framebuffer = "/dev/fb0"
input_glob = "/dev/input/event*"
clock_interval_minutes = 15
clock_duration_seconds = 20
amoled_pixel_shift = true

[usb]
mode = "functionfs"
role = "device"
transport = "aurora-usb-v1"
# The USB host is the realtime MCU selected by config/aurora-hardware-target.env.

[wireless_rears]
enabled = false
transport = "auroralink-v1"
band = "5ghz"
sample_format = "s24le"
sample_rate = 48000
jitter_buffer_ms = 24
# Disabled until packet transport and physical clock-sync validation land.

[thermal]
# Exact trip points and affinity masks are selected from physical S6 measurements.
require_heatsink_for_validation = true
