services:
  radar:
    build:
      context: .
      dockerfile: continuous/Dockerfile
    env_file: .env
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - radar-state:/app/runtime
      - ./continuous/sources.json:/app/continuous/sources.json:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  radar-state:
