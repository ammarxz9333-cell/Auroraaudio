# Prepared deployment, not authorization for a paid purchase.
# Render Blueprint path: market-radar/render.yaml
services:
  - type: worker
    name: market-radar-continuous
    runtime: docker
    branch: market-radar-live
    region: frankfurt
    plan: 0.5c-512mb
    rootDir: market-radar
    dockerfilePath: continuous/Dockerfile
    dockerContext: .
    numInstances: 1
    autoDeployTrigger: off
    disk:
      name: market-radar-state
      mountPath: /app/runtime
      sizeGB: 1
    envVars:
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: ALPACA_FEED
        value: sip
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: RADAR_INGEST_TOKEN
        generateValue: true
      - key: RADAR_USER_AGENT
        sync: false
      - key: RADAR_DB
        value: /app/runtime/radar.sqlite
      - key: RADAR_FULL_UNIVERSE
        value: "0"
