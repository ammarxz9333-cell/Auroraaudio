<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>رادار الأسهم</title><style>body{background:#101822;color:#edf3fa;font:17px/1.6 system-ui;max-width:1050px;margin:30px auto;padding:20px}h1{margin:0;color:#9de7cb}.status{background:#223147;padding:18px;border-radius:14px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button{font:inherit;background:#26374e;color:white;border:1px solid #55708c;border-radius:24px;padding:10px 20px;cursor:pointer}button[aria-pressed=true]{background:#dbe9f5;color:#101822}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:18px}article{background:#1a2738;border:1px solid #3c526a;border-radius:18px;padding:22px}.badge{display:inline-block;background:#51343b;color:#ffbec7;font-weight:bold;padding:5px 12px;border-radius:8px}.watch .badge{background:#4b4027;color:#ffdc91}.buy .badge{background:#214b3d;color:#8bf1c7}h2{font-size:30px;margin:14px 0}p{color:#c2cedc}small{color:#9eafc4}pre{font:13px/1.7 system-ui;direction:ltr;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere}summary{cursor:pointer;color:#aad1ff}.nums{border-top:1px solid #3c526a;padding-top:14px}#coverage{font-size:14px}</style>
<h1>رادار الأسهم</h1><p>القرار أولًا، ثم السبب. إشارة الشراء تحتاج بيانات حديثة وشروط دخول مكتملة.</p><div id="status" class="status">جارٍ الاتصال…</div><p id="coverage"></p><nav><button data-filter="all" aria-pressed="true">الكل</button><button data-filter="buy" aria-pressed="false">شراء مشروط</button><button data-filter="watch" aria-pressed="false">راقب</button><button data-filter="avoid" aria-pressed="false">لا تشتري الآن</button></nav><main id="cards"></main><p><small>إشارات آلية قابلة للخطأ، وليست ضمانًا للربح. البيانات غير المتاحة لا تُعتبر تأكيدًا للشراء.</small></p>
<script>
let items=[],filter='all';const money=v=>v==null?'غير متاح':'$'+Number(v).toFixed(2);function el(tag,text,cls){const n=document.createElement(tag);if(text!=null)n.textContent=text;if(cls)n.className=cls;return n}
function decision(a,h){const age=(Date.now()-Date.parse(a.detected_at))/1000;if(a.classification==='AVOID')return ['avoid','لا تشتري الآن','رُصد خبر سلبي أو خطر إصدار أسهم جديدة.'];if(a.classification==='LATE')return ['avoid','لا تشتري الآن','السعر ابتعد كثيرًا بعد الخبر؛ لا تطارد الحركة.'];if(a.price==null||!(h.tape_age_seconds>=0&&h.tape_age_seconds<120))return ['avoid','لا تشتري الآن','بيانات السعر والحجم المباشرة غير متاحة؛ لا توجد إشارة شراء مؤكدة.'];if(!Number.isFinite(age)||age<0||age>120||a.tape_stale)return ['avoid','لا تشتري الآن','الإشارة قديمة؛ تحتاج إعادة تقييم قبل الدخول.'];if(a.buyable&&['CONFIRMED','HIGH-CONVICTION EARLY'].includes(a.classification)&&a.trigger!=null&&a.invalidation!=null)return ['buy','شراء مشروط','شروط الرادار مكتملة. الدخول عند تأكيد تجاوز مستوى الدخول، وإلغاء الفكرة عند كسر المستوى المحدد.'];return ['watch','راقب','الخبر يستحق المتابعة، لكن شروط الدخول لم تكتمل.']}
function render(){const main=document.getElementById('cards');main.replaceChildren();const shown=items.filter(i=>filter==='all'||i.kind===filter);if(!shown.length)main.append(el('p','لا توجد أسهم تستوفي شروط هذه القائمة الآن.'));for(const i of shown){const a=i.row.alert;const c=el('article',null,i.kind);c.append(el('span',i.label,'badge'),el('h2','$'+a.ticker),el('p',i.reason),el('p',a.catalyst));c.append(el('p','السعر عند التنبيه: '+money(a.price)+' · الدخول عند تجاوز: '+money(a.trigger)+' · إلغاء الفكرة دون: '+money(a.invalidation),'nums'));c.append(el('small','وقت التنبيه: '+new Date(a.detected_at).toLocaleString('ar',{timeZone:'Europe/Berlin'})+' · برلين'));const d=el('details');d.append(el('summary','الخبر والمصادر والتفاصيل'),el('pre',i.row.text));c.append(d);main.append(c)}}
document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;document.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()}));
async function refresh(){try{const [h,rows]=await Promise.all([fetch('/health').then(r=>{if(!r.ok)throw Error();return r.json()}),fetch('/alerts').then(r=>{if(!r.ok)throw Error();return r.json()})]);items=[];const seen=new Set;for(const row of rows){if(!row.alert||seen.has(row.alert.ticker))continue;seen.add(row.alert.ticker);const [kind,label,reason]=decision(row.alert,h);items.push({row,kind,label,reason})}items.sort((a,b)=>['buy','watch','avoid'].indexOf(a.kind)-['buy','watch','avoid'].indexOf(b.kind));document.getElementById('status').textContent=h.tape_age_seconds<120?'مراقبة السوق متصلة؛ راجع قرار كل سهم أدناه.':'جمع الأخبار يعمل. الأسعار المباشرة غير متصلة؛ إشارات الشراء متوقفة.';document.getElementById('coverage').textContent='دليل الأسهم: '+h.universe_symbols+' رمزًا · مصادر الأخبار المضبوطة: '+h.news_sources+' · شراء مشروط: '+items.filter(i=>i.kind==='buy').length+' · آخر تحديث: '+new Date().toLocaleTimeString('ar',{timeZone:'Europe/Berlin'});render()}catch(e){items=[];render();document.getElementById('status').textContent='الرادار غير متصل؛ لا تعتمد على إشارات سابقة.';document.getElementById('coverage').textContent=''}}refresh();setInterval(refresh,10000);
</script></html>
