name: Build DaViewer APK

on:
  push:
    branches:
      - build/daviewer-v2-apk-20260920
    paths:
      - "tools/daviewer-v2/**"
      - ".github/workflows/daviewer-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --list_installed | head -80

      - name: Ensure Android 35 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build debug APK
        working-directory: tools/daviewer-v2
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare artifact
        run: cp tools/daviewer-v2/app/build/outputs/apk/debug/app-debug.apk DaViewer-v2.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DaViewer-v2-APK
          path: DaViewer-v2.apk
          if-no-files-found: error
