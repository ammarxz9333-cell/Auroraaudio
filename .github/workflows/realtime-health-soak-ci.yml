name: Sustained Realtime Health Soak

on:
  pull_request:
    branches:
      - main-v2
    paths:
      - '.github/workflows/realtime-health-soak-ci.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/aurora-core/**'
      - 'crates/aurora-scene/**'
      - 'crates/aurora-renderer-api/**'
      - 'crates/aurora-renderer-basic/**'
      - 'crates/aurora-dsp-basic/**'
      - 'crates/aurora-realtime-engine/**'
      - 'crates/aurora-realtime-audio-sim/**'
      - 'crates/aurora-realtime-acceptance/**'
      - 'config/simulation-coverage-v1.json'
      - 'validation/virtual-hardware/aurora_resilience_sim.py'
      - 'validation/virtual-hardware/validate_simulation_coverage.py'
      - 'validation/virtual-hardware/test-aurora-resilience-sim.sh'
      - 'fixtures/scenes/7_1_4_reference.json'
  push:
    branches:
      - main-v2
    paths:
      - '.github/workflows/realtime-health-soak-ci.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/aurora-core/**'
      - 'crates/aurora-scene/**'
      - 'crates/aurora-renderer-api/**'
      - 'crates/aurora-renderer-basic/**'
      - 'crates/aurora-dsp-basic/**'
      - 'crates/aurora-realtime-engine/**'
      - 'crates/aurora-realtime-audio-sim/**'
      - 'crates/aurora-realtime-acceptance/**'
      - 'config/simulation-coverage-v1.json'
      - 'validation/virtual-hardware/aurora_resilience_sim.py'
      - 'validation/virtual-hardware/validate_simulation_coverage.py'
      - 'validation/virtual-hardware/test-aurora-resilience-sim.sh'
      - 'fixtures/scenes/7_1_4_reference.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accelerated-7-1-4-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo dependencies and release build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
          key: ${{ runner.os }}-realtime-health-soak-${{ hashFiles('Cargo.lock', 'crates/aurora-realtime-engine/**', 'crates/aurora-realtime-audio-sim/**', 'crates/aurora-realtime-acceptance/**', 'validation/virtual-hardware/test-aurora-resilience-sim.sh') }}
          restore-keys: |
            ${{ runner.os }}-realtime-health-soak-
      - name: Run accelerated 10-minute media-time 7.1.4 soak
        run: |
          mkdir -p output/validation
          cargo run --locked --release -p aurora-realtime-acceptance --example sustained_soak -- \
            600 output/validation/realtime-health-soak-v1.json | tee output/validation/realtime-health-soak.log
          grep -F 'AURORA REALTIME HEALTH SOAK PASS' output/validation/realtime-health-soak.log
      - name: Validate accelerated report shape
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('output/validation/realtime-health-soak-v1.json').read_text())
          assert report['schema_version'] == 1
          assert report['accepted'] is True
          assert report['metrics']['callback_count'] == 112500
          assert report['metrics']['processed_blocks'] == 112500
          assert report['metrics']['input_underruns'] == 0
          assert report['metrics']['output_underruns'] == 0
          assert report['metrics']['dropped_blocks'] == 0
          assert report['metrics']['fault_code'] == 0
          assert report['violations'] == []
          print('AURORA REALTIME HEALTH REPORT PASS')
          PY
      - name: Enforce resilience coverage registry
        run: |
          python3 validation/virtual-hardware/validate_simulation_coverage.py self-test
          python3 validation/virtual-hardware/validate_simulation_coverage.py check
      - name: Run clock and reconnect fault resilience evidence
        run: |
          bash validation/virtual-hardware/test-aurora-resilience-sim.sh \
            output/validation/realtime-resilience-sim-v1.json | tee output/validation/realtime-resilience-sim.log
      - name: Run paced 15-second wall-clock 7.1.4 smoke soak
        run: |
          cargo run --locked --release -p aurora-realtime-acceptance --example wall_clock_soak -- \
            15 output/validation/realtime-wall-clock-soak-v1.json | tee output/validation/realtime-wall-clock-soak.log
          grep -F 'AURORA WALL CLOCK SOAK PASS' output/validation/realtime-wall-clock-soak.log
      - name: Validate wall-clock report
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('output/validation/realtime-wall-clock-soak-v1.json').read_text())
          assert report['schema_version'] == 1
          assert report['accepted'] is True
          assert report['wall_seconds_observed'] >= 15.0
          assert report['callbacks'] > 0
          assert report['channels'] == 12
          assert report['processing_deadline_misses'] == 0
          assert report['engine_input_underruns'] == 0
          assert report['engine_output_underruns'] == 0
          assert report['engine_dropped_blocks'] == 0
          assert report['engine_fault'] == 'None'
          assert report['violations'] == []
          print('AURORA WALL CLOCK HEALTH REPORT PASS')
          PY
      - name: Upload sustained soak evidence
        uses: actions/upload-artifact@v4
        with:
          name: realtime-health-soak-${{ github.sha }}
          path: |
            output/validation/realtime-health-soak-v1.json
            output/validation/realtime-health-soak.log
            output/validation/realtime-resilience-sim-v1.json
            output/validation/realtime-resilience-sim-v1.json.transitions.json
            output/validation/realtime-resilience-sim.log
            output/validation/realtime-wall-clock-soak-v1.json
            output/validation/realtime-wall-clock-soak.log
          retention-days: 14
