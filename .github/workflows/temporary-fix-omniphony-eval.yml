name: Temporary Omniphony evaluation lifecycle fix

on:
  push:
    branches:
      - validation/omniphony-eval-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validation/omniphony-eval-v1
      - name: Patch evaluation lifecycle
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('validation/immersive/test-omniphony-reference-comparison.sh')
          text = path.read_text()
          old = '''  --output-file-format raw-f32 \\
  --no-continuous \\
  >"$EVAL_LOG" 2>&1 &'''
          new = '''  --output-file-format raw-f32 \\
  --continuous \\
  >"$EVAL_LOG" 2>&1 &'''
          if old not in text:
              raise SystemExit('expected --no-continuous invocation not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              'Newer Omniphony revisions intentionally keep the process alive after a file\\n# StreamEnd so Studio/live input can hand over another stream.',
              'Newer Omniphony revisions emit StreamEnd only in continuous mode; that path\\n# finalizes and flushes the current file before resetting for another stream.'
          )
          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/immersive/test-omniphony-reference-comparison.sh
          git diff --cached --check
          git commit -m "Fix candidate stream-end lifecycle evaluation"
          git push origin HEAD:validation/omniphony-eval-v1
