name: Market Radar Android APK
on:
  push:
    branches: [market-radar-android-v1]
    paths: ["market-radar/android/**", ".github/workflows/market-radar-android.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Build debug APK
        working-directory: market-radar/android
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MarketRadar-debug-apk
          path: market-radar/android/app/build/outputs/apk/debug/app-debug.apk
