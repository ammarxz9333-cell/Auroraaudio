name: Android Market Radar APK
on:
  workflow_dispatch:
  push:
    branches: [main-v2]
    paths:
      - "market-radar/android/**"
      - ".github/workflows/market-radar-android.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: market-radar/android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify output APK
        run: |
          test -s market-radar/android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum market-radar/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: market-radar-android-debug-apk
          retention-days: 14
          if-no-files-found: error
          path: market-radar/android/app/build/outputs/apk/debug/app-debug.apk
