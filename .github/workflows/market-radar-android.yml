name: Android Market Radar APK
on:
  workflow_dispatch:
  push:
    paths:
      - "market-radar/android/**"
      - ".github/workflows/market-radar-android.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: market-radar/android
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: market-radar-android-debug-apk
          path: market-radar/android/app/build/outputs/apk/debug/*.apk
