name: Android Market Radar APK
on:
  workflow_dispatch:
  push:
    branches: [main-v2]
    paths:
      - "market-radar/android/**"
      - ".github/workflows/market-radar-android.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          test -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: market-radar/android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify output APK
        run: |
          test -s market-radar/android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum market-radar/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: market-radar-android-debug-apk
          retention-days: 14
          if-no-files-found: error
          path: market-radar/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish installable APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view market-radar-latest >/dev/null 2>&1 || gh release create market-radar-latest --title "Market Radar Android" --notes "Android debug APK built from main-v2. Requires internet for live charts." --target main-v2
          gh release upload market-radar-latest market-radar/android/app/build/outputs/apk/debug/app-debug.apk#MarketRadar.apk --clobber

