name: Direct eARC Ingest CI

on:
  push:
    branches:
      - feature/direct-earc-linux-ingest
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - ".github/workflows/direct-earc-ingest-ci.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - ".github/workflows/direct-earc-ingest-ci.yml"

permissions:
  contents: read

concurrency:
  group: direct-earc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  direct-earc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy

      - name: Install Linux audio and simulator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev pkg-config ffmpeg

      - name: Generate validation lockfile and expose committed drift
        run: |
          cargo generate-lockfile
          cargo metadata --format-version 1 --locked > /tmp/aurora-metadata.json
          if ! git diff --quiet -- Cargo.lock; then
            echo '::warning file=Cargo.lock::Committed Cargo.lock is stale. Validation will continue against the freshly generated lockfile; the final lockfile gate will remain red until the generated file is committed.'
            git diff --stat -- Cargo.lock
          fi

      - name: Upload resolver-generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: direct-earc-generated-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 3

      - name: Validate Linux dependency graph
        run: |
          cargo tree --locked --target x86_64-unknown-linux-gnu -i alsa-sys
          cargo tree --locked --target x86_64-unknown-linux-gnu -p aurora-realtime-audio-cpal
          if cargo tree --locked --target x86_64-unknown-linux-gnu -p aurora-realtime-audio-cpal --prefix none | grep -Eq '^cpal v[0-9]'; then
            echo 'CPAL unexpectedly entered the Linux dependency graph' >&2
            exit 1
          fi

      - name: Check formatting for direct eARC crates
        run: >-
          cargo fmt
          --package aurora-iec61937
          --package aurora-sim-source
          --package aurora-decoder-open
          --package aurora-decoder-engine
          --package aurora-direct-earc-decoder
          --package aurora-encoded-input
          --package aurora-encoded-runtime
          --package aurora-alsa-input
          --package aurora-alsa-output
          --package aurora-realtime-audio-cpal
          --package aurora-cli
          -- --check

      - name: Check reusable IEC61937 parser
        run: cargo check --locked -p aurora-iec61937 --all-targets

      - name: Test reusable IEC61937 parser
        run: cargo test --locked -p aurora-iec61937

      - name: Clippy reusable IEC61937 parser
        run: cargo clippy --locked -p aurora-iec61937 --all-targets -- -D warnings

      - name: Check deterministic eARC simulator source
        run: cargo check --locked -p aurora-sim-source --all-targets

      - name: Test deterministic eARC simulator source
        run: cargo test --locked -p aurora-sim-source

      - name: Clippy deterministic eARC simulator source
        run: cargo clippy --locked -p aurora-sim-source --all-targets -- -D warnings

      - name: Validate FFmpeg-generated E-AC-3 carrier rates
        run: |
          for bitrate in 384 768 640; do
            cargo run --quiet --locked -p aurora-cli \
              --no-default-features --features earc-sim \
              --bin aurora-sim-source \
              -- --generate-seconds 0.256 --bitrate-kbps "$bitrate" \
              > "/tmp/generated-${bitrate}.iec61937"
            cargo run --quiet --locked -p aurora-cli \
              --no-default-features \
              --bin aurora-direct-earc-probe \
              -- --filter eac3 \
              < "/tmp/generated-${bitrate}.iec61937" \
              > /dev/null 2> "/tmp/generated-${bitrate}.log"
            grep -Eq 'eac3=[1-9][0-9]*' "/tmp/generated-${bitrate}.log"
            grep -q 'malformed_headers=0' "/tmp/generated-${bitrate}.log"
            grep -q 'eac3_period_mismatches=0' "/tmp/generated-${bitrate}.log"
          done

      - name: Check open AC3/EAC3/JOC decoder adapter
        run: cargo check --locked -p aurora-decoder-open --all-targets

      - name: Test open AC3/EAC3/JOC decoder adapter
        run: cargo test --locked -p aurora-decoder-open

      - name: Test exact OpenJOC 0.17 synthetic JOC fixture
        env:
          OPENJOC_REV: e7e03bc834ac0483770933cdc50ac058b100d1e2
          OPENJOC_FIXTURE_BLOB: 4a47d79c1af717c7007e0398d01266867a3a9a49
          OPENJOC_FIXTURE_SHA256: 54b48754b915cef97c13752de5eace4a219da6599cdfcf26f92b5b6fffc6e3e4
          AURORA_OPENJOC_SYNTHETIC_FIXTURE: /tmp/openjoc-joc.ec3
        run: |
          curl --fail --location --retry 3 \
            --output "$AURORA_OPENJOC_SYNTHETIC_FIXTURE" \
            "https://raw.githubusercontent.com/chyinan/OpenJOC/$OPENJOC_REV/crates/openjoc-wasm/testdata/joc.ec3"
          actual_blob="$(git hash-object "$AURORA_OPENJOC_SYNTHETIC_FIXTURE")"
          test "$actual_blob" = "$OPENJOC_FIXTURE_BLOB" || {
            echo "OpenJOC synthetic fixture identity mismatch: expected $OPENJOC_FIXTURE_BLOB got $actual_blob" >&2
            exit 1
          }
          actual_sha256="$(sha256sum "$AURORA_OPENJOC_SYNTHETIC_FIXTURE" | awk '{print $1}')"
          test "$actual_sha256" = "$OPENJOC_FIXTURE_SHA256" || {
            echo "OpenJOC synthetic fixture SHA-256 mismatch: expected $OPENJOC_FIXTURE_SHA256 got $actual_sha256" >&2
            exit 1
          }

          cargo run --quiet --locked -p aurora-cli \
            --no-default-features --features earc-sim \
            --bin aurora-sim-source \
            < "$AURORA_OPENJOC_SYNTHETIC_FIXTURE" \
            > /tmp/openjoc-joc.iec61937
          cargo run --quiet --locked -p aurora-cli \
            --no-default-features \
            --bin aurora-direct-earc-probe \
            -- --filter eac3 --extract eac3 \
            < /tmp/openjoc-joc.iec61937 \
            > /tmp/openjoc-joc.roundtrip.ec3
          cmp "$AURORA_OPENJOC_SYNTHETIC_FIXTURE" /tmp/openjoc-joc.roundtrip.ec3

          cargo run --quiet --locked -p aurora-cli \
            --no-default-features --features earc-sim \
            --bin aurora-sim-source \
            -- --cadence-jitter 1 \
            < "$AURORA_OPENJOC_SYNTHETIC_FIXTURE" \
            > /tmp/openjoc-joc.jitter.iec61937
          cargo run --quiet --locked -p aurora-cli \
            --no-default-features \
            --bin aurora-direct-earc-probe \
            -- --filter eac3 \
            < /tmp/openjoc-joc.jitter.iec61937 \
            > /dev/null 2> /tmp/openjoc-joc.jitter.log
          grep -q 'eac3_max_spacing_bytes=Some(25344)' /tmp/openjoc-joc.jitter.log
          grep -q 'eac3_period_mismatches=4' /tmp/openjoc-joc.jitter.log

          cargo run --quiet --locked -p aurora-cli \
            --no-default-features --features earc-sim \
            --bin aurora-sim-source \
            -- --truncated-eof \
            < "$AURORA_OPENJOC_SYNTHETIC_FIXTURE" \
            > /tmp/openjoc-joc.truncated.iec61937
          if cargo run --quiet --locked -p aurora-cli \
              --no-default-features \
              --bin aurora-direct-earc-probe \
              -- --filter eac3 \
              < /tmp/openjoc-joc.truncated.iec61937 \
              > /dev/null 2> /tmp/openjoc-joc.truncated.log; then
            echo 'truncated EOF unexpectedly passed IEC61937 finite validation' >&2
            exit 1
          fi
          grep -q 'incomplete burst' /tmp/openjoc-joc.truncated.log

          cargo test --locked -p aurora-decoder-open \
            --test openjoc_synthetic_fixture \
            synthetic_openjoc_fixture_renders_aurora_7_1_4 \
            -- --ignored --exact
          cargo test --locked -p aurora-direct-earc-decoder \
            --test openjoc_iec_fixture \
            synthetic_joc_survives_full_direct_earc_iec61937_chain \
            -- --ignored --exact

      - name: Clippy open AC3/EAC3/JOC decoder adapter
        run: cargo clippy --locked -p aurora-decoder-open --all-targets -- -D warnings

      - name: Check decoder engine lifecycle
        run: cargo check --locked -p aurora-decoder-engine --all-targets

      - name: Test decoder engine lifecycle
        run: cargo test --locked -p aurora-decoder-engine

      - name: Clippy decoder engine lifecycle
        run: cargo clippy --locked -p aurora-decoder-engine --all-targets -- -D warnings

      - name: Check direct eARC decoder bridge
        run: cargo check --locked -p aurora-direct-earc-decoder --all-targets

      - name: Test direct eARC decoder bridge
        run: cargo test --locked -p aurora-direct-earc-decoder

      - name: Clippy direct eARC decoder bridge
        run: cargo clippy --locked -p aurora-direct-earc-decoder --all-targets -- -D warnings

      - name: Check unified encoded input selector
        run: cargo check --locked -p aurora-encoded-input --all-targets

      - name: Test unified encoded input selector
        run: cargo test --locked -p aurora-encoded-input

      - name: Clippy unified encoded input selector
        run: cargo clippy --locked -p aurora-encoded-input --all-targets -- -D warnings

      - name: Check unified encoded runtime
        run: cargo check --locked -p aurora-encoded-runtime --all-targets

      - name: Test unified encoded runtime
        run: cargo test --locked -p aurora-encoded-runtime

      - name: Clippy unified encoded runtime
        run: cargo clippy --locked -p aurora-encoded-runtime --all-targets -- -D warnings

      - name: Check native ALSA input backend
        run: cargo check --locked -p aurora-alsa-input --all-targets

      - name: Test native ALSA input backend
        run: cargo test --locked -p aurora-alsa-input

      - name: Clippy native ALSA input backend
        run: cargo clippy --locked -p aurora-alsa-input --all-targets -- -D warnings

      - name: Check native ALSA output backend
        run: cargo check --locked -p aurora-alsa-output --all-targets

      - name: Test native ALSA output backend
        run: cargo test --locked -p aurora-alsa-output

      - name: Clippy native ALSA output backend
        run: cargo clippy --locked -p aurora-alsa-output --all-targets -- -D warnings

      - name: Check Linux CPAL compatibility stub
        run: cargo check --locked -p aurora-realtime-audio-cpal --all-targets

      - name: Test Linux CPAL compatibility stub
        run: cargo test --locked -p aurora-realtime-audio-cpal

      - name: Clippy Linux CPAL compatibility stub
        run: cargo clippy --locked -p aurora-realtime-audio-cpal --all-targets -- -D warnings

      - name: Check direct eARC binaries
        run: |
          cargo check --locked -p aurora-cli --bin aurora-direct-earc-ingest
          cargo check --locked -p aurora-cli --bin aurora-direct-earc-probe
          cargo check --locked -p aurora-cli --no-default-features --features earc-sim --bin aurora-sim-source
          cargo check --locked -p aurora-cli --features encoded-runtime --bin aurora-encoded-runtime

      - name: Test direct eARC binaries
        run: |
          cargo test --locked -p aurora-cli --bin aurora-direct-earc-ingest
          cargo test --locked -p aurora-cli --bin aurora-direct-earc-probe
          cargo test --locked -p aurora-cli --no-default-features --features earc-sim --bin aurora-sim-source
          cargo test --locked -p aurora-cli --features encoded-runtime --bin aurora-encoded-runtime

      - name: Clippy direct eARC binaries
        run: |
          cargo clippy --locked -p aurora-cli --bin aurora-direct-earc-ingest -- -D warnings
          cargo clippy --locked -p aurora-cli --bin aurora-direct-earc-probe -- -D warnings
          cargo clippy --locked -p aurora-cli --no-default-features --features earc-sim --bin aurora-sim-source -- -D warnings
          cargo clippy --locked -p aurora-cli --features encoded-runtime --bin aurora-encoded-runtime -- -D warnings

      - name: Enforce committed workspace lockfile
        if: always()
        run: |
          if ! git diff --quiet -- Cargo.lock; then
            echo 'Cargo.lock is stale. Commit the lockfile produced by cargo generate-lockfile.' >&2
            exit 1
          fi
