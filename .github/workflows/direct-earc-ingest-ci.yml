name: Direct eARC Ingest CI

on:
  push:
    branches:
      - feature/direct-earc-linux-ingest
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/aurora-iec61937/**"
      - "crates/aurora-decoder-open/**"
      - "crates/aurora-direct-earc-decoder/**"
      - "crates/aurora-encoded-input/**"
      - "crates/aurora-encoded-runtime/**"
      - "crates/aurora-alsa-input/**"
      - "crates/aurora-alsa-output/**"
      - "crates/aurora-realtime-audio-cpal/**"
      - "crates/aurora-dsp-basic/**"
      - "crates/aurora-spatial-runtime/**"
      - "crates/aurora-decoder-engine/**"
      - "crates/aurora-cli/Cargo.toml"
      - "crates/aurora-cli/src/bin/aurora-direct-earc-ingest.rs"
      - "crates/aurora-cli/src/bin/aurora-direct-earc-probe.rs"
      - "crates/aurora-cli/src/bin/aurora-encoded-runtime.rs"
      - ".github/workflows/direct-earc-ingest-ci.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/aurora-iec61937/**"
      - "crates/aurora-decoder-open/**"
      - "crates/aurora-direct-earc-decoder/**"
      - "crates/aurora-encoded-input/**"
      - "crates/aurora-encoded-runtime/**"
      - "crates/aurora-alsa-input/**"
      - "crates/aurora-alsa-output/**"
      - "crates/aurora-realtime-audio-cpal/**"
      - "crates/aurora-dsp-basic/**"
      - "crates/aurora-spatial-runtime/**"
      - "crates/aurora-decoder-engine/**"
      - "crates/aurora-cli/Cargo.toml"
      - "crates/aurora-cli/src/bin/aurora-direct-earc-ingest.rs"
      - "crates/aurora-cli/src/bin/aurora-direct-earc-probe.rs"
      - "crates/aurora-cli/src/bin/aurora-encoded-runtime.rs"
      - ".github/workflows/direct-earc-ingest-ci.yml"

permissions:
  contents: read

concurrency:
  group: direct-earc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  direct-earc:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy

      - name: Install Linux audio build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev pkg-config

      - name: Verify committed workspace lockfile
        run: |
          cargo metadata --format-version 1 --locked > /tmp/aurora-metadata.json
          cargo generate-lockfile
          if ! git diff --exit-code -- Cargo.lock; then
            echo 'Cargo.lock is stale; regenerate it and commit the exact dependency graph' >&2
            exit 1
          fi

      - name: Validate Linux dependency graph
        run: |
          cargo tree --locked --target x86_64-unknown-linux-gnu -i alsa-sys
          cargo tree --locked --target x86_64-unknown-linux-gnu -p aurora-realtime-audio-cpal
          if cargo tree --locked --target x86_64-unknown-linux-gnu -p aurora-realtime-audio-cpal --prefix none | grep -Eq '^cpal v[0-9]'; then
            echo 'CPAL unexpectedly entered the Linux dependency graph' >&2
            exit 1
          fi

      - name: Check formatting for direct eARC crates
        run: >-
          cargo fmt
          --package aurora-iec61937
          --package aurora-decoder-open
          --package aurora-direct-earc-decoder
          --package aurora-encoded-input
          --package aurora-encoded-runtime
          --package aurora-alsa-input
          --package aurora-alsa-output
          --package aurora-realtime-audio-cpal
          --package aurora-cli
          -- --check

      - name: Check reusable IEC61937 parser
        run: cargo check --locked -p aurora-iec61937 --all-targets

      - name: Test reusable IEC61937 parser
        run: cargo test --locked -p aurora-iec61937

      - name: Clippy reusable IEC61937 parser
        run: cargo clippy --locked -p aurora-iec61937 --all-targets -- -D warnings

      - name: Check open AC3/EAC3/JOC decoder adapter
        run: cargo check --locked -p aurora-decoder-open --all-targets

      - name: Test open AC3/EAC3/JOC decoder adapter
        run: cargo test --locked -p aurora-decoder-open

      - name: Clippy open AC3/EAC3/JOC decoder adapter
        run: cargo clippy --locked -p aurora-decoder-open --all-targets -- -D warnings

      - name: Check direct eARC decoder bridge
        run: cargo check --locked -p aurora-direct-earc-decoder --all-targets

      - name: Test direct eARC decoder bridge
        run: cargo test --locked -p aurora-direct-earc-decoder

      - name: Clippy direct eARC decoder bridge
        run: cargo clippy --locked -p aurora-direct-earc-decoder --all-targets -- -D warnings

      - name: Check unified encoded input selector
        run: cargo check --locked -p aurora-encoded-input --all-targets

      - name: Test unified encoded input selector
        run: cargo test --locked -p aurora-encoded-input

      - name: Clippy unified encoded input selector
        run: cargo clippy --locked -p aurora-encoded-input --all-targets -- -D warnings

      - name: Check unified encoded runtime
        run: cargo check --locked -p aurora-encoded-runtime --all-targets

      - name: Test unified encoded runtime
        run: cargo test --locked -p aurora-encoded-runtime

      - name: Clippy unified encoded runtime
        run: cargo clippy --locked -p aurora-encoded-runtime --all-targets -- -D warnings

      - name: Check native ALSA input backend
        run: cargo check --locked -p aurora-alsa-input --all-targets

      - name: Test native ALSA input backend
        run: cargo test --locked -p aurora-alsa-input

      - name: Clippy native ALSA input backend
        run: cargo clippy --locked -p aurora-alsa-input --all-targets -- -D warnings

      - name: Check native ALSA output backend
        run: cargo check --locked -p aurora-alsa-output --all-targets

      - name: Test native ALSA output backend
        run: cargo test --locked -p aurora-alsa-output

      - name: Clippy native ALSA output backend
        run: cargo clippy --locked -p aurora-alsa-output --all-targets -- -D warnings

      - name: Check Linux CPAL compatibility stub
        run: cargo check --locked -p aurora-realtime-audio-cpal --all-targets

      - name: Test Linux CPAL compatibility stub
        run: cargo test --locked -p aurora-realtime-audio-cpal

      - name: Clippy Linux CPAL compatibility stub
        run: cargo clippy --locked -p aurora-realtime-audio-cpal --all-targets -- -D warnings

      - name: Check direct eARC binaries
        run: |
          cargo check --locked -p aurora-cli --bin aurora-direct-earc-ingest
          cargo check --locked -p aurora-cli --bin aurora-direct-earc-probe
          cargo check --locked -p aurora-cli --features encoded-runtime --bin aurora-encoded-runtime

      - name: Test direct eARC binaries
        run: |
          cargo test --locked -p aurora-cli --bin aurora-direct-earc-ingest
          cargo test --locked -p aurora-cli --bin aurora-direct-earc-probe
          cargo test --locked -p aurora-cli --features encoded-runtime --bin aurora-encoded-runtime

      - name: Clippy direct eARC binaries
        run: |
          cargo clippy --locked -p aurora-cli --bin aurora-direct-earc-ingest -- -D warnings
          cargo clippy --locked -p aurora-cli --bin aurora-direct-earc-probe -- -D warnings
          cargo clippy --locked -p aurora-cli --features encoded-runtime --bin aurora-encoded-runtime -- -D warnings
