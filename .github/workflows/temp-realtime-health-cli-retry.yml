name: Temporary realtime health CLI retry

on:
  push:
    branches:
      - feature/realtime-health-cli

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/realtime-health-cli
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install Linux audio build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libasound2-dev
      - name: Apply and correct realtime health CLI integration
        shell: python
        run: |
          from pathlib import Path

          workflow = Path('.github/workflows/temp-realtime-health-cli-edit.yml').read_text()
          start_marker = '      - name: Apply realtime health CLI integration\n        shell: python\n        run: |\n'
          end_marker = '      - name: Format\n'
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          lines = workflow[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          exec(compile(script, '<realtime-health-cli-transform>', 'exec'))

          main = Path('crates/aurora-cli/src/main.rs')
          text = main.read_text()
          extra = '''        /// Optional machine-readable final realtime health report.\n        #[arg(long)]\n        health_report: Option<PathBuf>,\n        /// Maximum accepted p95 callback use of one block budget.\n        #[arg(long, default_value_t = 100.0)]\n        max_p95_budget_percent: f64,\n        /// Optional maximum estimated software end-to-end latency in frames.\n        #[arg(long)]\n        max_estimated_latency_frames: Option<usize>,\n'''

          render_start = text.index('    Render {')
          realtime_start = text.index('    Realtime {')
          render_block = text[render_start:realtime_start]
          if extra not in render_block:
              raise SystemExit('misplaced realtime health fields were not found in Render')
          render_block = render_block.replace(extra, '', 1)
          text = text[:render_start] + render_block + text[realtime_start:]

          realtime_start = text.index('    Realtime {')
          duplex_start = text.index('    Duplex {', realtime_start)
          realtime_block = text[realtime_start:duplex_start]
          if extra not in realtime_block:
              marker = '        renderer_mode: CliRendererMode,\n'
              if marker not in realtime_block:
                  raise SystemExit('Realtime renderer_mode marker not found')
              realtime_block = realtime_block.replace(marker, marker + extra, 1)
              text = text[:realtime_start] + realtime_block + text[duplex_start:]

          main.write_text(text)
      - name: Format
        run: cargo fmt --all
      - name: Check CLI with all features
        run: cargo check -p aurora-cli --all-features
      - name: Test CLI with all features
        run: cargo test -p aurora-cli --all-features
      - name: Commit generated edit and remove temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-realtime-health-cli-edit.yml .github/workflows/temp-realtime-health-cli-retry.yml
          git add crates/aurora-cli/Cargo.toml crates/aurora-cli/src/main.rs Cargo.lock
          git commit -m "feat: expose realtime health acceptance in CLI"
          git push origin HEAD:feature/realtime-health-cli
