name: Temporary final workspace clippy

on:
  push:
    branches:
      - refactor/runtime-materialize-delay-v1

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[final-clippy-bot]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/runtime-materialize-delay-v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux audio build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Remove stale sustained-soak engine import
        shell: python
        run: |
          from pathlib import Path
          path = Path('crates/aurora-realtime-acceptance/examples/sustained_soak.rs')
          text = path.read_text()
          old = '    BasicRendererMode, ProcessStatus, RealTimeEngine, RealTimeEngineConfig, RealTimeFault,\n    TestSignal,\n'
          new = '    BasicRendererMode, ProcessStatus, RealTimeEngineConfig, RealTimeFault, TestSignal,\n'
          if old not in text:
              raise SystemExit('sustained soak stale import anchor missing')
          path.write_text(text.replace(old, new, 1))
      - name: Format and run full workspace clippy
        run: |
          cargo fmt --all
          cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/aurora-realtime-acceptance/examples/sustained_soak.rs
          git commit -m "Remove stale sustained soak engine import [final-clippy-bot]"
          git push origin HEAD:refactor/runtime-materialize-delay-v1
