name: Streaming Surround 7.1.4 Channel-Bed CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "validation/streaming/**"
      - "config/aurora-codec-bundles-v1.json"
      - "config/aurora-audio-component-contracts-v1.json"
      - "config/aurora-lean-audio-profile-v1.json"
      - "validation/physical/run-live-earc-vbap.sh"
      - "docs/streaming-surround-priority.md"
      - ".github/workflows/streaming-surround-7-1-4-ci.yml"

permissions:
  contents: read

jobs:
  channel-bed-7-1-4:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg and probe tools
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Verify actual AC-3 and E-AC-3 5.1 codec -> 12-channel Aurora PCM
        run: python3 validation/streaming/test_streaming_bed.py
      - name: Test real live encoded AC3/DD+ self-switching codec runner
        run: python3 validation/streaming/test_auto_bed.py
      - name: Test bounded fail-closed IEC streaming monitor and corrupt padding
        run: python3 validation/streaming/test_iec_live_monitor.py
      - name: Test complete eARC entrypoint with automatic AC3/DD+ switching
        run: python3 validation/streaming/test_live_entrypoint.py
      - name: Test multichannel LPCM ingress into 7.1.4
        run: python3 validation/streaming/test_lpcm_ingress.py
      - name: Enforce honest codec registry including MAT, TrueHD, DTS and AC-4
        run: python3 validation/streaming/test_format_routes.py
      - name: Exercise format-change/muted decoder generation tests
        run: python3 validation/streaming/test_stream_epoch.py
      - name: Verify upgrade ABI pairs and fail-closed A/B rollback
        run: |
          python3 validation/streaming/aurora_decoder_upgrade.py config/aurora-codec-bundles-v1.json
          python3 validation/streaming/test_decoder_upgrade.py
      - name: Enforce stable seven-stage audio API and fail-closed component upgrades
        run: |
          python3 validation/streaming/aurora_component_contracts.py config/aurora-audio-component-contracts-v1.json
          python3 validation/streaming/test_component_upgrades.py
      - name: Reject redundant decoder/renderer/DSP runtime projects
        run: |
          python3 validation/streaming/aurora_lean_profile.py config/aurora-lean-audio-profile-v1.json
          python3 validation/streaming/test_lean_profile.py
      - name: Baseline FFmpeg 5.1-to-12ch throughput smoke without speed claims
        run: python3 validation/streaming/aurora_codec_perf.py --candidate-bin ffmpeg --fixture-seconds 4 --runs 2
      - name: Check live eARC runner shell syntax
        run: bash -n validation/physical/run-live-earc-vbap.sh
      - name: Check streaming scripts compile
        run: python3 -m py_compile validation/streaming/*.py
