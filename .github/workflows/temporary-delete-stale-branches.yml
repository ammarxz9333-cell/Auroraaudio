name: Temporary delete stale branches

on:
  push:
    branches:
      - main-v2

permissions:
  contents: write

jobs:
  cleanup:
    if: "!contains(github.event.head_commit.message, '[branch-cleanup-bot]')"
    runs-on: ubuntu-latest
    steps:
      - name: Delete every non-main branch and verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branches_file="$(mktemp)"
          page=1
          while :; do
            response="$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/branches?per_page=100&page=$page")"
            count="$(jq 'length' <<<"$response")"
            [ "$count" -eq 0 ] && break
            jq -r '.[].name' <<<"$response" >> "$branches_file"
            page=$((page + 1))
          done

          sort -u "$branches_file" -o "$branches_file"
          echo "Discovered $(wc -l < "$branches_file") branches before cleanup."

          failures=0
          while IFS= read -r branch; do
            [ -z "$branch" ] && continue
            [ "$branch" = "main-v2" ] && continue
            ref="heads/$branch"
            encoded_ref="$(printf '%s' "$ref" | jq -sRr @uri)"
            body="$(mktemp)"
            code="$(curl -sS -o "$body" -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/git/refs/$encoded_ref")"
            if [ "$code" = "204" ]; then
              echo "deleted: $branch"
            else
              echo "FAILED: $branch (HTTP $code): $(cat "$body")" >&2
              failures=$((failures + 1))
            fi
            rm -f "$body"
          done < "$branches_file"

          remaining="$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/branches?per_page=100" | jq -r '.[].name')"
          printf 'Remaining branches:\n%s\n' "$remaining"

          test "$failures" -eq 0
          test "$remaining" = "main-v2"
