name: Aurora Moving JOC CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "validation/immersive/test-joc-aurora-moving.sh"
      - "validation/immersive/aurora_joc_moving_evidence.py"
      - "validation/immersive/test-dolby-official-joc-temporal.sh"
      - "validation/immersive/test-joc-stack.sh"
      - "validation/immersive/joc_temporal_evidence.py"
      - "validation/immersive/install-openjoc-reference.sh"
      - "config/external-components-v1.json"
      - ".github/workflows/aurora-moving-joc-ci.yml"

permissions:
  contents: read

concurrency:
  group: aurora-moving-joc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  moving-joc-through-aurora:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo and external JOC builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cache/joc-moving
          key: ${{ runner.os }}-moving-joc-${{ hashFiles('Cargo.lock', 'config/external-components-v1.json', 'validation/immersive/omniphony-v0.5.2-low-latency-stdout.patch') }}
          restore-keys: |
            ${{ runner.os }}-moving-joc-
            ${{ runner.os }}-joc-
      - name: Install host audio tooling
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg libasound2-dev libpipewire-0.3-dev
      - name: Self-test Aurora moving-evidence analyzer
        run: python3 validation/immersive/aurora_joc_moving_evidence.py self-test
      - name: Install checksum-pinned OpenJOC reference binary
        id: openjoc
        shell: bash
        run: |
          OPENJOC_BIN="$(bash validation/immersive/install-openjoc-reference.sh "${{ runner.temp }}/openjoc-reference")"
          echo "bin=$OPENJOC_BIN" >> "$GITHUB_OUTPUT"
      - name: Exercise moving JOC through Harletty and Omniphony
        shell: bash
        env:
          OPENJOC_BIN: ${{ steps.openjoc.outputs.bin }}
          AURORA_JOC_BUILD_MODE: release
          AURORA_HARLETTY_TARGET_DIR: ${{ github.workspace }}/.cache/joc-moving/harletty-target
          AURORA_OMNIP_TARGET_DIR: ${{ github.workspace }}/.cache/joc-moving/omniphony-target
          AURORA_JOC_HARNESS_TARGET_DIR: ${{ github.workspace }}/.cache/joc-moving/baseline-harness-target
          AURORA_MOVING_JOC_HARNESS_TARGET_DIR: ${{ github.workspace }}/.cache/joc-moving/moving-harness-target
        run: >-
          bash validation/immersive/test-joc-aurora-moving.sh
          "${{ runner.temp }}/aurora-moving-joc"
      - name: Upload Aurora moving-JOC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-moving-joc-${{ github.sha }}
          path: |
            ${{ runner.temp }}/aurora-moving-joc/reference/derivation.json
            ${{ runner.temp }}/aurora-moving-joc/reference/original-openjoc-inspect.json
            ${{ runner.temp }}/aurora-moving-joc/reference/temporal/joc-temporal-evidence.json
            ${{ runner.temp }}/aurora-moving-joc/aurora-moving/aurora-bridge-telemetry.json
            ${{ runner.temp }}/aurora-moving-joc/aurora-moving/pacing.json
            ${{ runner.temp }}/aurora-moving-joc/aurora-moving/aurora-joc-moving-evidence.json
            ${{ runner.temp }}/aurora-moving-joc/aurora-moving/orender-unpaced.log
            ${{ runner.temp }}/aurora-moving-joc/aurora-moving/orender-paced.log
          if-no-files-found: warn
          retention-days: 14
