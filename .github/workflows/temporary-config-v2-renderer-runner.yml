name: Temporary config v2 renderer runner

on:
  push:
    branches:
      - feature/config-renderer-component-ref-v2

permissions:
  contents: write

jobs:
  implement:
    if: "!contains(github.event.head_commit.message, '[config-v2-bot]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/config-renderer-component-ref-v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux audio build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Extract and run renderer component-reference patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/temporary-config-v2-renderer.yml').read_text()
          start = source.index('          from pathlib import Path\n')
          end = source.index('      - name: Refresh lockfile and validate renderer reference slice\n')
          block = source[start:end]
          lines = []
          for line in block.splitlines():
              if line.startswith('          '):
                  line = line[10:]
              lines.append(line)
          Path('/tmp/config_v2_patch.py').write_text('\n'.join(lines) + '\n')
          PY
          python /tmp/config_v2_patch.py
      - name: Fix migration borrow scopes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('crates/aurora-config/src/migration.rs')
          text = p.read_text()
          old = 'root\n        .get_mut("schema")\n        .and_then(serde_json::Value::as_object_mut)'
          new = 'root\n        .get("schema")\n        .and_then(serde_json::Value::as_object)'
          if text.count(old) != 1:
              raise SystemExit(f'expected one initial schema borrow, found {text.count(old)}')
          text = text.replace(old, new, 1)
          anchor = '    root.insert("renderer".to_owned(), migrated_renderer);\n    schema.insert('
          replacement = '    root.insert("renderer".to_owned(), migrated_renderer);\n    let schema = root\n        .get_mut("schema")\n        .and_then(serde_json::Value::as_object_mut)\n        .ok_or_else(|| {\n            migration_error(\n                ErrorCode::UnsupportedMigration,\n                "schema",\n                "schema metadata is missing",\n            )\n        })?;\n    schema.insert('
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one schema reborrow anchor, found {text.count(anchor)}')
          p.write_text(text.replace(anchor, replacement, 1))
          PY
      - name: Refresh lockfile and validate renderer reference slice
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo check --workspace --all-targets --all-features
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test -p aurora-config -p aurora-runtime-assembly -p aurora-runtime-inspection --all-features --locked
          cargo test -p aurora-runtime-materialization -p aurora-realtime-engine --all-features --locked
          if grep -RIn 'RendererConfiguration' crates/aurora-config crates/aurora-runtime-assembly; then
            echo 'legacy RendererConfiguration remains in current config/runtime assembly' >&2
            exit 1
          fi
      - name: Commit production slice
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "aurora-config-v2-bot"
          git config user.email "aurora-config-v2-bot@users.noreply.github.com"
          git add Cargo.lock crates fixtures docs
          git status --short
          git commit -m "Migrate renderer selection to component references [config-v2-bot]"
          git push origin HEAD:feature/config-renderer-component-ref-v2
