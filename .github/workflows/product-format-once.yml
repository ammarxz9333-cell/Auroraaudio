name: Product Format Once

on:
  push:
    branches:
      - product/q995-clean-baseline

permissions:
  contents: write

jobs:
  format:
    if: ${{ !startsWith(github.event.head_commit.message, 'style(product):') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/q995-clean-baseline
      - uses: dtolnay/rust-toolchain@1.78.0
        with:
          components: rustfmt
      - name: Apply canonical Rust formatting
        run: cargo fmt --all
      - name: Commit formatting only when changed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Formatting already current"
            exit 0
          fi
          git config user.name "aurora-ci"
          git config user.email "aurora-ci@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "style(product): apply canonical rustfmt"
          git push origin HEAD:product/q995-clean-baseline
