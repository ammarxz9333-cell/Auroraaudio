name: OpenJOC Autoformat Once

on:
  push:
    branches:
      - codex/openjoc-speaker-fail-closed
    paths:
      - ".github/workflows/openjoc-autoformat-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/openjoc-speaker-fail-closed
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt
      - name: Format OpenJOC adapter
        run: rustfmt --edition 2021 crates/aurora-decoder-open/src/openjoc_native.rs
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet -- crates/aurora-decoder-open/src/openjoc_native.rs; then
            echo "OpenJOC adapter already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/aurora-decoder-open/src/openjoc_native.rs
          git commit -m "Format OpenJOC production adapter"
          git push origin HEAD:codex/openjoc-speaker-fail-closed
