name: S6 Appliance CI

on:
  workflow_dispatch:
  push:
    branches:
      - agent/aurora-s6-appliance-bootstrap
    paths:
      - "platform/s6/**"
      - "protocol/**"
      - "firmware/stm32h753/**"
      - "crates/aurora-usb-protocol/**"
      - ".github/workflows/s6-appliance-ci.yml"
  pull_request:
    paths:
      - "platform/s6/**"
      - "protocol/**"
      - "firmware/stm32h753/**"
      - "crates/aurora-usb-protocol/**"
      - ".github/workflows/s6-appliance-ci.yml"

permissions:
  contents: read

jobs:
  host-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.78.0
      - name: Validate pinned Omniphony low-latency stdout patch
        run: sh platform/s6/scripts/test-omniphony-low-latency-patch.sh
      - name: Test Aurora USB Rust wire protocol
        run: cargo test --locked --manifest-path crates/aurora-usb-protocol/Cargo.toml
      - name: Test shared C streaming parser
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -Iprotocol \
            protocol/aurora_usb_stream_v1.c \
            protocol/test_aurora_usb_stream_v1.c \
            -o /tmp/test-aurora-usb-stream
          /tmp/test-aurora-usb-stream
      - name: Compile direct IEC61937 live immersive broker
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            -Iprotocol \
            platform/s6/live-ingest/aurora-live-ingest.c \
            -lm -o /tmp/aurora-live-ingest
      - name: Test live immersive broker end-to-end with mock renderer
        run: |
          chmod +x platform/s6/live-ingest/mock_orender.py
          python3 platform/s6/live-ingest/test_live_ingest.py \
            /tmp/aurora-live-ingest \
            platform/s6/live-ingest/mock_orender.py
      - name: Compile FunctionFS bridge with warnings as errors
        run: |
          cc -D_GNU_SOURCE -std=c11 -O2 -Wall -Wextra -Werror -Iprotocol \
            platform/s6/usb-gadget/aurora-ffs-daemon.c \
            protocol/aurora_usb_stream_v1.c \
            -o /tmp/aurora-ffs-daemon
      - name: Test portable STM32 transport state machine
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            -Iprotocol -Ifirmware/stm32h753/include \
            protocol/aurora_usb_stream_v1.c \
            firmware/stm32h753/src/aurora_transport.c \
            firmware/stm32h753/test/test_aurora_transport.c \
            -o /tmp/test-aurora-stm32-transport
          /tmp/test-aurora-stm32-transport
      - name: Test STM32 eARC IEC61937 capture-to-USB handoff
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            -Iprotocol -Ifirmware/stm32h753/include \
            protocol/aurora_usb_stream_v1.c \
            firmware/stm32h753/src/aurora_transport.c \
            firmware/stm32h753/src/aurora_iec61937_capture.c \
            firmware/stm32h753/test/test_aurora_iec61937_capture.c \
            -o /tmp/test-aurora-iec61937-capture
          /tmp/test-aurora-iec61937-capture
      - name: Check S6 shell script syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in platform/s6/scripts/*.sh platform/s6/initramfs/init; do
            bash -n "$f"
          done
      - name: Verify protocol version agrees across implementations
        shell: bash
        run: |
          set -euo pipefail
          grep -q '#define AURORA_USB_VERSION 1u' protocol/aurora_usb_v1.h
          grep -q 'pub const VERSION: u16 = 1;' crates/aurora-usb-protocol/src/lib.rs
          grep -q 'protocol_version = 1' docs/AURORA_USB_S6_STM32_PROTOCOL.md
