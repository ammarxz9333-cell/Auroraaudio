name: S6 Appliance CI

on:
  workflow_dispatch:
  push:
    branches:
      - agent/aurora-s6-appliance-bootstrap
    paths:
      - "platform/s6/**"
      - "protocol/**"
      - "firmware/**"
      - "config/aurora-hardware-target.env"
      - "crates/aurora-usb-protocol/**"
      - "crates/aurora-cli/**"
      - "crates/aurora-realtime-engine/**"
      - "crates/aurora-measurement/**"
      - ".github/workflows/s6-appliance-ci.yml"
  pull_request:
    paths:
      - "platform/s6/**"
      - "protocol/**"
      - "firmware/**"
      - "config/aurora-hardware-target.env"
      - "crates/aurora-usb-protocol/**"
      - "crates/aurora-cli/**"
      - "crates/aurora-realtime-engine/**"
      - "crates/aurora-measurement/**"
      - ".github/workflows/s6-appliance-ci.yml"

permissions:
  contents: read

jobs:
  host-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.78.0
        with:
          components: rustfmt, clippy
      - name: Install Linux audio build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libasound2-dev
      - name: Validate realtime MCU target manifest
        shell: bash
        run: |
          set -euo pipefail
          source config/aurora-hardware-target.env
          test -n "$AURORA_REALTIME_MCU_ROLE"
          test -n "$AURORA_REALTIME_MCU_VENDOR"
          test -n "$AURORA_REALTIME_MCU_FAMILY"
          test -n "$AURORA_REALTIME_MCU_PART"
          test -n "$AURORA_REALTIME_MCU_PACKAGE"
          test -d "$AURORA_REALTIME_MCU_SOURCE_DIR/include"
          test -d "$AURORA_REALTIME_MCU_SOURCE_DIR/src"
          test -d "$AURORA_REALTIME_MCU_SOURCE_DIR/test"
          test "$AURORA_REALTIME_MCU_USB_HS_HOST" = 1
          test "$AURORA_REALTIME_MCU_USB_HS_PHY" = ULPI
          test "$AURORA_REALTIME_MCU_ULPI_DIRECT_PINS" = 1
          test "$AURORA_REALTIME_MCU_SAI_RX" = 1
          test "$AURORA_REALTIME_MCU_SAI_TDM_TX" = 1
          test "$AURORA_REALTIME_MCU_DMA" = 1
          test "$AURORA_REALTIME_MCU_SAMPLE_RATE" = 48000
          test "$AURORA_REALTIME_MCU_CHANNELS" = 12
          test "$AURORA_REALTIME_MCU_PERIOD_FRAMES" = 40
          test "$AURORA_REALTIME_MCU_PINMUX_STATUS" = datasheet_verified
          test -n "$AURORA_REALTIME_MCU_PINMUX_PROOF"
          test "$AURORA_REALTIME_MCU_HAL_STATUS" = not_implemented
          test "$AURORA_REALTIME_MCU_PHYSICAL_STATUS" = not_measured

          # The S6 must remain powered while it is the active USB data device.
          # Require a BC1.2 charging downstream port, not a 500 mA SDP-only PHY.
          test "$AURORA_USB_PHY_INTERFACE" = ULPI
          test "$AURORA_USB_PHY_BC_SPEC" = BC1.2
          test "$AURORA_USB_PHY_PORT_MODE" = CDP
          test "$AURORA_USB_PHY_CDP_CURRENT_MA" -ge 1500
          test "$AURORA_USB_PHY_ULPI_CLOCK_HZ" = 60000000
          test "$AURORA_USB_PHY_REFERENCE_HZ" = 24000000
          test "$AURORA_USB_PHY_REFSEL" = 111
          test "$AURORA_USB_PHY_RESET_ACTIVE_LOW" = 1
          test "$AURORA_USB_PHY_VBUS_ENABLE_SIGNAL" = CPEN
          test "$AURORA_USB_PHY_STATUS" = datasheet_verified

          # VBUS is a protected power rail, not a raw 5 V GPIO-controlled feed.
          test "$AURORA_USB_VBUS_TARGET_MA" -ge 1500
          test "$AURORA_USB_VBUS_SWITCH_MAX_CONTINUOUS_MA" -ge "$AURORA_USB_VBUS_TARGET_MA"
          test "$AURORA_USB_VBUS_SWITCH_ADJUSTABLE_ILIM" = 1
          test "$AURORA_USB_VBUS_SWITCH_REVERSE_BLOCKING" = 1
          test "$AURORA_USB_VBUS_SWITCH_FAULT_OUTPUT" = 1
          test "$AURORA_USB_VBUS_STATUS" = datasheet_verified

          # The canonical pin map must not assign one MCU pin to two live roles.
          duplicate_pins="$(sed -n 's/^AURORA_PIN_[^=]*=//p' config/aurora-hardware-target.env | sort | uniq -d)"
          test -z "$duplicate_pins" || {
            echo "duplicate realtime-MCU pin assignments:" >&2
            echo "$duplicate_pins" >&2
            exit 1
          }

          # Current target proof uses the documented alternate functions for
          # direct ULPI, SAI capture and TDM output.
          for v in \
            AURORA_AF_ULPI_STP AURORA_AF_ULPI_DIR AURORA_AF_ULPI_NXT \
            AURORA_AF_ULPI_CLK AURORA_AF_ULPI_D0 AURORA_AF_ULPI_D1 \
            AURORA_AF_ULPI_D2 AURORA_AF_ULPI_D3 AURORA_AF_ULPI_D4 \
            AURORA_AF_ULPI_D5 AURORA_AF_ULPI_D6 AURORA_AF_ULPI_D7
          do
            test "${!v}" = 10
          done
          for v in AURORA_AF_EARC_FS AURORA_AF_EARC_SCK AURORA_AF_EARC_SD; do
            test "${!v}" = 6
          done
          for v in AURORA_AF_TDM_FS AURORA_AF_TDM_SCK AURORA_AF_TDM_SD AURORA_AF_TDM_MCLK; do
            test "${!v}" = 10
          done
      - name: Validate pinned Omniphony low-latency stdout patch
        run: sh platform/s6/scripts/test-omniphony-low-latency-patch.sh
      - name: Audit S6 runtime wiring and duplication
        run: sh platform/s6/scripts/audit-runtime-wiring.sh
      - name: Test Aurora USB Rust wire protocol
        run: cargo test --locked --manifest-path crates/aurora-usb-protocol/Cargo.toml
      - name: Format build and test S6 Rust runtime features on MSRV
        run: |
          cargo fmt --all --check
          cargo check --locked -p aurora-cli --no-default-features --features realtime --bin aurora-s6-postprocess
          cargo build --locked -p aurora-cli --no-default-features --features realtime --bin aurora-s6-postprocess
          cargo test --locked -p aurora-cli --no-default-features --features realtime --bin aurora-s6-postprocess
          cargo test --locked -p aurora-measurement
      - name: Test shared C streaming parser
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -Iprotocol \
            protocol/aurora_usb_stream_v1.c \
            protocol/test_aurora_usb_stream_v1.c \
            -o /tmp/test-aurora-usb-stream
          /tmp/test-aurora-usb-stream
      - name: Compile direct IEC61937 live immersive broker
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            -Iprotocol \
            platform/s6/live-ingest/aurora-live-ingest.c \
            -lm -o /tmp/aurora-live-ingest
      - name: Test live immersive broker end-to-end with mock renderer
        run: |
          chmod +x platform/s6/live-ingest/mock_orender.py
          python3 platform/s6/live-ingest/test_live_ingest.py \
            /tmp/aurora-live-ingest \
            platform/s6/live-ingest/mock_orender.py
      - name: Test broker postprocessor ASRC and recovery integration
        run: |
          chmod +x platform/s6/live-ingest/test_live_postprocess.py
          python3 platform/s6/live-ingest/test_live_postprocess.py \
            /tmp/aurora-live-ingest \
            platform/s6/live-ingest/mock_orender.py \
            target/debug/aurora-s6-postprocess
      - name: Compile FunctionFS bridge with warnings as errors
        run: |
          cc -D_GNU_SOURCE -std=c11 -O2 -Wall -Wextra -Werror -Iprotocol \
            platform/s6/usb-gadget/aurora-ffs-daemon.c \
            protocol/aurora_usb_stream_v1.c \
            -o /tmp/aurora-ffs-daemon
      - name: Test portable realtime-MCU transport state machine
        shell: bash
        run: |
          set -euo pipefail
          source config/aurora-hardware-target.env
          MCU="$AURORA_REALTIME_MCU_SOURCE_DIR"
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            -Iprotocol -I"$MCU/include" \
            protocol/aurora_usb_stream_v1.c \
            "$MCU/src/aurora_transport.c" \
            "$MCU/test/test_aurora_transport.c" \
            -o /tmp/test-aurora-mcu-transport
          /tmp/test-aurora-mcu-transport
      - name: Test realtime-MCU eARC IEC61937 capture-to-USB handoff
        shell: bash
        run: |
          set -euo pipefail
          source config/aurora-hardware-target.env
          MCU="$AURORA_REALTIME_MCU_SOURCE_DIR"
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            -Iprotocol -I"$MCU/include" \
            protocol/aurora_usb_stream_v1.c \
            "$MCU/src/aurora_transport.c" \
            "$MCU/src/aurora_iec61937_capture.c" \
            "$MCU/test/test_aurora_iec61937_capture.c" \
            -o /tmp/test-aurora-mcu-iec61937-capture
          /tmp/test-aurora-mcu-iec61937-capture
      - name: Test integrated realtime-MCU Aurora audio app core
        shell: bash
        run: |
          set -euo pipefail
          source config/aurora-hardware-target.env
          MCU="$AURORA_REALTIME_MCU_SOURCE_DIR"
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            -Iprotocol -I"$MCU/include" \
            protocol/aurora_usb_stream_v1.c \
            "$MCU/src/aurora_transport.c" \
            "$MCU/src/aurora_iec61937_capture.c" \
            "$MCU/src/aurora_stm32_audio_app.c" \
            "$MCU/test/test_aurora_stm32_audio_app.c" \
            -o /tmp/test-aurora-mcu-audio-app
          /tmp/test-aurora-mcu-audio-app
      - name: Check S6 shell script syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in platform/s6/scripts/*.sh platform/s6/initramfs/init firmware/*.sh; do
            bash -n "$f"
          done
      - name: Verify protocol appliance and hardware-target contracts agree
        shell: bash
        run: |
          set -euo pipefail
          source config/aurora-hardware-target.env
          MCU="$AURORA_REALTIME_MCU_SOURCE_DIR"
          grep -q '#define AURORA_USB_VERSION 1u' protocol/aurora_usb_v1.h
          grep -q 'pub const VERSION: u16 = 1;' crates/aurora-usb-protocol/src/lib.rs
          grep -q 'protocol_version = 1' docs/AURORA_USB_S6_STM32_PROTOCOL.md
          grep -q '#define AURORA_USB_PERIOD_FRAMES 40u' protocol/aurora_usb_v1.h
          grep -q 'pub const DEFAULT_PERIOD_FRAMES: u16 = 40;' crates/aurora-usb-protocol/src/lib.rs
          grep -q 'period_frames = 40' docs/AURORA_USB_S6_STM32_PROTOCOL.md
          test "$AURORA_REALTIME_MCU_PERIOD_FRAMES" = 40
          test "$AURORA_REALTIME_MCU_SAMPLE_RATE" = 48000
          test "$AURORA_REALTIME_MCU_CHANNELS" = 12
          grep -q '^AURORA_BLOCK_FRAMES=40$' platform/s6/rootfs/etc/aurora/aurora.env
          grep -q '^HARLETTY_VERSION=v0.7.3$' platform/s6/rootfs/etc/aurora/aurora.env
          grep -q 'HARLETTY_VERSION="${HARLETTY_VERSION:-v0.7.3}"' platform/s6/scripts/build-userspace-native-aarch64.sh
          grep -q '^OMNIPHONY_VERSION=v0.5.2$' platform/s6/rootfs/etc/aurora/aurora.env
          grep -q 'OMNIPHONY_VERSION="${OMNIPHONY_VERSION:-v0.5.2}"' platform/s6/scripts/build-userspace-native-aarch64.sh
          grep -q '^NAVIDROME_VERSION=0.63.2$' platform/s6/rootfs/etc/aurora/aurora.env
          grep -q 'NAVIDROME_VERSION="${NAVIDROME_VERSION:-0.63.2}"' platform/s6/scripts/build-userspace-native-aarch64.sh
          grep -q '05063560d6c5c1b7d3709656cd8c644a6d2b52f5e81383771f26323442d0a244' docs/AURORA_USB_S6_STM32_PROTOCOL.md
          grep -q '#define BRIDGE_SOCKET RUN_DIR "/usb-bridge.sock"' platform/s6/usb-gadget/aurora-ffs-daemon.c
          grep -q '#define BRIDGE_SOCKET "/run/aurora/usb-bridge.sock"' platform/s6/live-ingest/aurora-live-ingest.c
          grep -q 'usb_enabled ? listen_fd : -1' platform/s6/usb-gadget/aurora-ffs-daemon.c
          grep -q 'close_endpoint(backend_fd);' platform/s6/usb-gadget/aurora-ffs-daemon.c
          grep -q 'aurora_iec61937_capture_forward_stream_block' "$MCU/src/aurora_stm32_audio_app.c"
      - name: Strict lint for new S6 Rust surfaces
        run: |
          cargo clippy --locked -p aurora-cli --no-default-features --features realtime --bin aurora-s6-postprocess --no-deps -- -D warnings
          cargo clippy --locked -p aurora-measurement --all-targets --no-deps -- -D warnings
