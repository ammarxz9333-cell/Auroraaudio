name: Open Audio Stack CI

on:
  pull_request:
    paths:
      - "crates/aurora-realtime-audio-api/**"
      - "crates/aurora-realtime-audio-sim/**"
      - "crates/aurora-realtime-engine/**"
      - "crates/aurora-runtime-materialization/**"
      - "config/open-audio-stack-v1.json"
      - "config/external-components-v1.json"
      - "validation/open-audio-stack/**"
      - "docs/adr/0021-open-pro-audio-stack-integration.md"
      - "THIRD_PARTY_LICENSES.md"
      - "AGENTS.md"
      - ".github/workflows/open-audio-stack-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: open-audio-stack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AOO_SHA: dc2a5be2962ba02d6cebe297f31f2774f34e7bc7
  GENAVB_SHA: 6b962d6c34b0c3f142295a213dfa70bda193b23d
  ESP_AVB_SHA: 5e75bd3ed91b5407a254a5e49bfc18fc35e6cbb9
  ESP_PTP_SHA: 5b7eec233a93733ae954beefb6df3bb9c12dc901
  SOF_SHA: 11cfcaf8f46d5c02b1c30e8394d10351ccd00e7c
  LIBSPATIALAUDIO_SHA: d149ed9744fd399b835c6f2920511f8cbcfce5ea

jobs:
  pinned-open-audio-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Validate touched Rust boundaries
        run: |
          cargo fmt --all --check
          cargo check --locked --all-targets --all-features \
            -p aurora-realtime-audio-api \
            -p aurora-realtime-audio-sim \
            -p aurora-realtime-engine \
            -p aurora-runtime-materialization
          cargo clippy --locked --all-targets --all-features \
            -p aurora-realtime-audio-api \
            -p aurora-realtime-audio-sim \
            -p aurora-realtime-engine \
            -p aurora-runtime-materialization -- -D warnings
          cargo test --locked --all-features \
            -p aurora-realtime-audio-api \
            -p aurora-realtime-audio-sim \
            -p aurora-realtime-engine \
            -p aurora-runtime-materialization

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config

      - name: Fetch exact AOO candidate
        run: |
          git init "$RUNNER_TEMP/aoo"
          git -C "$RUNNER_TEMP/aoo" remote add origin https://github.com/Spacechild1/aoo.git
          git -C "$RUNNER_TEMP/aoo" fetch --depth 1 origin "$AOO_SHA"
          git -C "$RUNNER_TEMP/aoo" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/aoo" rev-parse HEAD)" = "$AOO_SHA"
          git -C "$RUNNER_TEMP/aoo" submodule update --init --recursive

      - name: Build exact AOO C API
        run: |
          cmake -S "$RUNNER_TEMP/aoo" -B "$RUNNER_TEMP/aoo-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/aoo-install" \
            -DAOO_USE_OPUS=OFF \
            -DAOO_BUILD_SHARED_LIBRARY=ON \
            -DAOO_BUILD_TESTS=ON \
            -DAOO_BUILD_EXAMPLES=OFF \
            -DAOO_BUILD_SERVER=OFF
          cmake --build "$RUNNER_TEMP/aoo-build" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/aoo-build" --output-on-failure
          cmake --install "$RUNNER_TEMP/aoo-build"
          test -f "$RUNNER_TEMP/aoo/include/aoo.h"

      - name: Exercise AOO with Aurora 7.1.4 transport contract
        run: |
          mkdir -p artifacts
          export PKG_CONFIG_PATH="$RUNNER_TEMP/aoo-install/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          cc -std=c11 -Wall -Wextra -Werror \
            validation/open-audio-stack/aoo_aurora_contract_probe.c \
            -o "$RUNNER_TEMP/aoo-aurora-contract-probe" \
            $(pkg-config --cflags --libs aoo)
          LD_LIBRARY_PATH="$RUNNER_TEMP/aoo-install/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            "$RUNNER_TEMP/aoo-aurora-contract-probe" | tee artifacts/aoo-aurora-contract.txt
          grep -q 'PASS channels=12 rate=48000 block=48 codec=pcm-f32' artifacts/aoo-aurora-contract.txt

      - name: Fetch exact libspatialaudio candidate
        run: |
          git init "$RUNNER_TEMP/libspatialaudio"
          git -C "$RUNNER_TEMP/libspatialaudio" remote add origin https://github.com/videolan/libspatialaudio.git
          git -C "$RUNNER_TEMP/libspatialaudio" fetch --depth 1 origin "$LIBSPATIALAUDIO_SHA"
          git -C "$RUNNER_TEMP/libspatialaudio" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/libspatialaudio" rev-parse HEAD)" = "$LIBSPATIALAUDIO_SHA"

      - name: Build and test exact libspatialaudio
        run: |
          cmake -S "$RUNNER_TEMP/libspatialaudio" -B "$RUNNER_TEMP/libspatialaudio-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/libspatialaudio-install" \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TESTING=ON
          cmake --build "$RUNNER_TEMP/libspatialaudio-build" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/libspatialaudio-build" --output-on-failure
          cmake --install "$RUNNER_TEMP/libspatialaudio-build"

      - name: Exercise libspatialaudio with Aurora 7.1.4 render contract
        run: |
          export PKG_CONFIG_PATH="$RUNNER_TEMP/libspatialaudio-install/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          c++ -std=c++17 -Wall -Wextra -Werror \
            validation/open-audio-stack/libspatialaudio_aurora_probe.cpp \
            -o "$RUNNER_TEMP/libspatialaudio-aurora-probe" \
            $(pkg-config --cflags --libs spatialaudio)
          LD_LIBRARY_PATH="$RUNNER_TEMP/libspatialaudio-install/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            "$RUNNER_TEMP/libspatialaudio-aurora-probe" | tee artifacts/libspatialaudio-aurora-contract.txt
          grep -q 'PASS outputs=12 rate=48000 block=256' artifacts/libspatialaudio-aurora-contract.txt

      - name: Fetch exact NXP GenAVB TSN candidate
        run: |
          git init "$RUNNER_TEMP/genavb"
          git -C "$RUNNER_TEMP/genavb" remote add origin https://github.com/NXP/GenAVB_TSN.git
          git -C "$RUNNER_TEMP/genavb" fetch --depth 1 origin "$GENAVB_SHA"
          git -C "$RUNNER_TEMP/genavb" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/genavb" rev-parse HEAD)" = "$GENAVB_SHA"
          test -d "$RUNNER_TEMP/genavb/api"
          test -d "$RUNNER_TEMP/genavb/gptp"
          test -d "$RUNNER_TEMP/genavb/avtp"
          grep -q 'i.MX 8MP' "$RUNNER_TEMP/genavb/README.md"

      - name: Fetch exact ESP-AVB and ESP-PTP candidates
        run: |
          git init "$RUNNER_TEMP/esp-avb"
          git -C "$RUNNER_TEMP/esp-avb" remote add origin https://github.com/scrambletools/esp_avb.git
          git -C "$RUNNER_TEMP/esp-avb" fetch --depth 1 origin "$ESP_AVB_SHA"
          git -C "$RUNNER_TEMP/esp-avb" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/esp-avb" rev-parse HEAD)" = "$ESP_AVB_SHA"
          test -f "$RUNNER_TEMP/esp-avb/idf_component.yml"
          test -f "$RUNNER_TEMP/esp-avb/README.md"

          git init "$RUNNER_TEMP/esp-ptp"
          git -C "$RUNNER_TEMP/esp-ptp" remote add origin https://github.com/scrambletools/esp_ptp.git
          git -C "$RUNNER_TEMP/esp-ptp" fetch --depth 1 origin "$ESP_PTP_SHA"
          git -C "$RUNNER_TEMP/esp-ptp" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/esp-ptp" rev-parse HEAD)" = "$ESP_PTP_SHA"
          test -f "$RUNNER_TEMP/esp-ptp/idf_component.yml"
          test -f "$RUNNER_TEMP/esp-ptp/README.md"

      - name: Fetch exact Sound Open Firmware candidate
        run: |
          git init "$RUNNER_TEMP/sof"
          git -C "$RUNNER_TEMP/sof" remote add origin https://github.com/thesofproject/sof.git
          git -C "$RUNNER_TEMP/sof" fetch --depth 1 origin "$SOF_SHA"
          git -C "$RUNNER_TEMP/sof" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/sof" rev-parse HEAD)" = "$SOF_SHA"
          test -d "$RUNNER_TEMP/sof/src"

      - name: Emit Aurora integration evidence
        run: |
          python3 validation/open-audio-stack/open_audio_stack_evidence.py \
            --config config/open-audio-stack-v1.json \
            --registry config/external-components-v1.json \
            --aoo "$RUNNER_TEMP/aoo" \
            --genavb "$RUNNER_TEMP/genavb" \
            --esp-avb "$RUNNER_TEMP/esp-avb" \
            --esp-ptp "$RUNNER_TEMP/esp-ptp" \
            --sof "$RUNNER_TEMP/sof" \
            --libspatialaudio "$RUNNER_TEMP/libspatialaudio" \
            --output artifacts/open-audio-stack-evidence.json

      - name: Require pin drift to fail closed
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          source = Path('config/open-audio-stack-v1.json')
          data = json.loads(source.read_text())
          data['components']['aoo']['pinned_commit'] = '0' * 40
          Path('artifacts/bad-open-audio-stack-v1.json').write_text(json.dumps(data, indent=2) + '\n')
          PY
          if python3 validation/open-audio-stack/open_audio_stack_evidence.py \
            --config artifacts/bad-open-audio-stack-v1.json \
            --registry config/external-components-v1.json \
            --aoo "$RUNNER_TEMP/aoo" \
            --genavb "$RUNNER_TEMP/genavb" \
            --esp-avb "$RUNNER_TEMP/esp-avb" \
            --esp-ptp "$RUNNER_TEMP/esp-ptp" \
            --sof "$RUNNER_TEMP/sof" \
            --libspatialaudio "$RUNNER_TEMP/libspatialaudio" \
            --output artifacts/bad-open-audio-stack-evidence.json; then
            echo "ERROR: mismatched AOO pin unexpectedly passed"
            exit 1
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-audio-stack-evidence
          path: |
            artifacts/open-audio-stack*.json
            artifacts/aoo-aurora-contract.txt
            artifacts/libspatialaudio-aurora-contract.txt
