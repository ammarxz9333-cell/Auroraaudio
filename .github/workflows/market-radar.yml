name: Market Radar

on:
  push:
    paths:
      - "market-radar/**"
      - ".github/workflows/market-radar.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: market-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-slim
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Validate Market Radar Python
        run: |
          python3 -m py_compile market-radar/radar.py market-radar/entry_gate.py market-radar/live/outcome_tracker.py market-radar/backtest/historical_gate_replay_v2.py
          cd market-radar && python3 -m unittest test_entry_gate.py live/test_outcome_tracker.py live/test_end_to_end.py


      - name: Historical replay smoke test (frozen batch)
        env:
          PYTHONPATH: market-radar
        run: python3 market-radar/backtest/historical_gate_replay_v2.py market-radar/backtest/frozen/pilot-20-freeze-a.json market-radar/backtest/frozen/pilot-20-freeze-b.json market-radar/backtest/frozen/pilot-20-freeze-c.json market-radar/backtest/frozen/pilot-20-freeze-d.json market-radar/backtest/frozen/pilot-20-freeze-e.json --out /tmp/replay-results.json && python3 -c 'import json; d=json.load(open("/tmp/replay-results.json")); print(json.dumps({"cases":len(d["cases"]),"robust":[{"ticker":x["ticker"],"features":x.get("first_buyable_features"),"scenarios":x.get("spread_scenarios",{}),"v2_robust":x.get("v2_spread_robust_buyable"),"v2":x.get("v2_spread_scenarios",{})} for x in d["cases"] if x.get("spread_robust_buyable")]},indent=2))'

      - name: Gate v1-v2 pilot summary
        env:
          PYTHONPATH: market-radar
        run: python3 -c 'import json; d=json.load(open("/tmp/replay-results.json"))["cases"]; key=lambda x,v:(x.get(v+"_spread_scenarios") if v=="v2" else x.get("spread_scenarios",{})).get("0.5"); summarize=lambda v:{"entries":sum(key(x,v)!=None for x in d),"plus5_first":sum((key(x,v) or {}).get("outcome")=="PLUS5_FIRST" for x in d),"minus5_first":sum((key(x,v) or {}).get("outcome")=="MINUS5_FIRST" for x in d),"order_unverified":sum((key(x,v) or {}).get("outcome")=="ORDER_UNVERIFIED" for x in d),"unresolved":sum((key(x,v) or {}).get("outcome")=="UNRESOLVED" for x in d),"plus10_reached":sum(bool((key(x,v) or {}).get("plus10_reached")) for x in d)}; print(json.dumps({"v1":summarize("v1"),"v2":summarize("v2"),"entries":[{"ticker":x["ticker"],"v1":key(x,"v1"),"v2":key(x,"v2")} for x in d if key(x,"v1") or key(x,"v2")]},indent=2))'

      - name: OOS historical replay diagnostics
        env:
          PYTHONPATH: market-radar
        run: python3 market-radar/backtest/historical_gate_replay_v2.py market-radar/backtest/oos/frozen/entry-gate-v1-b1.json market-radar/backtest/oos/frozen/entry-gate-v1-b2.json --out /tmp/oos-replay.json && python3 -c 'import json; d=json.load(open("/tmp/oos-replay.json")); print(json.dumps([{"ticker":x["ticker"],"decision":x.get("normalized_decision"),"v1":x.get("spread_scenarios",{}).get("0.5"),"v2":x.get("v2_spread_scenarios",{}).get("0.5")} for x in d["cases"]],indent=2))'

      - name: Run first-public-source scanner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RADAR_SCORE_THRESHOLD: "8"
          RADAR_BOOTSTRAP_ALERT_HOURS: "8"
          RADAR_USER_AGENT: "Ammar-Market-Radar/1.0 contact=${{ github.repository_owner }}@users.noreply.github.com"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 market-radar/radar.py

      - name: Persist radar state
        shell: bash
        run: |
          git add market-radar/state.json market-radar/live/trades.json market-radar/live/tape/ 2>/dev/null || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "market-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(market-radar): persist live radar state [skip ci]"
          git push
