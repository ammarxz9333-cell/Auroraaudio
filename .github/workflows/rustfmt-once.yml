name: Temporary Rustfmt Repair

on:
  push:
    branches:
      - software-completion

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout software-completion
        uses: actions/checkout@v4
        with:
          ref: software-completion
          fetch-depth: 0

      - name: Install stable rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply rustfmt
        run: cargo fmt --all

      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No rustfmt changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style: apply rustfmt"
          git push origin HEAD:software-completion
