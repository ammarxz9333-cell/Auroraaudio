name: Immersive JOC Stack CI

on:
  workflow_dispatch:
  push:
    branches:
      - main-v2
    paths:
      - "config/external-components-v1.json"
      - "validation/immersive/**"
      - ".github/workflows/immersive-joc-stack-ci.yml"
  pull_request:
    paths:
      - "config/external-components-v1.json"
      - "validation/immersive/**"
      - ".github/workflows/immersive-joc-stack-ci.yml"

permissions:
  contents: read

concurrency:
  group: immersive-joc-stack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-joc-software-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo and external JOC validation builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cache/joc
          key: ${{ runner.os }}-joc-${{ hashFiles('config/external-components-v1.json', 'validation/immersive/test-joc-stack.sh', 'validation/immersive/test-joc-realtime-soak.sh', 'validation/immersive/omniphony-v0.5.2-low-latency-stdout.patch') }}
          restore-keys: |
            ${{ runner.os }}-joc-
      - name: Install host audio tooling
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg libasound2-dev libpipewire-0.3-dev
      - name: Validate baseline and paced E-AC-3 JOC through IEC61937, Harletty, and Omniphony 7.1.4
        env:
          # Throughput/realtime claims must be evaluated on an optimized build.
          AURORA_JOC_BUILD_MODE: release
          AURORA_JOC_REALTIME_LOOPS: 4
          AURORA_JOC_TEST_WORKDIR: ${{ runner.temp }}/aurora-joc-work
          AURORA_HARLETTY_TARGET_DIR: ${{ github.workspace }}/.cache/joc/harletty-target
          AURORA_OMNIP_TARGET_DIR: ${{ github.workspace }}/.cache/joc/omniphony-target
          AURORA_JOC_HARNESS_TARGET_DIR: ${{ github.workspace }}/.cache/joc/harness-target
        run: bash validation/immersive/test-joc-realtime-soak.sh
