name: Immersive JOC Stack CI

on:
  workflow_dispatch:
  push:
    branches:
      - main-v2
    paths:
      - "config/external-components-v1.json"
      - "validation/immersive/**"
      - ".github/workflows/immersive-joc-stack-ci.yml"
  pull_request:
    paths:
      - "config/external-components-v1.json"
      - "validation/immersive/**"
      - ".github/workflows/immersive-joc-stack-ci.yml"

permissions:
  contents: read

concurrency:
  group: immersive-joc-stack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-joc-software-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo and external JOC validation builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cache/joc
          key: ${{ runner.os }}-joc-${{ hashFiles('config/external-components-v1.json', 'validation/immersive/test-joc-stack.sh', 'validation/immersive/test-joc-realtime-soak.sh', 'validation/immersive/test-openjoc-reference.sh', 'validation/immersive/test-joc-differential.sh', 'validation/immersive/test-joc-temporal-evidence.sh', 'validation/immersive/run-authorized-joc-carrier.sh', 'validation/immersive/joc_temporal_evidence.py', 'validation/immersive/install-openjoc-reference.sh', 'validation/immersive/omniphony-v0.5.2-low-latency-stdout.patch') }}
          restore-keys: |
            ${{ runner.os }}-joc-
      - name: Install host audio tooling
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg libasound2-dev libpipewire-0.3-dev
      - name: Self-test temporal JOC metric/report logic
        run: python3 validation/immersive/joc_temporal_evidence.py self-test
      - name: Validate baseline and paced E-AC-3 JOC through IEC61937, Harletty, and Omniphony 7.1.4
        env:
          # Throughput/realtime claims must be evaluated on an optimized build.
          AURORA_JOC_BUILD_MODE: release
          AURORA_JOC_REALTIME_LOOPS: 4
          AURORA_JOC_TEST_WORKDIR: ${{ runner.temp }}/aurora-joc-work
          AURORA_HARLETTY_TARGET_DIR: ${{ github.workspace }}/.cache/joc/harletty-target
          AURORA_OMNIP_TARGET_DIR: ${{ github.workspace }}/.cache/joc/omniphony-target
          AURORA_JOC_HARNESS_TARGET_DIR: ${{ github.workspace }}/.cache/joc/harness-target
        run: bash validation/immersive/test-joc-realtime-soak.sh
      - name: Install checksum-pinned OpenJOC reference binary
        id: openjoc
        shell: bash
        run: |
          OPENJOC_BIN="$(bash validation/immersive/install-openjoc-reference.sh "${{ runner.temp }}/openjoc-reference")"
          echo "bin=$OPENJOC_BIN" >> "$GITHUB_OUTPUT"
      - name: Differential JOC validation with independent OpenJOC reference
        env:
          OPENJOC_BIN: ${{ steps.openjoc.outputs.bin }}
          AURORA_JOC_BUILD_MODE: release
          AURORA_HARLETTY_TARGET_DIR: ${{ github.workspace }}/.cache/joc/harletty-target
          AURORA_OMNIP_TARGET_DIR: ${{ github.workspace }}/.cache/joc/omniphony-target
          AURORA_JOC_HARNESS_TARGET_DIR: ${{ github.workspace }}/.cache/joc/harness-target
          AURORA_KEEP_JOC_DIFF_WORKDIR: 1
        run: >-
          bash validation/immersive/test-joc-differential.sh
          "${{ runner.temp }}/aurora-joc-differential"
      - name: Prove the public JOC fixture cannot overclaim temporal object evidence
        shell: bash
        env:
          OPENJOC_BIN: ${{ steps.openjoc.outputs.bin }}
        run: |
          set -euo pipefail
          WORK="${{ runner.temp }}/aurora-joc-differential"
          INPUT="$WORK/fixture-source/harletty/tests/fixtures/joc_atmos_1s.eac3"
          TEMPORAL_DIR="$WORK/temporal-public-fixture"
          REPORT="$TEMPORAL_DIR/joc-temporal-evidence.json"
          test -s "$INPUT"
          SHA256="$(sha256sum "$INPUT" | awk '{print $1}')"
          set +e
          bash validation/immersive/test-joc-temporal-evidence.sh \
            "$INPUT" \
            "$SHA256" \
            "pinned public Harletty joc_atmos_1s.eac3" \
            "$TEMPORAL_DIR"
          RC=$?
          set -e
          if [[ "$RC" != "3" ]]; then
            echo "expected public fixture harness to fail closed with insufficient temporal diversity; rc=$RC" >&2
            cat "$REPORT" >&2 || true
            exit 1
          fi
          test -s "$REPORT"
          python3 - "$REPORT" <<'PY'
          import json, pathlib, sys
          report = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          if report.get("verdict") != "fail":
              raise SystemExit("public fixture unexpectedly passed temporal evidence")
          if report.get("primary_reason") != "insufficient_temporal_diversity":
              raise SystemExit(f"unexpected fail-closed reason: {report.get('primary_reason')!r}")
          if report.get("codec_joc", {}).get("gate_pass") is not True:
              raise SystemExit("public fixture failed codec/JOC gate rather than temporal-diversity gate")
          print("JOC-TEMPORAL-PUBLIC-FIXTURE-FAIL-CLOSED-PASS")
          PY
      - name: Validate authorized-carrier wrapper fails closed on the static public fixture
        shell: bash
        env:
          OPENJOC_BIN: ${{ steps.openjoc.outputs.bin }}
        run: |
          set -euo pipefail
          WORK="${{ runner.temp }}/aurora-joc-differential"
          INPUT="$WORK/fixture-source/harletty/tests/fixtures/joc_atmos_1s.eac3"
          AUTH_DIR="$WORK/authorized-public-fixture"
          REPORT="$AUTH_DIR/temporal/joc-temporal-evidence.json"
          MANIFEST="$AUTH_DIR/authorized-carrier-manifest.json"
          test -s "$INPUT"
          SHA256="$(sha256sum "$INPUT" | awk '{print $1}')"
          set +e
          bash validation/immersive/run-authorized-joc-carrier.sh \
            "$INPUT" \
            "$SHA256" \
            "pinned public Harletty joc_atmos_1s.eac3 wrapper self-test" \
            "$AUTH_DIR"
          RC=$?
          set -e
          if [[ "$RC" != "3" ]]; then
            echo "expected authorized-carrier wrapper to propagate insufficient temporal diversity; rc=$RC" >&2
            cat "$REPORT" >&2 || true
            exit 1
          fi
          test -s "$MANIFEST"
          test -s "$REPORT"
          python3 - "$MANIFEST" "$REPORT" <<'PY'
          import json, pathlib, sys
          manifest = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          report = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding="utf-8"))
          source = manifest.get("source") or {}
          extracted = manifest.get("extracted_joc") or {}
          if source.get("sha256") != extracted.get("sha256"):
              raise SystemExit("raw E-AC-3 wrapper self-test did not preserve byte identity")
          if extracted.get("method") != "direct-copy":
              raise SystemExit(f"unexpected extraction method: {extracted.get('method')!r}")
          if extracted.get("reencoded") is not False:
              raise SystemExit("authorized-carrier wrapper reported re-encoding")
          if report.get("verdict") != "fail":
              raise SystemExit("static wrapper fixture unexpectedly passed temporal evidence")
          if report.get("primary_reason") != "insufficient_temporal_diversity":
              raise SystemExit(f"unexpected wrapper fail-closed reason: {report.get('primary_reason')!r}")
          if report.get("codec_joc", {}).get("gate_pass") is not True:
              raise SystemExit("wrapper fixture failed codec/JOC gate rather than temporal-diversity gate")
          print("AUTHORIZED-JOC-CARRIER-WRAPPER-FAIL-CLOSED-PASS")
          PY
      - name: Discover temporal result for official Dolby Living-Room JOC test vector
        id: dolby_living_room
        shell: bash
        env:
          OPENJOC_BIN: ${{ steps.openjoc.outputs.bin }}
        run: |
          set -euo pipefail
          URL="https://ott.dolby.com/OnDelKits/DDP/Dolby_Digital_Plus_Online_Delivery_Kit_v1.4.1/Test_Signals/elementary_streams/audio.zip"
          NAME="Living-Room-Atmos_6ch_640kbps_ddp_joc.ec3"
          WORK="${{ runner.temp }}/dolby-living-room-candidate"
          ZIP="$WORK/audio.zip"
          INPUT="$WORK/$NAME"
          AUTH_DIR="$WORK/authorized"
          mkdir -p "$WORK"
          curl --fail --location --retry 3 --silent --show-error "$URL" --output "$ZIP"
          ZIP_SHA256="$(sha256sum "$ZIP" | awk '{print $1}')"
          python3 - "$ZIP" "$INPUT" "$NAME" <<'PY'
          import pathlib, sys, zipfile
          archive = pathlib.Path(sys.argv[1])
          output = pathlib.Path(sys.argv[2])
          wanted = sys.argv[3]
          with zipfile.ZipFile(archive) as zf:
              matches = [name for name in zf.namelist() if pathlib.PurePosixPath(name).name == wanted]
              if len(matches) != 1:
                  raise SystemExit(f"expected exactly one {wanted!r}, found {matches!r}")
              output.write_bytes(zf.read(matches[0]))
          print(f"extracted {output.name}: {output.stat().st_size} bytes")
          PY
          INPUT_SHA256="$(sha256sum "$INPUT" | awk '{print $1}')"
          echo "zip_sha256=$ZIP_SHA256"
          echo "carrier_sha256=$INPUT_SHA256"
          set +e
          bash validation/immersive/run-authorized-joc-carrier.sh \
            "$INPUT" \
            "$INPUT_SHA256" \
            "Official Dolby Digital Plus Online Delivery Kit v1.4.1 test vector $NAME; downloaded at validation time from $URL for testing; not redistributed by Aurora" \
            "$AUTH_DIR"
          RC=$?
          set -e
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          echo "zip_sha256=$ZIP_SHA256" >> "$GITHUB_OUTPUT"
          echo "carrier_sha256=$INPUT_SHA256" >> "$GITHUB_OUTPUT"
          echo "DOLBY-LIVING-ROOM-CANDIDATE-RC=$RC"
          cat "$AUTH_DIR/temporal/joc-temporal-evidence.json" || true
          # Discovery only. Convert this into a checksum-pinned assertion or remove it before merge.
          exit 0
      - name: Upload differential and temporal JOC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: joc-differential-${{ github.sha }}
          path: |
            ${{ runner.temp }}/aurora-joc-differential/joc-differential-report.json
            ${{ runner.temp }}/aurora-joc-differential/temporal-public-fixture/joc-temporal-evidence.json
            ${{ runner.temp }}/aurora-joc-differential/temporal-public-fixture/openjoc/openjoc-inspect.json
            ${{ runner.temp }}/aurora-joc-differential/temporal-public-fixture/openjoc/openjoc-7.1.4-ffprobe.json
            ${{ runner.temp }}/aurora-joc-differential/authorized-public-fixture/authorized-carrier-manifest.json
            ${{ runner.temp }}/aurora-joc-differential/authorized-public-fixture/source-ffprobe.json
            ${{ runner.temp }}/aurora-joc-differential/authorized-public-fixture/temporal/joc-temporal-evidence.json
            ${{ runner.temp }}/aurora-joc-differential/authorized-public-fixture/temporal/openjoc/openjoc-inspect.json
            ${{ runner.temp }}/aurora-joc-differential/authorized-public-fixture/temporal/openjoc/openjoc-7.1.4-ffprobe.json
            ${{ runner.temp }}/aurora-joc-differential/openjoc/openjoc-inspect.json
            ${{ runner.temp }}/aurora-joc-differential/openjoc/openjoc-7.1.4-ffprobe.json
            ${{ runner.temp }}/dolby-living-room-candidate/authorized/authorized-carrier-manifest.json
            ${{ runner.temp }}/dolby-living-room-candidate/authorized/source-ffprobe.json
            ${{ runner.temp }}/dolby-living-room-candidate/authorized/temporal/joc-temporal-evidence.json
            ${{ runner.temp }}/dolby-living-room-candidate/authorized/temporal/openjoc/openjoc-inspect.json
            ${{ runner.temp }}/dolby-living-room-candidate/authorized/temporal/openjoc/openjoc-7.1.4-ffprobe.json
          if-no-files-found: warn
          retention-days: 14
