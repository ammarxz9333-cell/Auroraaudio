name: Immersive JOC Stack CI

on:
  workflow_dispatch:
  push:
    branches:
      - main-v2
    paths:
      - "config/external-components-v1.json"
      - "config/omniphony-evaluation-v1.json"
      - "validation/immersive/**"
      - ".github/workflows/immersive-joc-stack-ci.yml"
  pull_request:
    paths:
      - "config/external-components-v1.json"
      - "config/omniphony-evaluation-v1.json"
      - "validation/immersive/**"
      - ".github/workflows/immersive-joc-stack-ci.yml"

permissions:
  contents: read

concurrency:
  group: immersive-joc-stack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-joc-software-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache external JOC validation builds
        uses: actions/cache@v4
        with:
          path: .cache/joc
          key: ${{ runner.os }}-joc-${{ hashFiles('config/external-components-v1.json', 'config/omniphony-evaluation-v1.json', 'validation/immersive/test-joc-stack.sh', 'validation/immersive/test-joc-realtime-soak.sh', 'validation/immersive/test-openjoc-reference.sh', 'validation/immersive/test-joc-differential.sh', 'validation/immersive/test-joc-temporal-evidence.sh', 'validation/immersive/test-omniphony-reference-comparison.sh', 'validation/immersive/joc_temporal_evidence.py', 'validation/immersive/install-openjoc-reference.sh', 'validation/immersive/omniphony-v0.5.2-low-latency-stdout.patch') }}
          restore-keys: |
            ${{ runner.os }}-joc-
      - name: Install host audio tooling
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg libasound2-dev libpipewire-0.3-dev
      - name: Self-test temporal JOC metric/report logic
        run: python3 validation/immersive/joc_temporal_evidence.py self-test
      - name: Validate baseline and paced E-AC-3 JOC through IEC61937, Harletty, and Omniphony 7.1.4
        env:
          AURORA_JOC_BUILD_MODE: release
          AURORA_JOC_REALTIME_LOOPS: 4
          AURORA_JOC_TEST_WORKDIR: ${{ runner.temp }}/aurora-joc-work
          AURORA_HARLETTY_TARGET_DIR: ${{ github.workspace }}/.cache/joc/harletty-target
          AURORA_OMNIP_TARGET_DIR: ${{ github.workspace }}/.cache/joc/omniphony-target
          AURORA_JOC_HARNESS_TARGET_DIR: ${{ github.workspace }}/.cache/joc/harness-target
        run: bash validation/immersive/test-joc-realtime-soak.sh
      - name: Compare stable and pinned evaluation Omniphony references
        env:
          AURORA_JOC_BUILD_MODE: release
          AURORA_JOC_TEST_WORKDIR: ${{ runner.temp }}/aurora-joc-work
          AURORA_HARLETTY_TARGET_DIR: ${{ github.workspace }}/.cache/joc/harletty-target
          AURORA_OMNIP_TARGET_DIR: ${{ github.workspace }}/.cache/joc/omniphony-target
          AURORA_OMNIP_EVAL_TARGET_DIR: ${{ github.workspace }}/.cache/joc/omniphony-eval-target
          AURORA_OMNIP_EVAL_REPORT: ${{ runner.temp }}/aurora-joc-work/omniphony-reference-comparison.json
        run: bash validation/immersive/test-omniphony-reference-comparison.sh
      - name: Install checksum-pinned OpenJOC reference binary
        id: openjoc
        shell: bash
        run: |
          OPENJOC_BIN="$(bash validation/immersive/install-openjoc-reference.sh "${{ runner.temp }}/openjoc-reference")"
          echo "bin=$OPENJOC_BIN" >> "$GITHUB_OUTPUT"
      - name: Differential JOC validation with independent OpenJOC reference
        env:
          OPENJOC_BIN: ${{ steps.openjoc.outputs.bin }}
          AURORA_JOC_BUILD_MODE: release
          AURORA_HARLETTY_TARGET_DIR: ${{ github.workspace }}/.cache/joc/harletty-target
          AURORA_OMNIP_TARGET_DIR: ${{ github.workspace }}/.cache/joc/omniphony-target
          AURORA_JOC_HARNESS_TARGET_DIR: ${{ github.workspace }}/.cache/joc/harness-target
          AURORA_KEEP_JOC_DIFF_WORKDIR: 1
        run: >-
          bash validation/immersive/test-joc-differential.sh
          "${{ runner.temp }}/aurora-joc-differential"
      - name: Prove the public JOC fixture cannot overclaim temporal object evidence
        shell: bash
        env:
          OPENJOC_BIN: ${{ steps.openjoc.outputs.bin }}
        run: |
          set -euo pipefail
          WORK="${{ runner.temp }}/aurora-joc-differential"
          INPUT="$WORK/fixture-source/harletty/tests/fixtures/joc_atmos_1s.eac3"
          TEMPORAL_DIR="$WORK/temporal-public-fixture"
          REPORT="$TEMPORAL_DIR/joc-temporal-evidence.json"
          test -s "$INPUT"
          SHA256="$(sha256sum "$INPUT" | awk '{print $1}')"
          set +e
          bash validation/immersive/test-joc-temporal-evidence.sh \
            "$INPUT" \
            "$SHA256" \
            "pinned public Harletty joc_atmos_1s.eac3" \
            "$TEMPORAL_DIR"
          RC=$?
          set -e
          if [[ "$RC" != "3" ]]; then
            echo "expected public fixture harness to fail closed with insufficient temporal diversity; rc=$RC" >&2
            cat "$REPORT" >&2 || true
            exit 1
          fi
          test -s "$REPORT"
          python3 - "$REPORT" <<'PY'
          import json, pathlib, sys
          report = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          if report.get("verdict") != "fail":
              raise SystemExit("public fixture unexpectedly passed temporal evidence")
          if report.get("primary_reason") != "insufficient_temporal_diversity":
              raise SystemExit(f"unexpected fail-closed reason: {report.get('primary_reason')!r}")
          if report.get("codec_joc", {}).get("gate_pass") is not True:
              raise SystemExit("public fixture failed codec/JOC gate rather than temporal-diversity gate")
          print("JOC-TEMPORAL-PUBLIC-FIXTURE-FAIL-CLOSED-PASS")
          PY
      - name: Upload immersive reference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: joc-differential-${{ github.sha }}
          path: |
            ${{ runner.temp }}/aurora-joc-work/omniphony-reference-comparison.json
            ${{ runner.temp }}/aurora-joc-work/omniphony-label-contract.json
            ${{ runner.temp }}/aurora-joc-differential/joc-differential-report.json
            ${{ runner.temp }}/aurora-joc-differential/temporal-public-fixture/joc-temporal-evidence.json
            ${{ runner.temp }}/aurora-joc-differential/temporal-public-fixture/openjoc/openjoc-inspect.json
            ${{ runner.temp }}/aurora-joc-differential/temporal-public-fixture/openjoc/openjoc-7.1.4-ffprobe.json
            ${{ runner.temp }}/aurora-joc-differential/openjoc/openjoc-inspect.json
            ${{ runner.temp }}/aurora-joc-differential/openjoc/openjoc-7.1.4-ffprobe.json
          if-no-files-found: warn
          retention-days: 14
