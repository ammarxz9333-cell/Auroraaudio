name: OAR Reference CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "config/oar-evaluation-v1.json"
      - "crates/aurora-core/**"
      - "crates/aurora-renderer-api/**"
      - "crates/aurora-renderer-vbap/**"
      - "crates/aurora-simulation-assurance/src/bin/aurora-oar-differential-probe.rs"
      - "crates/aurora-simulation-assurance/src/bin/aurora-oar-5-1-differential-probe.rs"
      - "validation/open-immersive/aurora_oar_differential_probe.c"
      - "validation/open-immersive/aurora_oar_5_1_differential_probe.c"
      - "validation/open-immersive/oar_differential.py"
      - "validation/open-immersive/oar_5_1_differential.py"
      - "validation/open-immersive/oar_reference_evidence.py"
      - "validation/open-immersive/test-oar-reference.sh"
      - "docs/oar-reference.md"
      - ".github/workflows/oar-reference-ci.yml"
      - "AGENTS.md"

permissions:
  contents: read

concurrency:
  group: oar-reference-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pinned-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install build tooling
        run: sudo apt-get update && sudo apt-get install --yes cmake ninja-build

      - name: Self-test OAR evidence analyzers
        run: |
          python3 validation/open-immersive/oar_reference_evidence.py self-test
          python3 validation/open-immersive/oar_differential.py self-test
          python3 validation/open-immersive/oar_5_1_differential.py self-test

      - name: Build, test and compare exact pinned OAR reference
        shell: bash
        run: bash validation/open-immersive/test-oar-reference.sh "${{ runner.temp }}/oar-reference"

      - name: Upload OAR reference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oar-reference-${{ github.sha }}
          path: |
            ${{ runner.temp }}/oar-reference/oar-reference-evidence.json
            ${{ runner.temp }}/oar-reference/oar-differential-oar.json
            ${{ runner.temp }}/oar-reference/oar-differential-aurora.json
            ${{ runner.temp }}/oar-reference/oar-differential-evidence.json
            ${{ runner.temp }}/oar-reference/oar-5-1-differential-oar.json
            ${{ runner.temp }}/oar-reference/oar-5-1-differential-aurora.json
            ${{ runner.temp }}/oar-reference/oar-5-1-differential-evidence.json
            ${{ runner.temp }}/oar-reference/ctest.log
          if-no-files-found: warn
          retention-days: 14
