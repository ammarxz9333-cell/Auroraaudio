name: DAViewer image-source connectivity probe
on:
  push:
    branches: [app/daviewer-ultra-multisource-v081-livefix-20261115]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect public image-provider API response shape
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          import urllib.error
          from urllib.parse import urlencode
          targets = {
            'danbooru': ('https://danbooru.donmai.us/posts.json', {'tags':'landscape rating:g','page':1,'limit':5}),
            'safebooru': ('https://safebooru.org/index.php', {'page':'dapi','s':'post','q':'index','json':'1','pid':'0','limit':5,'tags':'landscape'}),
            'wallhaven': ('https://wallhaven.cc/api/v1/search', {'q':'landscape','purity':'100','page':1}),
            'openverse': ('https://api.openverse.org/v1/images/', {'q':'landscape','page':1,'page_size':5,'mature':'false'}),
          }
          for name,(base,params) in targets.items():
            url=base+'?'+urlencode(params)
            req=urllib.request.Request(url,headers={
              'User-Agent':'DAViewerUltraSourceProbe/0.8.1 (github.com/ammarxz9333-cell/Auroraaudio)',
              'Accept':'application/json',
            })
            try:
              with urllib.request.urlopen(req,timeout=12) as r:
                raw=r.read(1_000_000)
                status=r.status
                content_type=r.headers.get('Content-Type','')
              data=json.loads(raw)
              entries = data if isinstance(data,list) else data.get('post',data.get('data',data.get('results',[]))) if isinstance(data,dict) else []
              if isinstance(entries,dict): entries=[entries]
              item=entries[0] if isinstance(entries,list) and entries else {}
              selected={k:str(item.get(k))[:180] for k in ('id','file_url','preview_url','sample_url','path','url','rating','purity','thumbnail','thumbs') if k in item} if isinstance(item,dict) else {}
              print(json.dumps({'source':name,'status':status,'type':content_type,'root_type':type(data).__name__,'root_keys':list(data)[:15] if isinstance(data,dict) else [],'total':len(entries) if isinstance(entries,list) else None,'sample':selected},ensure_ascii=False))
            except urllib.error.HTTPError as e:
              print(json.dumps({'source':name,'status':e.code,'content_type':e.headers.get('Content-Type',''),'error':e.read(200).decode('utf-8','replace')[:150]}))
            except Exception as e:
              print(json.dumps({'source':name,'error_type':type(e).__name__,'error':str(e)[:160]}))
          PY
