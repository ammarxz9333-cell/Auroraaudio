name: OpenJOC Clippy Codemod Once

on:
  push:
    branches:
      - codex/openjoc-speaker-fail-closed
    paths:
      - ".github/workflows/openjoc-clippy-codemod-once.yml"

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/openjoc-speaker-fail-closed
      - name: Apply behavior-preserving Clippy fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              "crates/aurora-decoder-open/src/iec61937.rs": [
                  ("0x0B | 0x0C | 0x0D => CodecKind::Dts,", "0x0B..=0x0D => CodecKind::Dts,"),
              ],
              "crates/aurora-decoder-open/src/sniff.rs": [
                  ("0x0B | 0x0C | 0x0D => CodecKind::Dts,", "0x0B..=0x0D => CodecKind::Dts,"),
              ],
              "crates/aurora-decoder-open/src/lib.rs": [
                  (
                      "#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub struct OpenDecoderConfig {",
                      "#[derive(Debug, Clone, Copy, PartialEq, Eq, Default)]\npub struct OpenDecoderConfig {",
                  ),
                  (
                      "\nimpl Default for OpenDecoderConfig {\n    fn default() -> Self {\n        Self {\n            codec_hint: None,\n            joc_stereo_reference: false,\n            joc_layout_hint: None,\n        }\n    }\n}\n",
                      "\n",
                  ),
              ],
              "crates/aurora-decoder-open/src/openjoc_native.rs": [
                  (
                      "        let mut config = OpenJocConfig::default();\n        config.render_mode = RenderMode::Speaker;\n        config.speaker_layout = layout;\n        config.validation_profile = ValidationProfile::Auto;",
                      "        let config = OpenJocConfig {\n            render_mode: RenderMode::Speaker,\n            speaker_layout: layout,\n            validation_profile: ValidationProfile::Auto,\n            ..Default::default()\n        };",
                  ),
              ],
          }

          for filename, edits in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in edits:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"{filename}: expected exactly one match, found {count}: {old!r}")
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY

          rustfmt --version >/dev/null 2>&1 || true
          git diff --check
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/aurora-decoder-open/src/iec61937.rs \
                  crates/aurora-decoder-open/src/sniff.rs \
                  crates/aurora-decoder-open/src/lib.rs \
                  crates/aurora-decoder-open/src/openjoc_native.rs
          git diff --cached --quiet && { echo "No codemod changes"; exit 0; }
          git commit -m "Resolve focused OpenJOC Clippy findings"
          git push origin HEAD:codex/openjoc-speaker-fail-closed
