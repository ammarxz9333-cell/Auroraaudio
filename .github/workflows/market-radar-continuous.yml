name: Market Radar Continuous Tests
on:
  push:
    paths: ["market-radar/continuous/**", "market-radar/learning/**", "market-radar/tape_discovery.py", "market-radar/test_tape_discovery.py", "market-radar/test_missed_movers.py", "market-radar/radar.py", "market-radar/test_market_snapshot.py", "market-radar/test_published_tape_learning.py", "market-radar/compose.yml", ".github/workflows/market-radar-continuous.yml"]
  pull_request:
    paths: ["market-radar/continuous/**", "market-radar/compose.yml", ".github/workflows/market-radar-continuous.yml"]
permissions:
  contents: read
jobs:
  continuous:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r market-radar/continuous/requirements.txt
      - working-directory: market-radar
        run: |
          python -m unittest continuous.test_core continuous.test_service continuous.test_universe continuous.test_classification continuous.test_reversal learning.test_missed_movers -v
          python -m unittest test_market_snapshot test_entry_gate test_tape_discovery test_missed_movers test_published_tape_learning live.test_outcome_tracker live.test_end_to_end -v
          python -m continuous.peng_acceptance
          cp .env.example .env
          docker compose config --quiet
          docker compose build
