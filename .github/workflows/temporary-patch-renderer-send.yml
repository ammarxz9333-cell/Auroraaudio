name: Temporary patch renderer Send contract

on:
  push:
    branches:
      - refactor/runtime-materialize-renderer-v1

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[send-patch-bot]') && !contains(github.event.head_commit.message, '[renderer-boundary-bot]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/runtime-materialize-renderer-v1
      - name: Require realtime renderers to be Send
        shell: python
        run: |
          from pathlib import Path
          path = Path('.github/workflows/temporary-apply-renderer-boundary.yml')
          text = path.read_text()
          old = '/// Replaceable renderer abstraction used by offline and real-time pipelines.\\npub trait Renderer {\\n    /// Reports configured renderer capabilities used by realtime materialization.'
          new = '/// Replaceable renderer abstraction used by offline and real-time pipelines.\\npub trait Renderer: Send {\\n    /// Reports configured renderer capabilities used by realtime materialization.'
          if text.count(old) != 1:
              raise SystemExit('renderer trait replacement anchor missing or ambiguous')
          path.write_text(text.replace(old, new, 1))
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/temporary-apply-renderer-boundary.yml
          git commit -m "Require realtime renderer contract to be Send [send-patch-bot]"
          git push origin HEAD:refactor/runtime-materialize-renderer-v1
