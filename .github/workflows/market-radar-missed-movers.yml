name: Market Radar Missed Movers

on:
  schedule:
    - cron: "35 20,21 * * 1-5"
  workflow_dispatch:
  push:
    branches:
      - main-v2
    paths:
      - "market-radar/missed_movers.py"
      - ".github/workflows/market-radar-missed-movers.yml"

permissions:
  contents: write

concurrency:
  group: market-radar-missed-movers
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-slim
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate missed-mover audit
        run: python3 -m py_compile market-radar/missed_movers.py

      - name: Compare explosive movers with alerts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RADAR_USER_AGENT: "Ammar-Market-Radar-MissedMover/1.0 contact=${{ github.repository_owner }}@users.noreply.github.com"
          RADAR_MISSED_MIN_GAIN_PCT: "8"
          RADAR_MISSED_MIN_PRICE: "1"
          RADAR_MISSED_MIN_VOLUME: "500000"
          RADAR_MISSED_ALERT_LOOKBACK_HOURS: "72"
        run: python3 market-radar/missed_movers.py

      - name: Persist missed-mover audit
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- market-radar/learning/missed-movers.json)" ]; then
            exit 0
          fi
          git config user.name "market-radar-learner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-radar/learning/missed-movers.json
          git commit -m "chore(market-radar): refresh missed-mover audit"
          git push
