name: Room Correction Synthetic CI

on:
  pull_request:
    paths:
      - "config/room-correction-synthetic-v1.json"
      - "validation/room-correction/room_correction_synthetic_evidence.py"
      - "docs/room-correction-synthetic.md"
      - ".github/workflows/room-correction-synthetic-ci.yml"
      - "AGENTS.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: room-correction-synthetic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AUTOEQ_SHA: 579dd7486024fc18ff219e31eb7337362814f602
  CARGO_TERM_COLOR: always

jobs:
  synthetic-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libasound2-dev libssl-dev

      - name: Fetch exact RoomEQ reference
        run: |
          git init "$RUNNER_TEMP/autoeq"
          git -C "$RUNNER_TEMP/autoeq" remote add origin https://github.com/pierreaubert/autoeq.git
          git -C "$RUNNER_TEMP/autoeq" fetch --depth 1 origin "$AUTOEQ_SHA"
          git -C "$RUNNER_TEMP/autoeq" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/autoeq" rev-parse HEAD)" = "$AUTOEQ_SHA"
          mkdir -p artifacts

      - name: Exercise final-chain safety constraints
        working-directory: ${{ runner.temp }}/autoeq
        run: cargo test --locked --release -p roomeq-quality chain_constraints_tests --lib

      - name: Run deterministic 7.1.4 RoomEQ PR subset
        working-directory: ${{ runner.temp }}/autoeq
        run: |
          set -o pipefail
          cargo run --locked --features qa --bin roomeq-qa-synthetic --no-default-features --release -- \
            --pr --difficulty easy --mode Hybrid --layout 7.1.4 --fail-fast \
            | tee "$GITHUB_WORKSPACE/artifacts/roomeq-7_1_4.log"

      - name: Run deterministic multi-seat phase guards
        working-directory: ${{ runner.temp }}/autoeq
        run: |
          set -o pipefail
          cargo run --locked --features qa --bin roomeq-qa-synthetic --no-default-features --release -- \
            --multiseat-guards-only \
            | tee "$GITHUB_WORKSPACE/artifacts/roomeq-multiseat.log"

      - name: Run deterministic Stage 3 policies
        working-directory: ${{ runner.temp }}/autoeq
        run: |
          set -o pipefail
          cargo run --locked --features qa --bin roomeq-qa-synthetic --no-default-features --release -- \
            --stage3-policies \
            | tee "$GITHUB_WORKSPACE/artifacts/roomeq-stage3.log"

      - name: Emit Aurora synthetic evidence
        run: |
          python3 validation/room-correction/room_correction_synthetic_evidence.py \
            --config config/room-correction-synthetic-v1.json \
            --multichannel-log artifacts/roomeq-7_1_4.log \
            --multiseat-log artifacts/roomeq-multiseat.log \
            --stage3-log artifacts/roomeq-stage3.log \
            --output artifacts/room-correction-synthetic-evidence.json

      - name: Require corrupted multichannel evidence to fail closed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("artifacts/roomeq-7_1_4.log")
          text = source.read_text()
          needle = "multi-channel: 4/4 passed"
          if needle not in text:
              raise SystemExit("expected multi-channel summary missing before mutation")
          Path("artifacts/roomeq-7_1_4-corrupt.log").write_text(
              text.replace(needle, "multi-channel: 3/4 passed", 1)
          )
          PY
          if python3 validation/room-correction/room_correction_synthetic_evidence.py \
            --config config/room-correction-synthetic-v1.json \
            --multichannel-log artifacts/roomeq-7_1_4-corrupt.log \
            --multiseat-log artifacts/roomeq-multiseat.log \
            --stage3-log artifacts/roomeq-stage3.log \
            --output artifacts/room-correction-synthetic-corrupt-evidence.json; then
            echo "ERROR: corrupted multichannel evidence unexpectedly passed"
            exit 1
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-correction-synthetic-evidence
          path: artifacts/room-correction-*.json
