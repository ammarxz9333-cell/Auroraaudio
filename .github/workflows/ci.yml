name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main-v2

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-stable:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux audio build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libasound2-dev
      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Verify diagnostics schemas and deterministic output
        run: cargo test -p aurora-diagnostics --test contracts
      - name: Verify configuration schemas, fixtures, and deterministic output
        run: cargo test -p aurora-config --test contracts
      - name: Verify immutable configuration read allocation guard
        run: cargo test -p aurora-config --test immutable_reads
      - run: cargo test --workspace --all-features
      - name: Verify README capability claims against registry
        run: >-
          cargo run -p aurora-cli --bin aurora-capability-docs --
          --mode check
          --readme README.md
      - name: Run Criterion performance foundation
        run: cargo bench -p aurora-realtime-engine --bench performance -- --quick --noplot
      - name: Enforce Criterion regression policy
        run: >-
          python3 scripts/check_criterion_policy.py
          --policy config/criterion-policy-v1.json
          --criterion-root target/criterion
          --output output/evaluation/criterion-policy-summary.json
      - name: Upload Criterion regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criterion-policy-${{ github.sha }}
          path: |
            output/evaluation/criterion-policy-summary.json
            config/criterion-policy-v1.json
          if-no-files-found: warn
          retention-days: 14
      - name: Run deterministic renderer evaluation
        run: >-
          cargo run --release -p aurora-cli --bin aurora-evaluate-renderer --
          --renderer all
          --output-dir output/evaluation
          --duration-seconds 0.5
      - name: Run deterministic 3D VBAP evaluation
        run: >-
          cargo run --release -p aurora-simulation-assurance --bin aurora-evaluate-vbap3d --
          --scene fixtures/scenes/5_1_2_upfiring.json
          --output-dir output/evaluation/vbap3d-5.1.2
          --duration-seconds 0.5
      - name: Upload renderer evaluation evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: renderer-evaluation-${{ github.sha }}
          path: output/evaluation
          if-no-files-found: error
          retention-days: 14
      - name: Verify public API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps

  windows-stable:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - name: Verify public API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps

  msrv-1-78:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.78.0
      - name: Install Linux audio build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libasound2-dev
      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-1-78-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msrv-1-78-
      - run: cargo check --workspace --all-targets --all-features --locked
      - run: cargo test --workspace --all-features --locked
