name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main-v2
      - "phase-*"
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main-v2

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux audio build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libasound2-dev
      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Verify diagnostics schemas and deterministic output
        run: cargo test -p aurora-diagnostics --test contracts
      - name: Verify configuration schemas, fixtures, and deterministic output
        run: cargo test -p aurora-config --test contracts
      - name: Verify immutable configuration read allocation guard
        run: cargo test -p aurora-config --test immutable_reads
      - name: Verify evaluation schemas, bounds, and deterministic evidence
        run: cargo test -p aurora-evaluation --test contracts
      - run: cargo test --workspace --all-features
      - name: Verify public API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps
      - name: Generate canonical renderer evaluation artifacts
        run: >-
          cargo run -p aurora-cli -- evaluate-renderer
          --scene fixtures/scenes/geometric_binaural_circle.json
          --input fixtures/audio/mono_sweep.wav
          --output-dir target/evaluation-artifacts
          --renderer all
          --commit-sha "${GITHUB_SHA}"
      - name: Upload renderer evaluation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: renderer-evaluation-${{ github.sha }}
          path: target/evaluation-artifacts
          if-no-files-found: error
          retention-days: 14

  windows-stable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - name: Verify public API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps

  msrv-1-78:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.78.0
      - name: Install Linux audio build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libasound2-dev
      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-1-78-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msrv-1-78-
      - run: cargo check --workspace --all-targets --all-features --locked
      - run: cargo test --workspace --all-features --locked
