name: Temporary Source Manager rustfmt

on:
  push:
    branches:
      - feature/source-manager-v1

permissions:
  contents: write

jobs:
  rustfmt:
    if: "!contains(github.event.head_commit.message, '[rustfmt-bot]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/source-manager-v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nothing to format"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/aurora-plugin-api/src/source_manager.rs crates/aurora-plugin-api/src/lib.rs
          git commit -m "Format Source Manager [rustfmt-bot]"
          git push origin HEAD:feature/source-manager-v1
