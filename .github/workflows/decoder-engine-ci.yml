name: Decoder Engine CI

on:
  workflow_dispatch:
  push:
    branches:
      - feature/aurora-decoder-engine-v1
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/aurora-decoder-api/**"
      - "crates/aurora-decoder-open/**"
      - "crates/aurora-decoder-engine/**"
      - "config/external-components-v1.json"
      - "scripts/check_external_components.py"
      - ".github/workflows/decoder-engine-ci.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/aurora-decoder-api/**"
      - "crates/aurora-decoder-open/**"
      - "crates/aurora-decoder-engine/**"
      - "config/external-components-v1.json"
      - "scripts/check_external_components.py"
      - ".github/workflows/decoder-engine-ci.yml"

permissions:
  contents: read

concurrency:
  group: decoder-engine-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  decoder-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
      - name: Validate external component policy
        run: python3 scripts/check_external_components.py
      - name: Resolve workspace lockfile
        run: cargo generate-lockfile
      - name: Check decoder engine
        run: cargo check -p aurora-decoder-engine --all-targets
      - name: Test decoder engine
        run: cargo test -p aurora-decoder-engine
      - name: Strict clippy
        run: cargo clippy -p aurora-decoder-engine --all-targets -- -D warnings
      - name: Formatting
        run: cargo fmt --all --check
      - name: Upload resolved lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decoder-engine-lock-${{ github.sha }}
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 7
