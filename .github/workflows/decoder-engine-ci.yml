name: Decoder Engine + Spatial Runtime CI

on:
  workflow_dispatch:
  push:
    branches:
      - feature/aurora-decoder-engine-v1
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/aurora-decoder-api/**"
      - "crates/aurora-spatial-ir/**"
      - "crates/aurora-spatial-ir-v2/**"
      - "crates/aurora-spatial-transport-v2/**"
      - "crates/aurora-decoder-open/**"
      - "crates/aurora-decoder-engine/**"
      - "crates/aurora-decoder-iamf/**"
      - "crates/aurora-decoder-truehdd/**"
      - "crates/aurora-decoder-mpegh/**"
      - "crates/aurora-super-decoder/**"
      - "crates/aurora-spatial-runtime/**"
      - "crates/aurora-spatial-runtime-v2/**"
      - "crates/aurora-renderer-api/**"
      - "crates/aurora-renderer-vbap/**"
      - "config/external-components-v1.json"
      - "scripts/check_external_components.py"
      - ".github/workflows/decoder-engine-ci.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/aurora-decoder-api/**"
      - "crates/aurora-spatial-ir/**"
      - "crates/aurora-spatial-ir-v2/**"
      - "crates/aurora-spatial-transport-v2/**"
      - "crates/aurora-decoder-open/**"
      - "crates/aurora-decoder-engine/**"
      - "crates/aurora-decoder-iamf/**"
      - "crates/aurora-decoder-truehdd/**"
      - "crates/aurora-decoder-mpegh/**"
      - "crates/aurora-super-decoder/**"
      - "crates/aurora-spatial-runtime/**"
      - "crates/aurora-spatial-runtime-v2/**"
      - "crates/aurora-renderer-api/**"
      - "crates/aurora-renderer-vbap/**"
      - "config/external-components-v1.json"
      - "scripts/check_external_components.py"
      - ".github/workflows/decoder-engine-ci.yml"

permissions:
  contents: read

concurrency:
  group: decoder-spatial-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  decoder-spatial:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
      - name: Validate external component policy
        run: python3 scripts/check_external_components.py
      - name: Resolve workspace lockfile
        run: cargo generate-lockfile
      - name: Check Spatial IR V1
        run: cargo check -p aurora-spatial-ir --all-targets
      - name: Check Spatial IR V2
        run: cargo check -p aurora-spatial-ir-v2 --all-targets
      - name: Check Spatial Transport V2
        run: cargo check -p aurora-spatial-transport-v2 --all-targets
      - name: Check decoder engine
        run: cargo check -p aurora-decoder-engine --all-targets
      - name: Check native IAMF adapter
        run: cargo check -p aurora-decoder-iamf --all-targets
      - name: Check MPEG-H metadata and transport adapter without native linkage
        run: cargo check -p aurora-decoder-mpegh --all-targets
      - name: Check Aurora super decoder
        run: cargo check -p aurora-super-decoder --all-targets
      - name: Check spatial runtime V1
        run: cargo check -p aurora-spatial-runtime --all-targets
      - name: Check spatial runtime V2 bridge
        run: cargo check -p aurora-spatial-runtime-v2 --all-targets
      - name: Check disabled TrueHD boundary on baseline toolchain
        run: cargo check -p aurora-decoder-truehdd --all-targets
      - name: Test Spatial IR V1
        run: cargo test -p aurora-spatial-ir
      - name: Test Spatial IR V2
        run: cargo test -p aurora-spatial-ir-v2
      - name: Test Spatial Transport V2
        run: cargo test -p aurora-spatial-transport-v2
      - name: Test decoder engine
        run: cargo test -p aurora-decoder-engine
      - name: Test native IAMF adapter
        run: cargo test -p aurora-decoder-iamf
      - name: Test MPEG-H metadata and transport adapter
        run: cargo test -p aurora-decoder-mpegh
      - name: Test Aurora super decoder
        run: cargo test -p aurora-super-decoder
      - name: Test spatial runtime V1
        run: cargo test -p aurora-spatial-runtime
      - name: Test spatial runtime V2 bridge
        run: cargo test -p aurora-spatial-runtime-v2
      - name: Strict Spatial IR V2 clippy
        run: cargo clippy -p aurora-spatial-ir-v2 --all-targets -- -D warnings
      - name: Strict Spatial Transport V2 clippy
        run: cargo clippy -p aurora-spatial-transport-v2 --all-targets -- -D warnings
      - name: Strict decoder clippy
        run: cargo clippy -p aurora-decoder-engine --all-targets -- -D warnings
      - name: Strict IAMF clippy
        run: cargo clippy -p aurora-decoder-iamf --all-targets -- -D warnings
      - name: Strict MPEG-H parser/transport clippy
        run: cargo clippy -p aurora-decoder-mpegh --all-targets -- -D warnings
      - name: Strict super decoder clippy
        run: cargo clippy -p aurora-super-decoder --all-targets -- -D warnings
      - name: Strict spatial runtime V1 clippy
        run: cargo clippy -p aurora-spatial-runtime --all-targets -- -D warnings
      - name: Strict spatial runtime V2 clippy
        run: cargo clippy -p aurora-spatial-runtime-v2 --all-targets -- -D warnings
      - name: Formatting
        run: cargo fmt --all --check
      - name: Upload resolved lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decoder-spatial-lock-${{ github.sha }}
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 7

  native-truehd:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: Resolve workspace lockfile
        run: cargo generate-lockfile
      - name: Check Spatial IR V2
        run: cargo check -p aurora-spatial-ir-v2 --all-targets
      - name: Check Spatial runtime V2 bridge
        run: cargo check -p aurora-spatial-runtime-v2 --all-targets
      - name: Check native TrueHD V1 and V2 adapters
        run: cargo check -p aurora-decoder-truehdd --features native-truehd --all-targets
      - name: Check super decoder with native TrueHD V2
        run: cargo check -p aurora-super-decoder --features native-truehd --all-targets
      - name: Test native TrueHD V1 and V2 adapters
        run: cargo test -p aurora-decoder-truehdd --features native-truehd
      - name: Test super decoder with native TrueHD V2
        run: cargo test -p aurora-super-decoder --features native-truehd
      - name: Test Spatial runtime V2 bridge
        run: cargo test -p aurora-spatial-runtime-v2
      - name: Strict native TrueHD V1 and V2 clippy
        run: cargo clippy -p aurora-decoder-truehdd --features native-truehd --all-targets -- -D warnings
      - name: Strict super decoder TrueHD V2 clippy
        run: cargo clippy -p aurora-super-decoder --features native-truehd --all-targets -- -D warnings
      - name: Strict spatial runtime V2 clippy
        run: cargo clippy -p aurora-spatial-runtime-v2 --all-targets -- -D warnings
      - name: Formatting
        run: cargo fmt --all --check
      - name: Upload native TrueHD lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-truehd-lock-${{ github.sha }}
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 7
