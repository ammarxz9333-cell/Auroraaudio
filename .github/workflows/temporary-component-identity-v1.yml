name: Temporary component identity v1

on:
  push:
    branches:
      - feature/runtime-component-identity-v1

permissions:
  contents: write

jobs:
  implement:
    if: "!contains(github.event.head_commit.message, '[component-identity-bot]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/runtime-component-identity-v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux audio build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Add prepared component identities and alternate DSP proof
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          # Runtime assembly is the source of truth for implementation identities and compatible contract versions.
          replace_once(
              'crates/aurora-runtime-assembly/src/lib.rs',
              '/// Version of the runtime-plan contract defined by this crate.\npub const RUNTIME_PLAN_CONTRACT_VERSION: u16 = 1;\n',
              '''/// Version of the runtime-plan contract defined by this crate.\npub const RUNTIME_PLAN_CONTRACT_VERSION: u16 = 1;\n/// Compatible renderer contract version selected by runtime assembly.\npub const REALTIME_RENDERER_CONTRACT_VERSION: u16 = 1;\n/// Compatible realtime-delay contract version selected by runtime assembly.\npub const REALTIME_DELAY_CONTRACT_VERSION: u16 = 1;\n/// Stable implementation identity for Aurora's current basic renderer.\npub const BASIC_RENDERER_IMPLEMENTATION_ID: &str = "org.aurora.renderer.basic";\n/// Stable implementation identity for Aurora's current VBAP renderer family.\npub const VBAP_RENDERER_IMPLEMENTATION_ID: &str = "org.aurora.renderer.vbap";\n/// Stable implementation identity for Aurora's current basic realtime delay component.\npub const BASIC_DELAY_IMPLEMENTATION_ID: &str = "org.aurora.dsp.basic-delay";\n'''
          )
          replace_once(
              'crates/aurora-runtime-assembly/src/lib.rs',
              '    /// Returns the explicitly absent or deferred DSP state.\n    pub fn dsp(&self) -> PreparedDspPlan {\n        self.dsp\n    }\n}\n',
              '''    /// Returns the explicitly absent or deferred DSP state.\n    pub fn dsp(&self) -> PreparedDspPlan {\n        self.dsp\n    }\n\n    /// Returns deterministic component implementation intent for later setup.\n    ///\n    /// These identities are control-plane selections only. They do not prove that\n    /// an implementation was loaded, activated, negotiated, or observed at runtime.\n    pub fn realtime_components(&self) -> PreparedRealtimeComponentSelection {\n        let renderer = match self.renderer.kind() {\n            PreparedRendererKind::BasicInverseDistance => PreparedComponentIdentity::new(\n                BASIC_RENDERER_IMPLEMENTATION_ID,\n                REALTIME_RENDERER_CONTRACT_VERSION,\n            ),\n            PreparedRendererKind::PointSourceHorizontalVbap\n            | PreparedRendererKind::HorizontalSpreadVbap => PreparedComponentIdentity::new(\n                VBAP_RENDERER_IMPLEMENTATION_ID,\n                REALTIME_RENDERER_CONTRACT_VERSION,\n            ),\n        };\n        PreparedRealtimeComponentSelection {\n            renderer,\n            realtime_delay: PreparedComponentIdentity::new(\n                BASIC_DELAY_IMPLEMENTATION_ID,\n                REALTIME_DELAY_CONTRACT_VERSION,\n            ),\n        }\n    }\n}\n\n/// Stable implementation identity plus the Aurora contract version it is prepared against.\n#[derive(Clone, Copy, Debug, Eq, PartialEq)]\npub struct PreparedComponentIdentity {\n    implementation_id: &'static str,\n    contract_version: u16,\n}\n\nimpl PreparedComponentIdentity {\n    /// Creates one deterministic prepared component identity.\n    pub const fn new(implementation_id: &'static str, contract_version: u16) -> Self {\n        Self {\n            implementation_id,\n            contract_version,\n        }\n    }\n\n    /// Returns the stable implementation identifier.\n    pub const fn implementation_id(self) -> &'static str {\n        self.implementation_id\n    }\n\n    /// Returns the compatible Aurora component-contract version.\n    pub const fn contract_version(self) -> u16 {\n        self.contract_version\n    }\n}\n\n/// Prepared renderer and realtime-delay implementation selections.\n#[derive(Clone, Copy, Debug, Eq, PartialEq)]\npub struct PreparedRealtimeComponentSelection {\n    renderer: PreparedComponentIdentity,\n    realtime_delay: PreparedComponentIdentity,\n}\n\nimpl PreparedRealtimeComponentSelection {\n    /// Returns the prepared renderer implementation identity.\n    pub const fn renderer(self) -> PreparedComponentIdentity {\n        self.renderer\n    }\n\n    /// Returns the prepared realtime-delay implementation identity.\n    pub const fn realtime_delay(self) -> PreparedComponentIdentity {\n        self.realtime_delay\n    }\n}\n'''
          )

          # Materialization consumes/re-exports the runtime-assembly source of truth.
          replace_once(
              'crates/aurora-runtime-materialization/Cargo.toml',
              'aurora-renderer-vbap = { path = "../aurora-renderer-vbap" }\naurora-scene = { path = "../aurora-scene" }\n\n[dev-dependencies]\nserde_json.workspace = true\n',
              'aurora-renderer-vbap = { path = "../aurora-renderer-vbap" }\naurora-runtime-assembly = { path = "../aurora-runtime-assembly" }\naurora-scene = { path = "../aurora-scene" }\n\n[dev-dependencies]\naurora-dsp-api = { path = "../aurora-dsp-api" }\nserde_json.workspace = true\n'
          )
          replace_once(
              'crates/aurora-runtime-materialization/src/lib.rs',
              'use aurora_renderer_vbap::VbapRenderer;\nuse aurora_scene::RenderScene;\n\n/// Stable identity for Aurora\'s current default realtime delay implementation.\npub const BASIC_DELAY_IMPLEMENTATION_ID: &str = "org.aurora.dsp.basic-delay";\n/// Stable identity for Aurora\'s basic geometric renderer implementation.\npub const BASIC_RENDERER_IMPLEMENTATION_ID: &str = "org.aurora.renderer.basic";\n/// Stable identity for Aurora\'s horizontal VBAP renderer implementation.\npub const VBAP_RENDERER_IMPLEMENTATION_ID: &str = "org.aurora.renderer.vbap";\n',
              '''use aurora_renderer_vbap::VbapRenderer;\npub use aurora_runtime_assembly::{\n    BASIC_DELAY_IMPLEMENTATION_ID, BASIC_RENDERER_IMPLEMENTATION_ID,\n    REALTIME_DELAY_CONTRACT_VERSION, REALTIME_RENDERER_CONTRACT_VERSION,\n    VBAP_RENDERER_IMPLEMENTATION_ID,\n};\nuse aurora_scene::RenderScene;\n'''
          )

          # Explicit second DSP adapter proof at the same prepared-components boundary.
          replace_once(
              'crates/aurora-runtime-materialization/src/lib.rs',
              'mod tests {\n    use aurora_realtime_engine::{ProcessStatus, RealTimeEngineConfig, TestSignal};\n\n    use super::*;\n',
              '''mod tests {\n    use aurora_dsp_api::{RealtimeDelayProcessor, RealtimeDspFault};\n    use aurora_realtime_engine::{ProcessStatus, RealTimeEngineConfig, TestSignal};\n\n    use super::*;\n\n    #[derive(Debug)]\n    struct AlternatePassThroughDelay {\n        channels: usize,\n        max_delay_samples: f32,\n    }\n\n    impl RealtimeDelayProcessor for AlternatePassThroughDelay {\n        fn channel_count(&self) -> usize {\n            self.channels\n        }\n\n        fn max_delay_samples(&self) -> f32 {\n            self.max_delay_samples\n        }\n\n        fn set_delays(&mut self, delays_samples: &[f32]) -> Result<(), RealtimeDspFault> {\n            if delays_samples.len() != self.channels {\n                return Err(RealtimeDspFault::DelayShape);\n            }\n            if delays_samples.iter().any(|value| {\n                !value.is_finite() || *value < 0.0 || *value > self.max_delay_samples\n            }) {\n                return Err(RealtimeDspFault::DelayValue);\n            }\n            Ok(())\n        }\n\n        fn process_planar(\n            &mut self,\n            input: &[Vec<f32>],\n            output: &mut [Vec<f32>],\n            frame_count: usize,\n        ) -> Result<(), RealtimeDspFault> {\n            if input.len() != self.channels\n                || output.len() != self.channels\n                || input.iter().any(|channel| channel.len() < frame_count)\n                || output.iter().any(|channel| channel.len() < frame_count)\n            {\n                return Err(RealtimeDspFault::BufferShape);\n            }\n            for (source, destination) in input.iter().zip(output.iter_mut()) {\n                destination[..frame_count].copy_from_slice(&source[..frame_count]);\n            }\n            Ok(())\n        }\n\n        fn reset(&mut self) {}\n\n        fn latency_frames(&self) -> usize {\n            0\n        }\n    }\n'''
          )
          replace_once(
              'crates/aurora-runtime-materialization/src/lib.rs',
              '    #[test]\n    fn basic_and_vbap_materialize_through_the_same_engine_boundary() {\n',
              '''    #[test]\n    fn alternate_delay_adapter_uses_the_same_prepared_component_boundary() {\n        let scene = scene();\n        let config = config();\n        let speakers = scene.ordered_speakers().unwrap();\n        let mut renderer =\n            BasicRenderer::new(BasicRendererMode::InverseDistance).with_smoothing(0.35);\n        renderer\n            .configure(speakers, config.sample_rate, config.block_size, 1)\n            .unwrap();\n        let requirements =\n            RealTimeEngine::delay_requirements(&scene, &config, renderer.capabilities()).unwrap();\n        let alternate = AlternatePassThroughDelay {\n            channels: requirements.channel_count(),\n            max_delay_samples: requirements.max_delay_samples(),\n        };\n        let mut engine = RealTimeEngine::new_with_prepared_components(\n            scene,\n            config,\n            256,\n            Box::new(renderer),\n            Box::new(alternate),\n        )\n        .unwrap();\n        let mut output = vec![0.0_f32; 512];\n        assert_eq!(\n            engine.process_interleaved(None, &mut output),\n            ProcessStatus::Ok\n        );\n        assert!(output.iter().any(|sample| sample.abs() > f32::EPSILON));\n    }\n\n    #[test]\n    fn failed_replacement_preparation_does_not_mutate_existing_engine() {\n        let mut active = materialize_default_realtime_engine(scene(), config(), 256).unwrap();\n        let mut before = vec![0.0_f32; 512];\n        assert_eq!(active.process_interleaved(None, &mut before), ProcessStatus::Ok);\n        let callbacks_before = active.metrics().callback_count;\n\n        let replacement_scene = scene();\n        let replacement_config = config();\n        let speakers = replacement_scene.ordered_speakers().unwrap();\n        let mut renderer =\n            BasicRenderer::new(BasicRendererMode::InverseDistance).with_smoothing(0.35);\n        renderer\n            .configure(\n                speakers,\n                replacement_config.sample_rate,\n                replacement_config.block_size,\n                1,\n            )\n            .unwrap();\n        let invalid_delay = AlternatePassThroughDelay {\n            channels: 1,\n            max_delay_samples: 0.0,\n        };\n        assert!(RealTimeEngine::new_with_prepared_components(\n            replacement_scene,\n            replacement_config,\n            256,\n            Box::new(renderer),\n            Box::new(invalid_delay),\n        )\n        .is_err());\n\n        let mut after = vec![0.0_f32; 512];\n        assert_eq!(active.process_interleaved(None, &mut after), ProcessStatus::Ok);\n        assert_eq!(active.metrics().callback_count, callbacks_before + 1);\n        assert!(after.iter().all(|sample| sample.is_finite()));\n    }\n\n    #[test]\n    fn component_identity_constants_come_from_runtime_assembly() {\n        assert_eq!(BASIC_RENDERER_IMPLEMENTATION_ID, "org.aurora.renderer.basic");\n        assert_eq!(VBAP_RENDERER_IMPLEMENTATION_ID, "org.aurora.renderer.vbap");\n        assert_eq!(BASIC_DELAY_IMPLEMENTATION_ID, "org.aurora.dsp.basic-delay");\n        assert_eq!(REALTIME_RENDERER_CONTRACT_VERSION, 1);\n        assert_eq!(REALTIME_DELAY_CONTRACT_VERSION, 1);\n    }\n\n    #[test]\n    fn basic_and_vbap_materialize_through_the_same_engine_boundary() {\n'''
          )

          # Inspection schema v2 exposes prepared component identity separately from DSP-graph intent.
          replace_once(
              'crates/aurora-runtime-inspection/src/model.rs',
              'pub const INSPECTION_SCHEMA_VERSION: u16 = 1;',
              'pub const INSPECTION_SCHEMA_VERSION: u16 = 2;'
          )
          replace_once(
              'crates/aurora-runtime-inspection/src/model.rs',
              '    /// Prepared DSP state.\n    pub prepared_dsp: DspProjection,\n    /// Prepared routing and layout facts.\n',
              '''    /// Prepared DSP graph state from configuration intent.\n    pub prepared_dsp: DspProjection,\n    /// Prepared renderer and realtime-delay implementation identities.\n    pub prepared_components: RealtimeComponentProjection,\n    /// Prepared routing and layout facts.\n'''
          )
          replace_once(
              'crates/aurora-runtime-inspection/src/model.rs',
              '/// Prepared DSP state supported by the accepted schema.\n',
              '''/// One prepared component implementation identity.\n#[derive(Clone, Debug, Eq, PartialEq, Serialize)]\npub struct ComponentIdentityProjection {\n    /// Stable implementation identifier selected by runtime assembly.\n    pub implementation_id: String,\n    /// Aurora contract version the selection is prepared against.\n    pub contract_version: u16,\n}\n\n/// Prepared realtime component selections.\n///\n/// These are deterministic control-plane selections, not observed or activated runtime state.\n#[derive(Clone, Debug, Eq, PartialEq, Serialize)]\npub struct RealtimeComponentProjection {\n    /// Prepared renderer implementation identity.\n    pub renderer: ComponentIdentityProjection,\n    /// Prepared realtime delay implementation identity.\n    pub realtime_delay: ComponentIdentityProjection,\n}\n\n/// Prepared DSP state supported by the accepted schema.\n'''
          )
          replace_once(
              'crates/aurora-runtime-inspection/src/model.rs',
              '        let format = plan.execution().audio_format();\n        let capacity = plan.capacity();\n',
              '''        let format = plan.execution().audio_format();\n        let capacity = plan.capacity();\n        let components = plan.execution().realtime_components();\n        let renderer_component = components.renderer();\n        let delay_component = components.realtime_delay();\n'''
          )
          replace_once(
              'crates/aurora-runtime-inspection/src/model.rs',
              '            prepared_dsp: dsp(plan.execution().dsp()),\n            prepared_topology: TopologyProjection {\n',
              '''            prepared_dsp: dsp(plan.execution().dsp()),\n            prepared_components: RealtimeComponentProjection {\n                renderer: ComponentIdentityProjection {\n                    implementation_id: self.source_string(renderer_component.implementation_id())?,\n                    contract_version: renderer_component.contract_version(),\n                },\n                realtime_delay: ComponentIdentityProjection {\n                    implementation_id: self.source_string(delay_component.implementation_id())?,\n                    contract_version: delay_component.contract_version(),\n                },\n            },\n            prepared_topology: TopologyProjection {\n'''
          )

          # Text projection gains explicit prepared component identity lines.
          replace_once(
              'crates/aurora-runtime-inspection/src/formatter/text.rs',
              '        output.line(&format!("dsp.state: {}", dsp(runtime.prepared_dsp)))?;\n        output.line(&format!(\n            "topology.layout_kind: {}",\n',
              '''        output.line(&format!("dsp.state: {}", dsp(runtime.prepared_dsp)))?;\n        output.line(&format!(\n            "component.renderer.implementation_id: {}",\n            quote(&runtime.prepared_components.renderer.implementation_id)?\n        ))?;\n        output.line(&format!(\n            "component.renderer.contract_version: {}",\n            runtime.prepared_components.renderer.contract_version\n        ))?;\n        output.line(&format!(\n            "component.realtime_delay.implementation_id: {}",\n            quote(&runtime.prepared_components.realtime_delay.implementation_id)?\n        ))?;\n        output.line(&format!(\n            "component.realtime_delay.contract_version: {}",\n            runtime.prepared_components.realtime_delay.contract_version\n        ))?;\n        output.line(&format!(\n            "topology.layout_kind: {}",\n'''
          )

          # Add explicit inspection assertions.
          replace_once(
              'crates/aurora-runtime-inspection/src/model/tests.rs',
              '#[test]\nfn fact_semantics_exclude_unrepresented_runtime_evidence() {\n',
              '''#[test]\nfn prepared_component_identities_are_reported_as_control_plane_intent() {\n    let report = report(InspectionOptions::default());\n    assert_eq!(report.inspection_schema_version(), 2);\n    assert_eq!(\n        report.runtime().prepared_components.renderer.implementation_id,\n        "org.aurora.renderer.basic"\n    );\n    assert_eq!(\n        report.runtime().prepared_components.renderer.contract_version,\n        1\n    );\n    assert_eq!(\n        report.runtime().prepared_components.realtime_delay.implementation_id,\n        "org.aurora.dsp.basic-delay"\n    );\n    assert_eq!(\n        report.runtime().prepared_components.realtime_delay.contract_version,\n        1\n    );\n}\n\n#[test]\nfn vbap_intent_uses_vbap_component_identity() {\n    let report = fixture_report(POINT, InspectionOptions::default());\n    assert_eq!(\n        report.runtime().prepared_components.renderer.implementation_id,\n        "org.aurora.renderer.vbap"\n    );\n}\n\n#[test]\nfn fact_semantics_exclude_unrepresented_runtime_evidence() {\n'''
          )

          # Update deterministic exact fixtures for schema v2.
          json_insert = '"prepared_dsp":"none","prepared_components":{"renderer":{"implementation_id":"org.aurora.renderer.basic","contract_version":1},"realtime_delay":{"implementation_id":"org.aurora.dsp.basic-delay","contract_version":1}},'
          for name in ['stereo-redacted.json', 'stereo-unredacted.json']:
              p = Path('crates/aurora-runtime-inspection/src/model/expected') / name
              text = p.read_text()
              text = text.replace('"inspection_schema_version":1', '"inspection_schema_version":2', 1)
              old = '"prepared_dsp":"none",'
              if text.count(old) != 1:
                  raise SystemExit(f'{name}: prepared_dsp anchor missing')
              p.write_text(text.replace(old, json_insert, 1))

          text_insert = '''dsp.state: none\ncomponent.renderer.implementation_id: "org.aurora.renderer.basic"\ncomponent.renderer.contract_version: 1\ncomponent.realtime_delay.implementation_id: "org.aurora.dsp.basic-delay"\ncomponent.realtime_delay.contract_version: 1\n'''
          for name in ['stereo-redacted.txt', 'stereo-unredacted.txt']:
              p = Path('crates/aurora-runtime-inspection/src/model/expected') / name
              text = p.read_text()
              text = text.replace('inspection_schema_version: 1', 'inspection_schema_version: 2', 1)
              old = 'dsp.state: none\n'
              if text.count(old) != 1:
                  raise SystemExit(f'{name}: dsp text anchor missing')
              p.write_text(text.replace(old, text_insert, 1))

          # Truth documentation: identities are selections, not runtime evidence.
          p = Path('docs/plugin-architecture.md')
          text = p.read_text()
          anchor = '`aurora-realtime-engine` now owns only Aurora renderer/DSP contracts and caller-supplied prepared component instances. Concrete BasicRenderer/VBAP and basic-delay selection is performed by `aurora-runtime-materialization` on the control thread; renderer and DSP capability mismatches fail before callback activation. Application/provider plugins remain outside this realtime component injection path.'
          addition = anchor + '\n\n`aurora-runtime-assembly` is the source of truth for stable realtime component implementation IDs and compatible contract versions. Runtime inspection may report those values only as deterministic prepared control-plane selections; they are not evidence that an implementation was loaded, activated, negotiated, measured, or observed.'
          if anchor not in text:
              raise SystemExit('architecture identity anchor missing')
          p.write_text(text.replace(anchor, addition, 1))

      - name: Format and validate identity slice
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test -p aurora-runtime-assembly -p aurora-runtime-inspection -p aurora-runtime-materialization --all-features --locked
          cargo test -p aurora-realtime-engine --all-features --locked
          grep -RIn 'org.aurora.renderer.basic' crates/aurora-runtime-assembly/src/lib.rs crates/aurora-runtime-materialization/src/lib.rs crates/aurora-runtime-inspection/src/model.rs
      - name: Commit production slice
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates docs/plugin-architecture.md
          git commit -m "Add prepared runtime component identities [component-identity-bot]"
          git push origin HEAD:feature/runtime-component-identity-v1
