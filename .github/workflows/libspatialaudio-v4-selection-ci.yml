name: Libspatialaudio V4 Selection CI

on:
  pull_request:
    paths:
      - "adapters/aurora-runtime-libspatialaudio-v4-selection/**"
      - "adapters/aurora-runtime-libspatialaudio-selector/**"
      - "crates/aurora-config/**"
      - ".github/workflows/libspatialaudio-v4-selection-ci.yml"

permissions:
  contents: read

jobs:
  rust:
    strategy:
      matrix:
        toolchain: [stable, "1.78.0"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path adapters/aurora-runtime-libspatialaudio-v4-selection/Cargo.toml -- --check
      - name: Check
        run: cargo check --manifest-path adapters/aurora-runtime-libspatialaudio-v4-selection/Cargo.toml --all-targets
      - name: Clippy
        run: cargo clippy --manifest-path adapters/aurora-runtime-libspatialaudio-v4-selection/Cargo.toml --all-targets -- -D warnings
      - name: Tests
        run: cargo test --manifest-path adapters/aurora-runtime-libspatialaudio-v4-selection/Cargo.toml
