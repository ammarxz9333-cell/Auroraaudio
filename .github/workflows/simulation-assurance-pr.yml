name: Simulation Assurance PR Smoke

on:
  pull_request:
    branches:
      - main-v2
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/aurora-core/**"
      - "crates/aurora-dsp-api/**"
      - "crates/aurora-dsp-basic/**"
      - "crates/aurora-realtime-audio-api/**"
      - "crates/aurora-realtime-audio-sim/**"
      - "crates/aurora-realtime-engine/**"
      - "crates/aurora-renderer-api/**"
      - "crates/aurora-renderer-basic/**"
      - "crates/aurora-renderer-vbap/**"
      - "crates/aurora-scene/**"
      - "crates/aurora-simulation-assurance/**"
      - "fixtures/scenes/**"
      - "fixtures/simulation/**"
      - ".github/workflows/simulation-assurance-pr.yml"

permissions:
  contents: read

concurrency:
  group: simulation-assurance-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux audio build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libasound2-dev
      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-assurance-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-assurance-
            ${{ runner.os }}-cargo-
      - name: Run 500-scenario deterministic smoke campaign
        run: >-
          cargo run --release -p aurora-simulation-assurance --
          --level smoke --scenarios 500 --start-seed 0
          --report output/simulation-assurance/pr-smoke.json
      - name: Verify simulation and warmed-up allocation guards
        run: >-
          cargo test
          -p aurora-simulation-assurance
          -p aurora-realtime-engine
          -p aurora-renderer-vbap
          --all-features
      - name: Upload bounded smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-assurance-pr-smoke
          path: output/simulation-assurance/**/*.json
          if-no-files-found: error
