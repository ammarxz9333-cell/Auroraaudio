name: Temporary clean runtime materialization validation

on:
  push:
    branches:
      - refactor/runtime-materialize-delay-v1

permissions:
  contents: write

jobs:
  validate:
    if: "!contains(github.event.head_commit.message, '[materialization-rebase-bot]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/runtime-materialize-delay-v1
      - name: Apply clean materialization slice on prepared-DSP seam
        shell: python
        run: |
          from pathlib import Path

          root = Path('Cargo.toml')
          text = root.read_text()
          anchor = '    "crates/aurora-runtime-assembly",\n'
          member = '    "crates/aurora-runtime-materialization",\n'
          if member not in text:
              if anchor not in text:
                  raise SystemExit('workspace runtime-assembly anchor missing')
              root.write_text(text.replace(anchor, anchor + member, 1))

          cargo = Path('crates/aurora-realtime-engine/Cargo.toml')
          text = cargo.read_text()
          text = text.replace('aurora-dsp-basic = { path = "../aurora-dsp-basic" }\n', '', 1)
          dev_anchor = '[dev-dependencies]\n'
          dev_dep = 'aurora-dsp-basic = { path = "../aurora-dsp-basic" }\n'
          if dev_dep not in text.split(dev_anchor, 1)[1]:
              text = text.replace(dev_anchor, dev_anchor + dev_dep, 1)
          cargo.write_text(text)

          lib = Path('crates/aurora-realtime-engine/src/lib.rs')
          text = lib.read_text()
          text = text.replace('use aurora_dsp_basic::DelayProcessor;\n', '', 1)

          caps_anchor = '''/// Bounded single-thread ring buffer for preallocated control-side staging.\n'''
          requirements = '''/// Realtime delay capabilities required before a prepared DSP can be activated.\n#[derive(Debug, Clone, Copy, PartialEq)]\npub struct RealtimeDelayRequirements {\n    channel_count: usize,\n    max_delay_samples: f32,\n}\n\nimpl RealtimeDelayRequirements {\n    /// Required rendered output channel count.\n    pub const fn channel_count(&self) -> usize {\n        self.channel_count\n    }\n\n    /// Minimum supported per-channel delay range in samples.\n    pub const fn max_delay_samples(&self) -> f32 {\n        self.max_delay_samples\n    }\n}\n\n'''
          if 'pub struct RealtimeDelayRequirements' not in text:
              if caps_anchor not in text:
                  raise SystemExit('requirements insertion anchor missing')
              text = text.replace(caps_anchor, requirements + caps_anchor, 1)

          old_new = '''    /// Creates a real-time engine using Aurora's current compatibility delay implementation.\n    pub fn new(\n        scene: RenderScene,\n        config: RealTimeEngineConfig,\n        estimated_device_latency_frames: usize,\n    ) -> Result<Self, RealTimeEngineError> {\n        Self::build(scene, config, estimated_device_latency_frames, None)\n    }\n\n'''
          if old_new not in text:
              raise SystemExit('compatibility constructor anchor missing')
          text = text.replace(old_new, '', 1)

          prepared_anchor = '''    /// Creates a real-time engine from a caller-supplied prepared delay processor.\n'''
          req_method = '''    /// Returns the fixed delay capabilities required for this scene/configuration.\n    ///\n    /// This is control-thread preparation only. Materializers use it to provision\n    /// a DSP implementation before handing that component to the engine.\n    pub fn delay_requirements(\n        scene: &RenderScene,\n        config: &RealTimeEngineConfig,\n    ) -> Result<RealtimeDelayRequirements, RealTimeEngineError> {\n        if config.sample_rate == 0 || config.block_size == 0 {\n            return Err(RealTimeEngineError::InvalidConfig(\n                "sample_rate and block_size must be greater than zero".to_owned(),\n            ));\n        }\n        if config.test_signal == TestSignal::None && config.input_channels == 0 {\n            return Err(RealTimeEngineError::InvalidConfig(\n                "live input requires at least one input channel".to_owned(),\n            ));\n        }\n        let ordered_speakers = scene.ordered_speakers()?;\n        if ordered_speakers.is_empty() {\n            return Err(RealTimeEngineError::InvalidConfig(\n                "scene must contain at least one output speaker".to_owned(),\n            ));\n        }\n        let geometric = calculate_geometric_delays(\n            &ordered_speakers,\n            scene.listener,\n            config.sample_rate,\n            config.speed_of_sound,\n        );\n        let delays = if config.apply_geometric_delay {\n            geometric\n                .iter()\n                .map(|delay| delay.delay_samples)\n                .collect::<Vec<_>>()\n        } else {\n            vec![0.0; ordered_speakers.len()]\n        };\n        let mut max_delay_samples =\n            delays.iter().copied().fold(0.0_f32, f32::max).ceil() + 2.0;\n        if config.apply_geometric_delay\n            || config.renderer_mode == BasicRendererMode::GeometricBinaural\n        {\n            max_delay_samples =\n                max_delay_samples.max(CURRENT_DYNAMIC_DELAY_CAPACITY_SAMPLES);\n        }\n        Ok(RealtimeDelayRequirements {\n            channel_count: ordered_speakers.len(),\n            max_delay_samples,\n        })\n    }\n\n'''
          if 'pub fn delay_requirements(' not in text:
              if prepared_anchor not in text:
                  raise SystemExit('prepared constructor documentation anchor missing')
              text = text.replace(prepared_anchor, req_method + prepared_anchor, 1)

          text = text.replace(
              '''        Self::build(\n            scene,\n            config,\n            estimated_device_latency_frames,\n            Some(delay_processor),\n        )\n''',
              '''        Self::build(\n            scene,\n            config,\n            estimated_device_latency_frames,\n            delay_processor,\n        )\n''',
              1,
          )
          text = text.replace(
              '        prepared_delay_processor: Option<Box<dyn RealtimeDelayProcessor>>,\n',
              '        mut delay_processor: Box<dyn RealtimeDelayProcessor>,\n',
              1,
          )

          old_branch = '''        let channel_count = ordered_speakers.len();\n        let delay_processor: Box<dyn RealtimeDelayProcessor> =\n            if let Some(mut delay_processor) = prepared_delay_processor {\n                let actual_channels = delay_processor.channel_count();\n                if actual_channels != channel_count {\n                    return Err(PreparedDspError::ChannelCount {\n                        expected: channel_count,\n                        actual: actual_channels,\n                    }\n                    .into());\n                }\n                let actual_capacity = delay_processor.max_delay_samples();\n                if !actual_capacity.is_finite() || actual_capacity < max_delay {\n                    return Err(PreparedDspError::DelayCapacity {\n                        required: max_delay,\n                        actual: actual_capacity,\n                    }\n                    .into());\n                }\n                delay_processor\n                    .set_delays(&delays)\n                    .map_err(PreparedDspError::from_initial_fault)?;\n                delay_processor\n            } else {\n                let mut delay_processor: Box<dyn RealtimeDelayProcessor> =\n                    Box::new(DelayProcessor::new(channel_count, max_delay));\n                delay_processor.set_delays(&delays)?;\n                delay_processor\n            };\n'''
          new_branch = '''        let channel_count = ordered_speakers.len();\n        let actual_channels = delay_processor.channel_count();\n        if actual_channels != channel_count {\n            return Err(PreparedDspError::ChannelCount {\n                expected: channel_count,\n                actual: actual_channels,\n            }\n            .into());\n        }\n        let actual_capacity = delay_processor.max_delay_samples();\n        if !actual_capacity.is_finite() || actual_capacity < max_delay {\n            return Err(PreparedDspError::DelayCapacity {\n                required: max_delay,\n                actual: actual_capacity,\n            }\n            .into());\n        }\n        delay_processor\n            .set_delays(&delays)\n            .map_err(PreparedDspError::from_initial_fault)?;\n'''
          if old_branch not in text:
              raise SystemExit('prepared/default DSP branch anchor missing')
          text = text.replace(old_branch, new_branch, 1)

          # Unit tests keep the basic implementation strictly as a dev-only fixture.
          text = text.replace('RealTimeEngine::new(', 'test_engine(')
          test_anchor = '''    fn engine(test_signal: TestSignal, apply_delay: bool) -> RealTimeEngine {\n'''
          test_helper = '''    fn test_engine(\n        scene: RenderScene,\n        config: RealTimeEngineConfig,\n        estimated_device_latency_frames: usize,\n    ) -> Result<RealTimeEngine, RealTimeEngineError> {\n        let requirements = RealTimeEngine::delay_requirements(&scene, &config)?;\n        let delay = aurora_dsp_basic::DelayProcessor::new(\n            requirements.channel_count(),\n            requirements.max_delay_samples(),\n        );\n        RealTimeEngine::new_with_prepared_delay_processor(\n            scene,\n            config,\n            estimated_device_latency_frames,\n            Box::new(delay),\n        )\n    }\n\n'''
          if 'fn test_engine(' not in text:
              if test_anchor not in text:
                  raise SystemExit('unit test engine helper anchor missing')
              text = text.replace(test_anchor, test_helper + test_anchor, 1)
          lib.write_text(text)

          bench = Path('crates/aurora-realtime-engine/benches/common/mod.rs')
          text = bench.read_text()
          old = '''    RealTimeEngine::new(scene, config, block_size)\n        .expect("benchmark scene and engine configuration must be valid")\n'''
          new = '''    let requirements = RealTimeEngine::delay_requirements(&scene, &config)\n        .expect("benchmark delay requirements must be valid");\n    let delay = aurora_dsp_basic::DelayProcessor::new(\n        requirements.channel_count(),\n        requirements.max_delay_samples(),\n    );\n    RealTimeEngine::new_with_prepared_delay_processor(scene, config, block_size, Box::new(delay))\n        .expect("benchmark scene and engine configuration must be valid")\n'''
          if old not in text:
              raise SystemExit('benchmark constructor anchor missing')
          bench.write_text(text.replace(old, new, 1))

          crate = Path('crates/aurora-runtime-materialization')
          crate.joinpath('src').mkdir(parents=True, exist_ok=True)
          crate.joinpath('Cargo.toml').write_text('''[package]\nname = "aurora-runtime-materialization"\nversion = "0.1.0"\nedition.workspace = true\nlicense.workspace = true\nrepository.workspace = true\nrust-version.workspace = true\n\n[dependencies]\naurora-dsp-basic = { path = "../aurora-dsp-basic" }\naurora-realtime-engine = { path = "../aurora-realtime-engine" }\naurora-scene = { path = "../aurora-scene" }\n''')
          crate.joinpath('src/lib.rs').write_text('''//! Control-thread materialization of concrete Aurora runtime components.\n//!\n//! `aurora-runtime-assembly` remains a passive deterministic plan. This crate\n//! selects and constructs concrete implementations before callback activation.\n\n#![forbid(unsafe_code)]\n\nuse aurora_dsp_basic::DelayProcessor;\nuse aurora_realtime_engine::{RealTimeEngine, RealTimeEngineConfig, RealTimeEngineError};\nuse aurora_scene::RenderScene;\n\n/// Stable identity for Aurora's current basic realtime delay implementation.\npub const BASIC_DELAY_IMPLEMENTATION_ID: &str = "org.aurora.dsp.basic-delay";\n\n/// Materializes Aurora's current default realtime engine on the control thread.\npub fn materialize_default_realtime_engine(\n    scene: RenderScene,\n    config: RealTimeEngineConfig,\n    estimated_device_latency_frames: usize,\n) -> Result<RealTimeEngine, RealTimeEngineError> {\n    let requirements = RealTimeEngine::delay_requirements(&scene, &config)?;\n    let delay = DelayProcessor::new(\n        requirements.channel_count(),\n        requirements.max_delay_samples(),\n    );\n    RealTimeEngine::new_with_prepared_delay_processor(\n        scene,\n        config,\n        estimated_device_latency_frames,\n        Box::new(delay),\n    )\n}\n''')

          # Realtime acceptance now exercises the production materializer.
          acceptance_cargo = Path('crates/aurora-realtime-acceptance/Cargo.toml')
          text = acceptance_cargo.read_text()
          anchor = 'aurora-realtime-engine = { path = "../aurora-realtime-engine" }\n'
          dep = 'aurora-runtime-materialization = { path = "../aurora-runtime-materialization" }\n'
          if dep not in text:
              text = text.replace(anchor, anchor + dep, 1)
          acceptance_cargo.write_text(text)
          for name in ['examples/sustained_soak.rs', 'tests/engine_acceptance.rs']:
              path = Path('crates/aurora-realtime-acceptance') / name
              text = path.read_text()
              if 'materialize_default_realtime_engine' not in text:
                  scene_line = 'use aurora_scene'
                  idx = text.find(scene_line)
                  if idx < 0:
                      raise SystemExit(f'{name}: scene import anchor missing')
                  text = text[:idx] + 'use aurora_runtime_materialization::materialize_default_realtime_engine;\n' + text[idx:]
              text = text.replace('RealTimeEngine::new(', 'materialize_default_realtime_engine(')
              text = text.replace('    RealTimeEngine, ', '    ')
              text = text.replace('RealTimeEngine, ', '')
              path.write_text(text)

          # CLI control surfaces use the materializer rather than owning the default factory.
          cli_cargo = Path('crates/aurora-cli/Cargo.toml')
          text = cli_cargo.read_text()
          text = text.replace(
              'realtime = ["dep:aurora-realtime-acceptance", "dep:aurora-realtime-audio-api", "dep:aurora-realtime-audio-cpal", "dep:aurora-realtime-engine"]',
              'realtime = ["dep:aurora-realtime-acceptance", "dep:aurora-realtime-audio-api", "dep:aurora-realtime-audio-cpal", "dep:aurora-realtime-engine", "dep:aurora-runtime-materialization"]',
          )
          anchor = 'aurora-realtime-engine = { path = "../aurora-realtime-engine", optional = true }\n'
          dep = 'aurora-runtime-materialization = { path = "../aurora-runtime-materialization", optional = true }\n'
          if dep not in text:
              text = text.replace(anchor, anchor + dep, 1)
          cli_cargo.write_text(text)
          main = Path('crates/aurora-cli/src/main.rs')
          text = main.read_text()
          text = text.replace('    identify_roles, ProcessStatus, RealTimeEngine, RealTimeEngineConfig, RealTimeFault,\n    RealTimeMetrics, TestSignal,\n', '    identify_roles, ProcessStatus, RealTimeEngineConfig, RealTimeFault, RealTimeMetrics,\n    TestSignal,\n', 1)
          marker = 'use aurora_scene::{load_render_scene, RenderScene};\n'
          imp = '#[cfg(feature = "realtime")]\nuse aurora_runtime_materialization::materialize_default_realtime_engine;\n'
          if imp not in text:
              text = text.replace(marker, imp + marker, 1)
          text = text.replace('    let mut engine =\n        RealTimeEngine::new(scene, engine_config, block_size).context("create real-time engine")?;\n', '    let mut engine = materialize_default_realtime_engine(scene, engine_config, block_size)\n        .context("create real-time engine")?;\n', 1)
          main.write_text(text)
          commands = Path('crates/aurora-cli/src/realtime_commands.rs')
          text = commands.read_text()
          text = text.replace('    ProcessStatus, RealTimeEngine, RealTimeEngineConfig, RubatoAsrc, TestSignal,\n', '    ProcessStatus, RealTimeEngineConfig, RubatoAsrc, TestSignal,\n', 1)
          marker = 'use aurora_scene::{RenderScene, SceneObject, Trajectory};\n'
          imp = 'use aurora_runtime_materialization::materialize_default_realtime_engine;\n'
          if imp not in text:
              text = text.replace(marker, imp + marker, 1)
          text = text.replace('    let mut engine = RealTimeEngine::new(\n', '    let mut engine = materialize_default_realtime_engine(\n', 1)
          commands.write_text(text)

          # Accelerated simulation also exercises the production materializer.
          sim_cargo = Path('crates/aurora-realtime-audio-sim/Cargo.toml')
          text = sim_cargo.read_text()
          anchor = 'aurora-realtime-engine = { path = "../aurora-realtime-engine" }\n'
          dep = 'aurora-runtime-materialization = { path = "../aurora-runtime-materialization" }\n'
          if dep not in text:
              text = text.replace(anchor, anchor + dep, 1)
          sim_cargo.write_text(text)
          sim = Path('crates/aurora-realtime-audio-sim/src/simulation.rs')
          text = sim.read_text()
          text = text.replace('    DuplexStateMachine, ProcessStatus, RealTimeEngine, RealTimeEngineConfig, RubatoAsrc,\n    TestSignal,\n', '    DuplexStateMachine, ProcessStatus, RealTimeEngineConfig, RubatoAsrc, TestSignal,\n', 1)
          marker = 'use aurora_scene::{RenderScene, SceneObject, Trajectory};\n'
          imp = 'use aurora_runtime_materialization::materialize_default_realtime_engine;\n'
          if imp not in text:
              text = text.replace(marker, imp + marker, 1)
          text = text.replace('    let mut engine = RealTimeEngine::new(\n', '    let mut engine = materialize_default_realtime_engine(\n', 1)
          sim.write_text(text)

          arch = Path('docs/architecture.md')
          text = arch.read_text()
          paragraph = '\n`aurora-runtime-materialization` is the control-thread component factory layer. It converts passive runtime intent into prepared concrete components and injects them through Aurora-owned contracts. `aurora-realtime-engine` no longer owns the default delay implementation factory; the current basic delay implementation is selected outside the callback engine and validated before activation.\n'
          if 'aurora-runtime-materialization` is the control-thread component factory layer' not in text:
              anchor = '### 5. Realtime engine\n'
              text = text.replace(anchor, paragraph + '\n' + anchor, 1)
              arch.write_text(text)
      - uses: dtolnay/rust-toolchain@1.78.0
        with:
          components: rustfmt
      - name: Install Linux audio build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Format and refresh lockfile
        run: cargo fmt --all && cargo check -p aurora-runtime-materialization -p aurora-realtime-engine -p aurora-realtime-acceptance -p aurora-realtime-audio-sim -p aurora-cli --all-targets
      - name: Commit generated clean slice
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock crates/aurora-realtime-engine crates/aurora-runtime-materialization crates/aurora-realtime-acceptance crates/aurora-realtime-audio-sim crates/aurora-cli docs/architecture.md
          git commit -m "Move default realtime DSP factory to runtime materialization [materialization-rebase-bot]"
          git push origin HEAD:refactor/runtime-materialize-delay-v1
      - name: Enforce decoupling
        shell: bash
        run: |
          ! sed -n '/\[dependencies\]/,/\[dev-dependencies\]/p' crates/aurora-realtime-engine/Cargo.toml | grep -q 'aurora-dsp-basic'
          ! grep -q '^use aurora_dsp_basic' crates/aurora-realtime-engine/src/lib.rs
          if grep -R --line-number --include='*.rs' 'RealTimeEngine::new(' crates; then
            echo 'legacy default constructor callers remain' >&2
            exit 1
          fi
          grep -q 'new_with_prepared_delay_processor' crates/aurora-runtime-materialization/src/lib.rs
      - name: MSRV workspace check
        run: cargo check --workspace --all-targets --all-features --locked
      - name: Test changed runtime surfaces
        run: cargo test -p aurora-realtime-engine -p aurora-runtime-materialization -p aurora-realtime-acceptance -p aurora-realtime-audio-sim -p aurora-cli --locked
