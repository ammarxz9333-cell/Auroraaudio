name: Plugin host registry lock refresh

on:
  push:
    branches:
      - feature/plugin-host-registry-v1

permissions:
  contents: write

jobs:
  validate-and-refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/plugin-host-registry-v1
      - uses: dtolnay/rust-toolchain@1.78.0
        with:
          components: rustfmt, clippy
      - name: Format and validate plugin host registry
        run: |
          cargo fmt --all
          cargo check -p aurora-plugin-host
          cargo test -p aurora-plugin-host
          cargo clippy -p aurora-plugin-host --all-targets -- -D warnings
      - name: Commit generated formatting and lockfile refresh when required
        run: |
          if git diff --quiet -- Cargo.lock crates/aurora-plugin-host/src/lib.rs; then
            echo "Generated files already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/aurora-plugin-host/src/lib.rs
          git commit -m "Format plugin host registry and refresh lockfile"
          git push origin HEAD:feature/plugin-host-registry-v1
