name: Temporary health report contract edit

on:
  push:
    branches:
      - refactor/realtime-health-report-contract

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/realtime-health-report-contract
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install Linux audio build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libasound2-dev
      - name: Centralize report API and CLI serialization
        shell: python
        run: |
          from pathlib import Path

          lib = Path('crates/aurora-realtime-acceptance/src/lib.rs')
          text = lib.read_text()
          marker = 'use aurora_realtime_engine::{RealTimeFault, RealTimeMetrics};\n'
          insertion = '''mod report;\n\npub use report::{\n    RealTimeHealthMetricsV1, RealTimeHealthPolicyV1, RealTimeHealthReportV1,\n    REALTIME_HEALTH_REPORT_SCHEMA_VERSION,\n};\n\n'''
          if insertion not in text:
              if marker not in text:
                  raise SystemExit('acceptance import marker not found')
              text = text.replace(marker, insertion + marker, 1)
          lib.write_text(text)

          main = Path('crates/aurora-cli/src/main.rs')
          text = main.read_text()
          old_import = 'use aurora_realtime_acceptance::{evaluate_realtime_acceptance, RealTimeAcceptancePolicy};'
          new_import = '''use aurora_realtime_acceptance::{\n    evaluate_realtime_acceptance, RealTimeAcceptancePolicy, RealTimeHealthReportV1,\n};'''
          if old_import in text:
              text = text.replace(old_import, new_import, 1)
          elif 'RealTimeHealthReportV1' not in text:
              raise SystemExit('CLI acceptance import marker not found')

          start_marker = '#[cfg(feature = "realtime")]\nfn write_realtime_health_report('
          end_marker = '#[cfg(feature = "realtime")]\n#[allow(clippy::too_many_arguments)]\nfn run_duplex_command'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('CLI health report helper boundaries not found')
          replacement = '''#[cfg(feature = "realtime")]\nfn write_realtime_health_report(\n    path: &Path,\n    metrics: &RealTimeMetrics,\n    policy: RealTimeAcceptancePolicy,\n    health: &aurora_realtime_acceptance::RealTimeAcceptanceReport,\n) -> Result<()> {\n    if let Some(parent) = path\n        .parent()\n        .filter(|parent| !parent.as_os_str().is_empty())\n    {\n        std::fs::create_dir_all(parent)?;\n    }\n    let document = RealTimeHealthReportV1::from_evaluation(metrics, policy, health);\n    std::fs::write(path, document.to_pretty_json()?)?;\n    Ok(())\n}\n\n'''
          text = text[:start] + replacement + text[end:]
          main.write_text(text)
      - name: Format
        run: cargo fmt --all
      - name: Check acceptance and CLI
        run: cargo check -p aurora-realtime-acceptance -p aurora-cli --all-features
      - name: Test acceptance and CLI
        run: cargo test -p aurora-realtime-acceptance -p aurora-cli --all-features
      - name: Commit generated edit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-health-report-contract-edit.yml
          git add crates/aurora-realtime-acceptance/src/lib.rs crates/aurora-realtime-acceptance/src/report.rs crates/aurora-realtime-acceptance/Cargo.toml crates/aurora-cli/src/main.rs Cargo.lock
          git commit -m "refactor: centralize realtime health report contract"
          git push origin HEAD:refactor/realtime-health-report-contract
