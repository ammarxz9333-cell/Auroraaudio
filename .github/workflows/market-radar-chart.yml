name: Market Radar Auto Chart
on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    paths:
      - "market-radar/chart-app/**"
      - ".github/workflows/market-radar-chart.yml"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: market-radar-chart
  cancel-in-progress: false
jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && github.event.repository.default_branch || github.ref_name }}
      - name: Validate fetcher
        run: python3 -m py_compile market-radar/chart-app/fetch_data.py
      - name: Fetch genuine candles
        run: python3 market-radar/chart-app/fetch_data.py
      - name: Save snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-radar/chart-app/data/
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh genuine OHLC chart snapshots [skip ci]"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: market-radar/chart-app
      - uses: actions/deploy-pages@v4
