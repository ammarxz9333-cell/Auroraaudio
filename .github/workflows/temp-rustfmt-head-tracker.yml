name: Temporary Rustfmt Head Tracker

on:
  push:
    branches:
      - head-tracker-delivery-sim-v1
    paths:
      - 'crates/**/*.rs'
      - '.github/workflows/temp-rustfmt-head-tracker.yml'

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: head-tracker-delivery-sim-v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply canonical rustfmt
        run: cargo fmt --all
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No rustfmt changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "Apply canonical rustfmt"
          git push origin HEAD:head-tracker-delivery-sim-v1
