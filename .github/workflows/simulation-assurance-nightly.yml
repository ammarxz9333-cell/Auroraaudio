name: Simulation Assurance Weekly

on:
  schedule:
    - cron: "17 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: simulation-assurance-weekly
  cancel-in-progress: true

jobs:
  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-assurance-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-assurance-
            ${{ runner.os }}-cargo-
      - name: Run deterministic 10,000-scenario weekly campaign
        run: >-
          cargo run --release -p aurora-simulation-assurance --
          --level standard --scenarios 10000 --start-seed 0
          --report output/simulation-assurance/weekly.json
      - name: Upload bounded weekly report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-assurance-weekly
          path: output/simulation-assurance/**/*.json
          if-no-files-found: error
          retention-days: 14
