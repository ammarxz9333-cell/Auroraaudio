name: Simulation Assurance Nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: simulation-assurance-nightly
  cancel-in-progress: false

jobs:
  campaign:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-assurance-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-assurance-
            ${{ runner.os }}-cargo-
      - name: Run deterministic 10,000-scenario shard
        run: >-
          cargo run --release -p aurora-simulation-assurance --
          --level standard --scenarios 10000 --start-seed 0
          --shard-index ${{ matrix.shard }} --shard-count 4
          --report output/simulation-assurance/nightly-${{ matrix.shard }}.json
      - name: Upload bounded nightly report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-assurance-nightly-${{ matrix.shard }}
          path: output/simulation-assurance/**/*.json
          if-no-files-found: error

