name: IAMF Tools Reference CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "config/external-components-v1.json"
      - "config/iamf-tools-reference-v1.json"
      - "config/iamf-differential-v1.json"
      - "docs/iamf-tools-reference.md"
      - "validation/open-immersive/iamf_cross_reference_evidence.py"
      - "THIRD_PARTY_LICENSES.md"
      - ".github/workflows/iamf-tools-reference-ci.yml"

permissions:
  contents: read

concurrency:
  group: iamf-tools-reference-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iamf-tools-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      IAMF_TOOLS_COMMIT: c6b11b5ea47d7da00fbac9654acc96aa4ced2388
      BAZELISK_VERSION: 1.27.0
      FIXTURE_REL: iamf/cli/testdata/iamf/tones_256samp_5p1_pcm.iamf
    steps:
      - name: Checkout Aurora
        uses: actions/checkout@v4

      - name: Checkout pinned iamf-tools
        uses: actions/checkout@v4
        with:
          repository: AOMediaCodec/iamf-tools
          ref: c6b11b5ea47d7da00fbac9654acc96aa4ced2388
          path: iamf-tools
          fetch-depth: 1

      - name: Verify immutable pins and Aurora registry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C iamf-tools rev-parse HEAD)" = "$IAMF_TOOLS_COMMIT"
          python3 scripts/check_external_components.py
          python3 - <<'PY'
          import json
          registry = json.load(open('config/external-components-v1.json', encoding='utf-8'))
          ref = json.load(open('config/iamf-tools-reference-v1.json', encoding='utf-8'))
          diff = json.load(open('config/iamf-differential-v1.json', encoding='utf-8'))
          libref = json.load(open('config/iamf-reference-v1.json', encoding='utf-8'))
          oar = json.load(open('config/oar-evaluation-v1.json', encoding='utf-8'))
          component = next(c for c in registry['components'] if c['id'] == 'aomedia-iamf-tools')
          assert component['pinned_commit'] == ref['pinned_commit'] == 'c6b11b5ea47d7da00fbac9654acc96aa4ced2388'
          assert diff['pins']['iamf_tools'] == ref['pinned_commit']
          assert diff['pins']['libiamf'] == libref['libiamf']['commit']
          assert diff['pins']['libiamf_embedded_oar'] == libref['libiamf']['oar_submodule_commit']
          assert diff['pins']['standalone_oar_semantic_reference'] == oar['reference']['commit']
          assert ref['upstream_bazel_version'] == '8.5.1'
          assert ref['bazelisk_version'] == '1.27.0'
          print('IAMF-REFERENCE-PINS-PASS')
          PY

      - name: Install reference build tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes ffmpeg cmake ninja-build git curl
          go install "github.com/bazelbuild/bazelisk@v${BAZELISK_VERSION}"
          "$(go env GOPATH)/bin/bazelisk" version

      - name: Self-test cross-reference evidence analyzer
        run: python3 validation/open-immersive/iamf_cross_reference_evidence.py self-test

      - name: Build pinned encoder decoder and probe
        working-directory: iamf-tools
        shell: bash
        run: |
          set -euo pipefail
          BAZELISK="$(go env GOPATH)/bin/bazelisk"
          "$BAZELISK" build -c opt \
            //iamf/cli:encoder_main \
            //iamf/cli:decoder_main \
            //iamf/cli:probe_main
          test -x bazel-bin/iamf/cli/encoder_main
          test -x bazel-bin/iamf/cli/decoder_main
          test -x bazel-bin/iamf/cli/probe_main
          echo "IAMF-TOOLS-BUILD-PASS"

      - name: Probe and decode pinned IAMF baseline fixture
        working-directory: iamf-tools
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="${GITHUB_WORKSPACE}/output/iamf-tools-reference"
          FIXTURE="${GITHUB_WORKSPACE}/iamf-tools/${FIXTURE_REL}"
          mkdir -p "${OUT_DIR}"
          test -d "${OUT_DIR}"
          test -s "${FIXTURE}"
          bazel-bin/iamf/cli/probe_main \
            --input_filename="${FIXTURE}" \
            --format=json \
            --scan=counts \
            > "${OUT_DIR}/probe.json"
          python3 -m json.tool "${OUT_DIR}/probe.json" >/dev/null
          bazel-bin/iamf/cli/decoder_main \
            --input_filename="${FIXTURE}" \
            --output_filename="${OUT_DIR}/decoded-stereo.wav" \
            --output_layout=2.0
          test -s "${OUT_DIR}/decoded-stereo.wav"
          echo "IAMF-TOOLS-DECODE-PASS"

      - name: Validate finite decoded PCM and emit baseline evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT="${GITHUB_WORKSPACE}/output/iamf-tools-reference"
          FIXTURE="${GITHUB_WORKSPACE}/iamf-tools/${FIXTURE_REL}"
          ffprobe -v error -select_streams a:0 \
            -show_entries stream=sample_rate,channels,duration \
            -of json "$OUT/decoded-stereo.wav" > "$OUT/decoded-ffprobe.json"
          ffmpeg -v error -y -i "$OUT/decoded-stereo.wav" \
            -f f32le -acodec pcm_f32le "$OUT/decoded.f32"
          python3 - "$FIXTURE" "$OUT" "$IAMF_TOOLS_COMMIT" <<'PY'
          import hashlib, json, math, pathlib, struct, sys
          fixture = pathlib.Path(sys.argv[1])
          out = pathlib.Path(sys.argv[2])
          commit = sys.argv[3]
          probe = json.loads((out / 'probe.json').read_text(encoding='utf-8'))
          ffprobe = json.loads((out / 'decoded-ffprobe.json').read_text(encoding='utf-8'))
          raw = (out / 'decoded.f32').read_bytes()
          if not isinstance(probe, dict) or not probe:
              raise SystemExit('probe JSON is empty or not an object')
          if not raw or len(raw) % 4:
              raise SystemExit('decoded float PCM is empty or misaligned')
          samples = struct.unpack('<' + 'f' * (len(raw) // 4), raw)
          if not all(math.isfinite(x) for x in samples):
              raise SystemExit('decoded PCM contains non-finite samples')
          if not any(abs(x) > 1e-8 for x in samples):
              raise SystemExit('decoded PCM is silent')
          streams = ffprobe.get('streams') or []
          if not streams:
              raise SystemExit('ffprobe reported no audio stream')
          stream = streams[0]
          if int(stream.get('sample_rate', 0)) <= 0 or int(stream.get('channels', 0)) <= 0:
              raise SystemExit(f'invalid decoded stream metadata: {stream}')
          evidence = {
              'schema_version': 1,
              'iamf_tools_commit': commit,
              'fixture': str(fixture),
              'fixture_sha256': hashlib.sha256(fixture.read_bytes()).hexdigest(),
              'decoded_wav_sha256': hashlib.sha256((out / 'decoded-stereo.wav').read_bytes()).hexdigest(),
              'sample_rate': int(stream['sample_rate']),
              'channels': int(stream['channels']),
              'float_sample_count': len(samples),
              'finite_pcm': True,
              'non_silent_pcm': True,
              'probe_json_valid': True,
              'truth_boundary': 'Exact-pin external iamf-tools baseline only: build, descriptor/temporal probe, and rendered stereo PCM decode. No Aurora runtime IAMF object-scene support, renderer equivalence, exhaustive conformance, patent clearance beyond upstream terms, or certification is claimed.'
          }
          (out / 'summary.json').write_text(json.dumps(evidence, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(evidence, indent=2, sort_keys=True))
          PY
          echo "IAMF-TOOLS-REFERENCE-PASS"

      - name: Fetch and build exact pinned libiamf reference
        shell: bash
        run: |
          set -euo pipefail
          LIBIAMF_COMMIT="$(python3 -c 'import json; print(json.load(open("config/iamf-differential-v1.json"))["pins"]["libiamf"])')"
          OAR_COMMIT="$(python3 -c 'import json; print(json.load(open("config/iamf-differential-v1.json"))["pins"]["libiamf_embedded_oar"])')"
          LIBIAMF="${RUNNER_TEMP}/libiamf"
          mkdir -p "${LIBIAMF}"
          git -C "${LIBIAMF}" init
          git -C "${LIBIAMF}" remote add origin https://github.com/AOMediaCodec/libiamf.git
          git -C "${LIBIAMF}" sparse-checkout init --cone
          git -C "${LIBIAMF}" sparse-checkout set code .gitmodules LICENSE PATENTS
          git -C "${LIBIAMF}" fetch --depth=1 --filter=blob:none origin "${LIBIAMF_COMMIT}"
          git -C "${LIBIAMF}" checkout --detach FETCH_HEAD
          test "$(git -C "${LIBIAMF}" rev-parse HEAD)" = "${LIBIAMF_COMMIT}"
          git -C "${LIBIAMF}" submodule update --init --recursive --depth 1 code/dep_external/src/oar
          test "$(git -C "${LIBIAMF}/code/dep_external/src/oar" rev-parse HEAD)" = "${OAR_COMMIT}"
          cmake -S "${LIBIAMF}/code" -B "${RUNNER_TEMP}/libiamf-build" -G Ninja \
            -DIAMF_TEST_TOOL=ON \
            -DIAMF_ENABLE_BINAURALIZER=OFF
          cmake --build "${RUNNER_TEMP}/libiamf-build" --target iamfdec --parallel 2
          IAMFDEC="$(find "${RUNNER_TEMP}/libiamf-build" -type f -name iamfdec -perm -111 -print -quit)"
          test -n "${IAMFDEC}"
          printf '%s\n' "IAMFDEC=${IAMFDEC}" >> "${GITHUB_ENV}"
          echo "LIBIAMF-REFERENCE-BUILD-PASS"

      - name: Cross-check one shared IAMF fixture through iamf-tools and libiamf
        shell: bash
        run: |
          set -euo pipefail
          OUT="${GITHUB_WORKSPACE}/output/iamf-tools-reference"
          DIFF_REL="$(python3 -c 'import json; print(json.load(open("config/iamf-differential-v1.json"))["fixture"]["path"])')"
          DIFF_FIXTURE="${GITHUB_WORKSPACE}/iamf-tools/${DIFF_REL}"
          mkdir -p "${OUT}"
          test -s "${DIFF_FIXTURE}"

          "${GITHUB_WORKSPACE}/iamf-tools/bazel-bin/iamf/cli/probe_main" \
            --input_filename="${DIFF_FIXTURE}" \
            --format=json \
            --scan=counts \
            > "${OUT}/differential-probe.json"
          python3 -m json.tool "${OUT}/differential-probe.json" >/dev/null

          "${GITHUB_WORKSPACE}/iamf-tools/bazel-bin/iamf/cli/decoder_main" \
            --input_filename="${DIFF_FIXTURE}" \
            --output_filename="${OUT}/differential-iamf-tools.wav" \
            --output_layout=2.0
          "${IAMFDEC}" -o3 "${OUT}/differential-libiamf.wav" -s0 -r 48000 -d 32 "${DIFF_FIXTURE}"
          test -s "${OUT}/differential-iamf-tools.wav"
          test -s "${OUT}/differential-libiamf.wav"

          for NAME in iamf-tools libiamf; do
            ffprobe -v error -select_streams a:0 \
              -show_entries stream=sample_rate,channels,duration \
              -of json "${OUT}/differential-${NAME}.wav" > "${OUT}/differential-${NAME}-ffprobe.json"
            ffmpeg -v error -y -i "${OUT}/differential-${NAME}.wav" \
              -f f32le -acodec pcm_f32le "${OUT}/differential-${NAME}.f32"
          done

          python3 - "${OUT}" <<'PY'
          import json, pathlib, sys
          out = pathlib.Path(sys.argv[1])
          for name in ('iamf-tools', 'libiamf'):
              data = json.loads((out / f'differential-{name}-ffprobe.json').read_text(encoding='utf-8'))
              streams = data.get('streams') or []
              if not streams:
                  raise SystemExit(f'{name}: no decoded audio stream')
              stream = streams[0]
              if int(stream.get('sample_rate', 0)) != 48000 or int(stream.get('channels', 0)) != 2:
                  raise SystemExit(f'{name}: expected stereo 48 kHz, got {stream}')
          PY

          python3 validation/open-immersive/iamf_cross_reference_evidence.py compare \
            "${OUT}/differential-iamf-tools.f32" \
            "${OUT}/differential-libiamf.f32" \
            config/iamf-differential-v1.json \
            "${OUT}/differential-summary.json" \
            --sample-rate 48000 \
            --channels 2
          echo "IAMF-CROSS-REFERENCE-PASS"

      - name: Upload IAMF tools reference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iamf-tools-reference-${{ github.sha }}
          path: output/iamf-tools-reference/*.json
          if-no-files-found: error
          retention-days: 14
