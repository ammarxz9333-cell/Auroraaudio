name: Temporary apply renderer boundary

on:
  push:
    branches:
      - refactor/runtime-materialize-renderer-v1

permissions:
  contents: write

jobs:
  refactor:
    if: "!contains(github.event.head_commit.message, '[renderer-boundary-bot]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/runtime-materialize-renderer-v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux audio build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Apply renderer materialization boundary
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          def rewrite(path, fn):
              p = Path(path)
              text = p.read_text()
              new = fn(text)
              if new == text:
                  raise SystemExit(f"{path}: rewrite made no changes")
              p.write_text(new)

          # Renderer API: advertise whether renderer-emitted delay values are part of the realtime contract.
          replace_once(
              'crates/aurora-renderer-api/src/lib.rs',
              '/// Replaceable renderer abstraction used by offline and real-time pipelines.\npub trait Renderer {\n',
              '''/// Setup-time capabilities of a configured renderer.\n#[derive(Debug, Clone, Copy, PartialEq, Eq, Default)]\npub struct RendererCapabilities {\n    dynamic_delay_values: bool,\n}\n\nimpl RendererCapabilities {\n    /// Creates renderer capabilities.\n    pub const fn new(dynamic_delay_values: bool) -> Self {\n        Self {\n            dynamic_delay_values,\n        }\n    }\n\n    /// Returns whether per-speaker delay values emitted by `render_gains` must be applied dynamically.\n    pub const fn dynamic_delay_values(self) -> bool {\n        self.dynamic_delay_values\n    }\n}\n\n/// Replaceable renderer abstraction used by offline and real-time pipelines.\npub trait Renderer {\n    /// Reports configured renderer capabilities used by realtime materialization.\n    fn capabilities(&self) -> RendererCapabilities {\n        RendererCapabilities::default()\n    }\n\n'''
          )

          # Basic renderer marks geometric binaural delay values as dynamically required.
          replace_once(
              'crates/aurora-renderer-basic/src/lib.rs',
              '    RenderObject, Renderer, RendererError, RendererScratch, RendererScratchSize, SpeakerGain,\n',
              '    RenderObject, Renderer, RendererCapabilities, RendererError, RendererScratch,\n    RendererScratchSize, SpeakerGain,\n'
          )
          replace_once(
              'crates/aurora-renderer-basic/src/lib.rs',
              'impl Renderer for BasicRenderer {\n    fn configure(\n',
              '''impl Renderer for BasicRenderer {\n    fn capabilities(&self) -> RendererCapabilities {\n        RendererCapabilities::new(self.mode == BasicRendererMode::GeometricBinaural)\n    }\n\n    fn configure(\n'''
          )

          # realtime-engine production dependency becomes renderer-contract only; concrete basic renderer is dev-only.
          replace_once(
              'crates/aurora-realtime-engine/Cargo.toml',
              'aurora-renderer-basic = { path = "../aurora-renderer-basic" }\n',
              ''
          )
          replace_once(
              'crates/aurora-realtime-engine/Cargo.toml',
              '[dev-dependencies]\naurora-dsp-basic = { path = "../aurora-dsp-basic" }\n',
              '[dev-dependencies]\naurora-dsp-basic = { path = "../aurora-dsp-basic" }\naurora-renderer-basic = { path = "../aurora-renderer-basic" }\n'
          )

          # Core realtime engine: caller supplies both prepared renderer and prepared delay processor.
          def rewrite_engine(text):
              text = text.replace('pub use aurora_renderer_basic::BasicRendererMode;\n', '')
              text = text.replace(
                  'use aurora_core::{ChannelRole, StandardLayout, Vector3};',
                  'use aurora_core::{ChannelRole, Speaker, StandardLayout, Vector3};'
              )
              text = text.replace(
                  'use aurora_renderer_api::{RenderObject, Renderer, RendererError, RendererScratch, SpeakerGain};',
                  'use aurora_renderer_api::{\n    RenderObject, Renderer, RendererCapabilities, RendererError, RendererScratch, SpeakerGain,\n};'
              )
              text = text.replace('use aurora_renderer_basic::{calculate_geometric_delays, BasicRenderer};\n', '')
              text = text.replace(
                  '    /// Renderer mode to use.\n    pub renderer_mode: BasicRendererMode,\n',
                  ''
              )
              text = text.replace('#[derive(Debug)]\npub struct RealTimeEngine {', 'pub struct RealTimeEngine {')
              text = text.replace(
                  '    renderer: BasicRenderer,\n',
                  '    renderer: Box<dyn Renderer>,\n    renderer_dynamic_delay_values: bool,\n'
              )

              marker = '/// Setup-time validation errors for a caller-supplied realtime delay processor.\n'
              if marker not in text:
                  raise SystemExit('engine: prepared DSP marker missing')
              prepared_renderer = '''/// Setup-time validation errors for a caller-supplied renderer.\n#[derive(Debug, Error, PartialEq)]\npub enum PreparedRendererError {\n    /// Prepared renderer output channel count does not match the scene topology.\n    #[error("prepared renderer has {actual} output channels, expected {expected}")]\n    ChannelCount { expected: usize, actual: usize },\n    /// Prepared renderer did not expose a valid configured scratch requirement.\n    #[error("prepared renderer contract error: {0}")]\n    Contract(#[source] RendererError),\n}\n\n'''
              text = text.replace(marker, prepared_renderer + marker, 1)
              text = text.replace(
                  '    /// Caller-supplied realtime DSP failed setup validation.\n    #[error("prepared realtime DSP setup error: {0}")]\n    PreparedDsp(#[from] PreparedDspError),\n',
                  '    /// Caller-supplied renderer failed setup validation.\n    #[error("prepared renderer setup error: {0}")]\n    PreparedRenderer(#[from] PreparedRendererError),\n    /// Caller-supplied realtime DSP failed setup validation.\n    #[error("prepared realtime DSP setup error: {0}")]\n    PreparedDsp(#[from] PreparedDspError),\n'
              )

              setup_start = text.index('    /// Returns the delay capabilities required for this scene and configuration.')
              setup_end = text.index('    /// Returns output channel roles.')
              setup = r'''    /// Returns the delay capabilities required for this scene, configuration, and renderer.\n    ///\n    /// Materializers call this on the control thread after preparing a renderer and before\n    /// constructing a concrete DSP.\n    pub fn delay_requirements(\n        scene: &RenderScene,\n        config: &RealTimeEngineConfig,\n        renderer_capabilities: RendererCapabilities,\n    ) -> Result<RealtimeDelayRequirements, RealTimeEngineError> {\n        validate_scene_config(scene, config)?;\n        let ordered_speakers = scene.ordered_speakers()?;\n        let geometric = calculate_geometric_delays(\n            &ordered_speakers,\n            scene.listener,\n            config.sample_rate,\n            config.speed_of_sound,\n        );\n        let delays = if config.apply_geometric_delay {\n            geometric\n                .iter()\n                .map(|delay| delay.delay_samples)\n                .collect::<Vec<_>>()\n        } else {\n            vec![0.0; ordered_speakers.len()]\n        };\n        let mut max_delay_samples =\n            delays.iter().copied().fold(0.0_f32, f32::max).ceil() + 2.0;\n        if config.apply_geometric_delay || renderer_capabilities.dynamic_delay_values() {\n            max_delay_samples = max_delay_samples.max(CURRENT_DYNAMIC_DELAY_CAPACITY_SAMPLES);\n        }\n        Ok(RealtimeDelayRequirements {\n            channel_count: ordered_speakers.len(),\n            max_delay_samples,\n        })\n    }\n\n    /// Creates a real-time engine from caller-supplied prepared renderer and DSP components.\n    ///\n    /// Both components are validated on the setup thread before activation. No active engine\n    /// is mutated if renderer or DSP validation fails.\n    pub fn new_with_prepared_components(\n        scene: RenderScene,\n        config: RealTimeEngineConfig,\n        estimated_device_latency_frames: usize,\n        renderer: Box<dyn Renderer>,\n        delay_processor: Box<dyn RealtimeDelayProcessor>,\n    ) -> Result<Self, RealTimeEngineError> {\n        Self::build(\n            scene,\n            config,\n            estimated_device_latency_frames,\n            renderer,\n            delay_processor,\n        )\n    }\n\n    fn build(\n        scene: RenderScene,\n        config: RealTimeEngineConfig,\n        estimated_device_latency_frames: usize,\n        renderer: Box<dyn Renderer>,\n        mut delay_processor: Box<dyn RealtimeDelayProcessor>,\n    ) -> Result<Self, RealTimeEngineError> {\n        validate_scene_config(&scene, &config)?;\n        let ordered_speakers = scene.ordered_speakers()?;\n        let channel_count = ordered_speakers.len();\n        let output_roles = ordered_speakers\n            .iter()\n            .map(|speaker| speaker.channel_role.clone())\n            .collect::<Vec<_>>();\n\n        let actual_renderer_channels = renderer.output_channel_count();\n        if actual_renderer_channels != channel_count {\n            return Err(PreparedRendererError::ChannelCount {\n                expected: channel_count,\n                actual: actual_renderer_channels,\n            }\n            .into());\n        }\n        let renderer_capabilities = renderer.capabilities();\n        let renderer_scratch_size = renderer\n            .required_scratch_size()\n            .map_err(PreparedRendererError::Contract)?;\n        let renderer_scratch = RendererScratch::new(renderer_scratch_size);\n\n        let geometric = calculate_geometric_delays(\n            &ordered_speakers,\n            scene.listener,\n            config.sample_rate,\n            config.speed_of_sound,\n        );\n        let delay_reports = geometric\n            .iter()\n            .enumerate()\n            .map(|(output_index, delay)| RealTimeDelayReport {\n                output_index,\n                channel_role: delay.channel_role.clone(),\n                distance_meters: delay.distance_meters,\n                delay_milliseconds: delay.delay_milliseconds,\n                delay_samples: delay.delay_samples,\n            })\n            .collect::<Vec<_>>();\n        let delays = if config.apply_geometric_delay {\n            geometric\n                .iter()\n                .map(|delay| delay.delay_samples)\n                .collect::<Vec<_>>()\n        } else {\n            vec![0.0; channel_count]\n        };\n        let mut max_delay = delays.iter().copied().fold(0.0_f32, f32::max).ceil() + 2.0;\n        if config.apply_geometric_delay || renderer_capabilities.dynamic_delay_values() {\n            max_delay = max_delay.max(CURRENT_DYNAMIC_DELAY_CAPACITY_SAMPLES);\n        }\n        let actual_channels = delay_processor.channel_count();\n        if actual_channels != channel_count {\n            return Err(PreparedDspError::ChannelCount {\n                expected: channel_count,\n                actual: actual_channels,\n            }\n            .into());\n        }\n        let actual_capacity = delay_processor.max_delay_samples();\n        if !actual_capacity.is_finite() || actual_capacity < max_delay {\n            return Err(PreparedDspError::DelayCapacity {\n                required: max_delay,\n                actual: actual_capacity,\n            }\n            .into());\n        }\n        delay_processor\n            .set_delays(&delays)\n            .map_err(PreparedDspError::from_initial_fault)?;\n        let dsp_latency_frames = delay_processor.latency_frames();\n        let renderer_latency_frames = renderer.latency_frames();\n        let block_duration_budget =\n            Duration::from_secs_f64(config.block_size as f64 / f64::from(config.sample_rate));\n        let metrics = RealTimeMetrics {\n            renderer_latency_frames,\n            dsp_latency_frames,\n            estimated_device_latency_frames,\n            estimated_end_to_end_latency_frames: renderer_latency_frames\n                + dsp_latency_frames\n                + estimated_device_latency_frames,\n            block_duration_budget,\n            ..RealTimeMetrics::default()\n        };\n        Ok(Self {\n            mono: vec![0.0; config.block_size],\n            planar: vec![vec![0.0; config.block_size]; channel_count],\n            delayed: vec![vec![0.0; config.block_size]; channel_count],\n            gains: vec![SpeakerGain::default(); channel_count],\n            delays_scratch: vec![0.0; channel_count],\n            renderer_scratch,\n            delay_processor,\n            output_roles,\n            renderer,\n            renderer_dynamic_delay_values: renderer_capabilities.dynamic_delay_values(),\n            listener: scene.listener,\n            trajectory: scene.trajectory,\n            object_gain: db_to_gain(scene.object.gain_db),\n            config,\n            metrics,\n            frame_cursor: 0,\n            phase: 0.0,\n            noise_state: 0x1234_ABCD,\n            noise_filter_state: 0.0,\n            impulse_emitted: false,\n            delay_reports,\n        })\n    }\n\n'''.replace('\\n', '\n')
              text = text[:setup_start] + setup + text[setup_end:]
              text = text.replace(
                  '        if self.config.apply_geometric_delay\n            || self.config.renderer_mode == BasicRendererMode::GeometricBinaural\n        {',
                  '        if self.config.apply_geometric_delay || self.renderer_dynamic_delay_values {'
              )

              # Unit-test-only basic renderer remains a dev backend for behavioral equivalence.
              text = text.replace(
                  '    use aurora_core::{Listener, Speaker};\n',
                  '    use aurora_core::{Listener, Speaker};\n    use aurora_renderer_basic::{BasicRenderer, BasicRendererMode};\n'
              )
              text = text.replace(
                  '        let mut config = config(TestSignal::RotatingSine, false);\n        config.renderer_mode = BasicRendererMode::GeometricBinaural;\n        let mut engine = test_engine(scene(), config, 64).unwrap();',
                  '        let mut engine = test_engine_with_mode(\n            scene(),\n            config(TestSignal::RotatingSine, false),\n            64,\n            BasicRendererMode::GeometricBinaural,\n        )\n        .unwrap();'
              )
              text = re.sub(r'\n\s*renderer_mode: BasicRendererMode::InverseDistance,', '', text)
              helper_start = text.index('    fn test_engine(\n')
              helper_end = text.index('    fn engine(test_signal: TestSignal, apply_delay: bool) -> RealTimeEngine {')
              helper = r'''    fn test_engine(\n        scene: RenderScene,\n        config: RealTimeEngineConfig,\n        estimated_device_latency_frames: usize,\n    ) -> Result<RealTimeEngine, RealTimeEngineError> {\n        test_engine_with_mode(\n            scene,\n            config,\n            estimated_device_latency_frames,\n            BasicRendererMode::InverseDistance,\n        )\n    }\n\n    fn test_engine_with_mode(\n        scene: RenderScene,\n        config: RealTimeEngineConfig,\n        estimated_device_latency_frames: usize,\n        mode: BasicRendererMode,\n    ) -> Result<RealTimeEngine, RealTimeEngineError> {\n        let speakers = scene.ordered_speakers()?;\n        let mut renderer = BasicRenderer::new(mode).with_smoothing(0.35);\n        renderer.configure(speakers, config.sample_rate, config.block_size, 1)?;\n        let renderer_capabilities = renderer.capabilities();\n        let requirements =\n            RealTimeEngine::delay_requirements(&scene, &config, renderer_capabilities)?;\n        let delay = aurora_dsp_basic::DelayProcessor::new(\n            requirements.channel_count(),\n            requirements.max_delay_samples(),\n        );\n        RealTimeEngine::new_with_prepared_components(\n            scene,\n            config,\n            estimated_device_latency_frames,\n            Box::new(renderer),\n            Box::new(delay),\n        )\n    }\n\n'''.replace('\\n', '\n')
              text = text[:helper_start] + helper + text[helper_end:]

              # Shared validation and geometric delay calculation are renderer-independent.
              geometry_anchor = 'fn rotating_position(time_seconds: f64) -> Vector3 {\n'
              if geometry_anchor not in text:
                  raise SystemExit('engine: geometry insertion anchor missing')
              geometry = r'''#[derive(Debug, Clone, PartialEq)]\nstruct GeometricDelay {\n    channel_role: ChannelRole,\n    distance_meters: f32,\n    delay_samples: f32,\n    delay_milliseconds: f32,\n}\n\nfn validate_scene_config(\n    scene: &RenderScene,\n    config: &RealTimeEngineConfig,\n) -> Result<(), RealTimeEngineError> {\n    if config.sample_rate == 0 || config.block_size == 0 {\n        return Err(RealTimeEngineError::InvalidConfig(\n            "sample_rate and block_size must be greater than zero".to_owned(),\n        ));\n    }\n    if config.test_signal == TestSignal::None && config.input_channels == 0 {\n        return Err(RealTimeEngineError::InvalidConfig(\n            "live input requires at least one input channel".to_owned(),\n        ));\n    }\n    if scene.ordered_speakers()?.is_empty() {\n        return Err(RealTimeEngineError::InvalidConfig(\n            "scene must contain at least one output speaker".to_owned(),\n        ));\n    }\n    Ok(())\n}\n\nfn calculate_geometric_delays(\n    speakers: &[Speaker],\n    listener: aurora_core::Listener,\n    sample_rate: u32,\n    speed_of_sound_meters_per_second: f32,\n) -> Vec<GeometricDelay> {\n    let max_distance = speakers\n        .iter()\n        .filter(|speaker| speaker.enabled)\n        .map(|speaker| speaker.position.distance_to(listener.position))\n        .fold(0.0_f32, f32::max);\n    speakers\n        .iter()\n        .map(|speaker| {\n            let distance_meters = speaker.position.distance_to(listener.position);\n            let delay_seconds = if speaker.enabled && speed_of_sound_meters_per_second > 0.0 {\n                (max_distance - distance_meters).max(0.0) / speed_of_sound_meters_per_second\n            } else {\n                0.0\n            };\n            GeometricDelay {\n                channel_role: speaker.channel_role.clone(),\n                distance_meters,\n                delay_samples: delay_seconds * sample_rate as f32,\n                delay_milliseconds: delay_seconds * 1_000.0,\n            }\n        })\n        .collect()\n}\n\n'''.replace('\\n', '\n')
              text = text.replace(geometry_anchor, geometry + geometry_anchor, 1)
              return text

          rewrite('crates/aurora-realtime-engine/src/lib.rs', rewrite_engine)

          # Runtime materialization now owns concrete renderer selection as well as concrete DSP selection.
          replace_once(
              'crates/aurora-runtime-materialization/Cargo.toml',
              'aurora-realtime-engine = { path = "../aurora-realtime-engine" }\naurora-scene = { path = "../aurora-scene" }\n',
              'aurora-realtime-engine = { path = "../aurora-realtime-engine" }\naurora-renderer-api = { path = "../aurora-renderer-api" }\naurora-renderer-basic = { path = "../aurora-renderer-basic" }\naurora-renderer-vbap = { path = "../aurora-renderer-vbap" }\naurora-scene = { path = "../aurora-scene" }\n\n[dev-dependencies]\nserde_json.workspace = true\n'
          )
          Path('crates/aurora-runtime-materialization/src/lib.rs').write_text(r'''//! Control-thread materialization of concrete Aurora runtime components.\n//!\n//! `aurora-runtime-assembly` stays passive and deterministic; this crate owns\n//! concrete implementation selection and construction before callback activation.\n\n#![forbid(unsafe_code)]\n\nuse aurora_dsp_basic::DelayProcessor;\nuse aurora_realtime_engine::{RealTimeEngine, RealTimeEngineConfig, RealTimeEngineError};\nuse aurora_renderer_api::Renderer;\nuse aurora_renderer_basic::BasicRenderer;\npub use aurora_renderer_basic::BasicRendererMode;\nuse aurora_renderer_vbap::VbapRenderer;\nuse aurora_scene::RenderScene;\n\n/// Stable identity for Aurora's current default realtime delay implementation.\npub const BASIC_DELAY_IMPLEMENTATION_ID: &str = "org.aurora.dsp.basic-delay";\n/// Stable identity for Aurora's basic geometric renderer implementation.\npub const BASIC_RENDERER_IMPLEMENTATION_ID: &str = "org.aurora.renderer.basic";\n/// Stable identity for Aurora's horizontal VBAP renderer implementation.\npub const VBAP_RENDERER_IMPLEMENTATION_ID: &str = "org.aurora.renderer.vbap";\n\n/// Concrete renderer choices owned by control-thread materialization.\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub enum RealtimeRendererSelection {\n    /// Current basic geometric renderer with an explicit behavior mode.\n    Basic(BasicRendererMode),\n    /// Aurora's horizontal VBAP renderer.\n    Vbap,\n}\n\n/// Materializes Aurora's current default realtime engine on the control thread.\n///\n/// The compatibility default remains the existing inverse-distance BasicRenderer path.\npub fn materialize_default_realtime_engine(\n    scene: RenderScene,\n    config: RealTimeEngineConfig,\n    estimated_device_latency_frames: usize,\n) -> Result<RealTimeEngine, RealTimeEngineError> {\n    materialize_realtime_engine(\n        scene,\n        config,\n        RealtimeRendererSelection::Basic(BasicRendererMode::InverseDistance),\n        estimated_device_latency_frames,\n    )\n}\n\n/// Materializes a realtime engine with an explicitly selected renderer implementation.\npub fn materialize_realtime_engine(\n    scene: RenderScene,\n    config: RealTimeEngineConfig,\n    renderer_selection: RealtimeRendererSelection,\n    estimated_device_latency_frames: usize,\n) -> Result<RealTimeEngine, RealTimeEngineError> {\n    let speakers = scene.ordered_speakers()?;\n    let mut renderer: Box<dyn Renderer> = match renderer_selection {\n        RealtimeRendererSelection::Basic(mode) => {\n            Box::new(BasicRenderer::new(mode).with_smoothing(0.35))\n        }\n        RealtimeRendererSelection::Vbap => Box::new(VbapRenderer::new().with_smoothing(0.35)),\n    };\n    renderer.configure(speakers, config.sample_rate, config.block_size, 1)?;\n    let renderer_capabilities = renderer.capabilities();\n    let requirements =\n        RealTimeEngine::delay_requirements(&scene, &config, renderer_capabilities)?;\n    let delay = DelayProcessor::new(\n        requirements.channel_count(),\n        requirements.max_delay_samples(),\n    );\n    RealTimeEngine::new_with_prepared_components(\n        scene,\n        config,\n        estimated_device_latency_frames,\n        renderer,\n        Box::new(delay),\n    )\n}\n\n#[cfg(test)]\nmod tests {\n    use aurora_realtime_engine::{ProcessStatus, RealTimeEngineConfig, TestSignal};\n\n    use super::*;\n\n    fn scene() -> RenderScene {\n        serde_json::from_str(include_str!(\n            "../../../fixtures/scenes/stereo_circle.json"\n        ))\n        .expect("fixture scene")\n    }\n\n    fn config() -> RealTimeEngineConfig {\n        RealTimeEngineConfig {\n            sample_rate: 48_000,\n            block_size: 256,\n            input_channels: 0,\n            apply_geometric_delay: false,\n            speed_of_sound: 343.0,\n            test_signal: TestSignal::Sine,\n        }\n    }\n\n    #[test]\n    fn default_materialization_matches_explicit_basic_selection() {\n        let mut default_engine = materialize_default_realtime_engine(scene(), config(), 256).unwrap();\n        let mut explicit_engine = materialize_realtime_engine(\n            scene(),\n            config(),\n            RealtimeRendererSelection::Basic(BasicRendererMode::InverseDistance),\n            256,\n        )\n        .unwrap();\n        let mut default_output = vec![0.0_f32; 512];\n        let mut explicit_output = vec![0.0_f32; 512];\n        for _ in 0..8 {\n            assert_eq!(\n                default_engine.process_interleaved(None, &mut default_output),\n                ProcessStatus::Ok\n            );\n            assert_eq!(\n                explicit_engine.process_interleaved(None, &mut explicit_output),\n                ProcessStatus::Ok\n            );\n            assert_eq!(default_output, explicit_output);\n        }\n    }\n\n    #[test]\n    fn basic_and_vbap_materialize_through_the_same_engine_boundary() {\n        for selection in [\n            RealtimeRendererSelection::Basic(BasicRendererMode::InverseDistance),\n            RealtimeRendererSelection::Vbap,\n        ] {\n            let mut engine = materialize_realtime_engine(scene(), config(), selection, 256).unwrap();\n            let mut output = vec![0.0_f32; 512];\n            assert_eq!(\n                engine.process_interleaved(None, &mut output),\n                ProcessStatus::Ok\n            );\n            assert!(output.iter().all(|sample| sample.is_finite()));\n        }\n    }\n}\n'''.replace('\\n', '\n'))

          # Realtime call sites no longer carry a concrete renderer mode in engine config.
          def strip_inverse_mode(path):
              p = Path(path)
              text = p.read_text()
              text = re.sub(r'\n\s*renderer_mode: BasicRendererMode::InverseDistance,', '', text)
              p.write_text(text)

          for path in [
              'crates/aurora-realtime-acceptance/tests/engine_acceptance.rs',
              'crates/aurora-realtime-acceptance/examples/sustained_soak.rs',
              'crates/aurora-cli/src/realtime_commands.rs',
              'crates/aurora-realtime-audio-sim/src/simulation.rs',
          ]:
              strip_inverse_mode(path)

          # Remove re-export-derived BasicRendererMode imports from realtime-only callers.
          for path in [
              'crates/aurora-realtime-acceptance/tests/engine_acceptance.rs',
              'crates/aurora-realtime-acceptance/examples/sustained_soak.rs',
              'crates/aurora-cli/src/realtime_commands.rs',
              'crates/aurora-realtime-audio-sim/src/simulation.rs',
          ]:
              p = Path(path)
              text = p.read_text()
              text = text.replace('BasicRendererMode, ', '')
              p.write_text(text)

          # CLI realtime preserves the user-selected basic renderer mode via the materializer selection.
          p = Path('crates/aurora-cli/src/main.rs')
          text = p.read_text()
          text = text.replace(
              'use aurora_runtime_materialization::materialize_default_realtime_engine;',
              'use aurora_runtime_materialization::{\n    materialize_realtime_engine, RealtimeRendererSelection,\n};'
          )
          text = text.replace('        renderer_mode,\n    };\n    let mut engine = materialize_default_realtime_engine(scene, engine_config, block_size)\n', '    };\n    let mut engine = materialize_realtime_engine(\n        scene,\n        engine_config,\n        RealtimeRendererSelection::Basic(renderer_mode),\n        block_size,\n    )\n')
          p.write_text(text)

          # Prepared-delay integration tests now also prepare a renderer explicitly.
          p = Path('crates/aurora-realtime-engine/tests/prepared_delay_processor.rs')
          text = p.read_text()
          text = text.replace(
              'use aurora_realtime_engine::{\n    BasicRendererMode, PreparedDspError, ProcessStatus, RealTimeEngine, RealTimeEngineConfig,\n    RealTimeEngineError, TestSignal,\n};\n',
              'use aurora_realtime_engine::{\n    PreparedDspError, ProcessStatus, RealTimeEngine, RealTimeEngineConfig, RealTimeEngineError,\n    TestSignal,\n};\nuse aurora_renderer_api::Renderer;\nuse aurora_renderer_basic::{BasicRenderer, BasicRendererMode};\n'
          )
          text = text.replace('RealTimeEngine::new_with_prepared_delay_processor(', 'engine_with_delay(')
          text = re.sub(r'\n\s*renderer_mode: BasicRendererMode::InverseDistance,', '', text)
          insert = r'''\nfn engine_with_delay(\n    scene: RenderScene,\n    config: RealTimeEngineConfig,\n    estimated_device_latency_frames: usize,\n    delay: Box<dyn RealtimeDelayProcessor>,\n) -> Result<RealTimeEngine, RealTimeEngineError> {\n    let speakers = scene.ordered_speakers()?;\n    let mut renderer =\n        BasicRenderer::new(BasicRendererMode::InverseDistance).with_smoothing(0.35);\n    renderer.configure(speakers, config.sample_rate, config.block_size, 1)?;\n    RealTimeEngine::new_with_prepared_components(\n        scene,\n        config,\n        estimated_device_latency_frames,\n        Box::new(renderer),\n        delay,\n    )\n}\n'''.replace('\\n', '\n')
          text = text.replace('\nfn config(apply_geometric_delay: bool) -> RealTimeEngineConfig {', insert + '\nfn config(apply_geometric_delay: bool) -> RealTimeEngineConfig {', 1)
          p.write_text(text)

          # Benchmark helpers prepare the same BasicRenderer externally; benchmark behavior stays equivalent.
          p = Path('crates/aurora-realtime-engine/benches/common/mod.rs')
          text = p.read_text()
          text = text.replace(
              'use aurora_realtime_engine::{BasicRendererMode, RealTimeEngine, RealTimeEngineConfig, TestSignal};\n',
              'use aurora_realtime_engine::{RealTimeEngine, RealTimeEngineConfig, TestSignal};\nuse aurora_renderer_api::Renderer;\nuse aurora_renderer_basic::{BasicRenderer, BasicRendererMode};\n'
          )
          text = re.sub(r'\n\s*renderer_mode: BasicRendererMode::InverseDistance,', '', text)
          old = '''    let requirements = RealTimeEngine::delay_requirements(&scene, &config)\n        .expect("benchmark delay requirements must be valid");\n    let delay = aurora_dsp_basic::DelayProcessor::new(\n        requirements.channel_count(),\n        requirements.max_delay_samples(),\n    );\n    RealTimeEngine::new_with_prepared_delay_processor(scene, config, block_size, Box::new(delay))\n        .expect("benchmark scene and engine configuration must be valid")\n'''
          new = '''    let speakers = scene.ordered_speakers().expect("valid benchmark scene");\n    let mut renderer =\n        BasicRenderer::new(BasicRendererMode::InverseDistance).with_smoothing(0.35);\n    renderer\n        .configure(speakers, config.sample_rate, config.block_size, 1)\n        .expect("valid benchmark renderer");\n    let requirements = RealTimeEngine::delay_requirements(&scene, &config, renderer.capabilities())\n        .expect("benchmark delay requirements must be valid");\n    let delay = aurora_dsp_basic::DelayProcessor::new(\n        requirements.channel_count(),\n        requirements.max_delay_samples(),\n    );\n    RealTimeEngine::new_with_prepared_components(\n        scene,\n        config,\n        block_size,\n        Box::new(renderer),\n        Box::new(delay),\n    )\n    .expect("benchmark scene and engine configuration must be valid")\n'''
          if old not in text:
              raise SystemExit('benchmark helper anchor missing')
          p.write_text(text.replace(old, new, 1))

          # Update architecture truth statement.
          p = Path('docs/plugin-architecture.md')
          text = p.read_text()
          old = 'The long-term rule above is stricter than the current implementation in one known area. `aurora-realtime-engine` still constructs/imports `BasicRenderer` and `BasicRendererMode`, and its compatibility constructor still creates the basic `DelayProcessor`. However, the callback-facing delay path stores and invokes `RealtimeDelayProcessor`, and realtime-engine no longer exposes `BasicDspError` or calls the concrete `DelayProcessor` callback methods directly.'
          new = '`aurora-realtime-engine` now owns only Aurora renderer/DSP contracts and caller-supplied prepared component instances. Concrete BasicRenderer/VBAP and basic-delay selection is performed by `aurora-runtime-materialization` on the control thread; renderer and DSP capability mismatches fail before callback activation. Application/provider plugins remain outside this realtime component injection path.'
          if old not in text:
              raise SystemExit('plugin architecture truth anchor missing')
          p.write_text(text.replace(old, new, 1))

      - name: Format and verify focused workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo check --workspace --all-targets --all-features
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test -p aurora-renderer-api -p aurora-renderer-basic -p aurora-runtime-materialization -p aurora-realtime-engine -p aurora-realtime-acceptance -p aurora-realtime-audio-sim --all-features
          echo '=== production realtime-engine concrete renderer references ==='
          if grep -nE 'use aurora_renderer_basic|renderer: BasicRenderer|config\.renderer_mode|pub renderer_mode' crates/aurora-realtime-engine/src/lib.rs; then
            echo 'production renderer coupling remains' >&2
            exit 1
          fi
      - name: Commit refactor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates docs/plugin-architecture.md
          git commit -m "Decouple realtime renderer materialization [renderer-boundary-bot]"
          git push origin HEAD:refactor/runtime-materialize-renderer-v1
