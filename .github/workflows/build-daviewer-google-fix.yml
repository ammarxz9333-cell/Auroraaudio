                    _searchController.text,
                    reset: false,
                  );
                } finally {
                  if (mounted) setState(() => _loadingMore = false);
                }
                return;
              }

              final controller = _collector;
              if (controller == null) return;
              setState(() => _loadingMore = true);
              try {
                await controller.evaluateJavascript(
