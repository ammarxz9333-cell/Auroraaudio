            Future<void> _downloadImage(String url) async {
              final uri = Uri.tryParse(url);
              if (uri == null) return;

              final pathName = uri.pathSegments.isEmpty
                  ? ''
                  : uri.pathSegments.last.split('?').first;
              final safeName = _safeFilename(
                pathName.isEmpty
                    ? 'daviewer_${DateTime.now().millisecondsSinceEpoch}.jpg'
                    : pathName,
              );

              final asset = MediaAsset(
                id: 'external-${_source.name}-${url.hashCode.abs()}',
                kind: MediaKind.image,
                role: MediaRole.original,
                availability: MediaAvailability.available,
                uri: uri,
                filename: safeName,
              );

              try {
                final manager = ref.read(runtimeProvider).transfers;
                await manager.initialize();
                final id =
                    'source-${_source.name}-${url.hashCode.abs()}';
                final existing = (await manager.records())
                    .where((record) => record.id == id)
                    .firstOrNull;
                if (existing != null &&
                    existing.state != TransferState.failed &&
                    existing.state != TransferState.cancelled &&
                    existing.state != TransferState.notFound) {
                  if (mounted) {
                    ScaffoldMessenger.of(context).showSnackBar(
                      const SnackBar(content: Text('Already in Downloads')),
                    );
                  }
                  return;
                }
                if (existing != null) await manager.remove(id);

                await manager.enqueue(
                  TransferRequest(id: id, asset: asset, filename: safeName),
                );
                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    const SnackBar(content: Text('Download started')),
                  );
                }
              } on Object {
                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    const SnackBar(
                      content: Text(
                        'Download failed. Open the original page if this source blocks direct downloads.',
                      ),
                    ),
                  );
                }
              }
            }

            String _safeFilename(String raw) {
              var name = raw
                  .replaceAll(RegExp(r'[^A-Za-z0-9._-]+'), '_')
                  .replaceAll(RegExp(r'_+'), '_');
              if (name.length > 100) {
                name = name.substring(name.length - 100);
              }
              if (!name.contains('.')) name = '$name.jpg';
              return name;
            }

