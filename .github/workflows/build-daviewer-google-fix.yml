name: Build DAViewer multi-source mature art

on:
  push:
    branches:
      - build/daviewer-google-oauth-fix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout DAViewer upstream
        uses: actions/checkout@v4
        with:
          repository: redtidev1918/daviewer
          ref: main
          path: daviewer

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true

      - name: Patch embedded Google OAuth popup handling
        shell: bash
        run: |
          cat > /tmp/oncreate.txt <<'EOF'
                    onCreateWindow: (controller, createWindowAction) async {
                      final windowId = createWindowAction.windowId;
                      if (mounted) {
                        setState(() => _popupWindowId = windowId);
                      }
                      return true;
                    },
          EOF
          cat > /tmp/popup.txt <<'EOF'
          if (_popupWindowId != null)
            Positioned.fill(
              child: Material(
                color: theme.scaffoldBackgroundColor,
                child: SafeArea(
                  child: Stack(
                    children: <Widget>[
                      InAppWebView(
                        windowId: _popupWindowId,
                        initialSettings: InAppWebViewSettings(
                          javaScriptEnabled: true,
                          userAgent: webUserAgent,
                          thirdPartyCookiesEnabled: true,
                          javaScriptCanOpenWindowsAutomatically: true,
                          supportMultipleWindows: false,
                        ),
                        shouldOverrideUrlLoading:
                            (popupController, navigationAction) async {
                          final uri = navigationAction.request.url;
                          if (uri != null &&
                              uri.scheme == 'dakit' &&
                              uri.host == 'oauth') {
                            _bridge?.addCallback(uri);
                            if (mounted) {
                              setState(() => _popupWindowId = null);
                            }
                            final parent = _controller;
                            if (parent != null) {
                              unawaited(
                                parent.loadUrl(
                                  urlRequest: URLRequest(
                                    url: WebUri(_homeUri.toString()),
                                  ),
                                ),
                              );
                            }
                            return NavigationActionPolicy.CANCEL;
                          }
                          return NavigationActionPolicy.ALLOW;
                        },
                        onCloseWindow: (popupController) {
                          // Google/Apple sign-in commonly closes this child window
                          // and then resumes the OAuth authorize flow in the parent.
                          // Do NOT navigate the parent away here: doing so aborts the
                          // pending OAuth transaction and leaves only the website
                          // cookie signed in while DAViewer itself stays signed out.
                          if (mounted) {
                            setState(() => _popupWindowId = null);
                          }
                        },
                      ),
                      Positioned(
                        top: 4,
                        right: 4,
                        child: Material(
                          color: theme.colorScheme.surface.withValues(alpha: 0.9),
                          shape: const CircleBorder(),
                          child: IconButton(
                            icon: const Icon(Icons.close),
                            onPressed: () {
                              if (mounted) {
                                setState(() => _popupWindowId = null);
                              }
                            },
                          ),
                        ),
                      ),
                    ],
                  ),
                ),
              ),
            ),
          EOF
          cat > /tmp/quick_download_widget.txt <<'EOF'
            const SizedBox(height: 10),
            originalResolution.when(
              loading: () => SizedBox(
                width: double.infinity,
                child: FilledButton.icon(
                  onPressed: null,
                  icon: const SizedBox.square(
                    dimension: 18,
                    child: CircularProgressIndicator(strokeWidth: 2),
                  ),
                  label: Text(s.checkingDownloadAvailability),
                ),
              ),
              error: (error, stackTrace) => const SizedBox.shrink(),
              data: (resolution) {
                final quickPlan = planDownload(
                  original: resolution.asset,
                  media: media,
                );
                if (!quickPlan.canDownload) {
                  return const SizedBox.shrink();
                }
                return SizedBox(
                  width: double.infinity,
                  child: FilledButton.icon(
                    onPressed: _downloading
                        ? null
                        : () => unawaited(
                            _download(
                              quickPlan.downloadable,
                              pages: additionalOriginals,
                            ),
                          ),
                    icon: _downloading
                        ? const SizedBox.square(
                            dimension: 18,
                            child: CircularProgressIndicator(strokeWidth: 2),
                          )
                        : const Icon(Icons.download_outlined),
                    label: Text(
                      _downloading
                          ? s.downloading
                          : quickPlan.usingFallback
                          ? s.downloadImage
                          : s.downloadOriginal,
                    ),
                  ),
                );
              },
            ),
          EOF
          python3 - <<'PY'
          from pathlib import Path

          p = Path("daviewer/lib/features/web_login/web_login_screen.dart")
          s = p.read_text()

          if "int? _popupWindowId;" not in s:
              anchor = "  InAppWebViewController? _controller;\n"
              if anchor not in s:
                  raise SystemExit("controller field patch point not found")
              s = s.replace(anchor, anchor + "  int? _popupWindowId;\n", 1)

          if "supportMultipleWindows: true," not in s:
              anchor = "                    initialSettings: InAppWebViewSettings(\n                      javaScriptEnabled: true,\n"
              repl = anchor + "                      supportMultipleWindows: true,\n                      javaScriptCanOpenWindowsAutomatically: true,\n                      thirdPartyCookiesEnabled: true,\n"
              if anchor not in s:
                  raise SystemExit("main settings patch point not found")
              s = s.replace(anchor, repl, 1)

          if "onCreateWindow: (controller, createWindowAction)" not in s:
              anchor = "                    shouldOverrideUrlLoading:\n"
              if anchor not in s:
                  raise SystemExit("navigation patch point not found")
              s = s.replace(anchor, Path("/tmp/oncreate.txt").read_text() + anchor, 1)

          if "windowId: _popupWindowId," not in s:
              anchor = "          if (_closeAfterReport) _LoginSuccessOverlay(s: s),\n"
              if anchor not in s:
                  raise SystemExit("overlay patch point not found")
              s = s.replace(anchor, Path("/tmp/popup.txt").read_text() + anchor, 1)

          # Do not leave the login screen merely because the website cookie is
          # signed in. The app identity is OAuth; closing early leaves Home showing
          # "Sign in" even though the embedded website is already logged in.
          import re
          if "final auth = ref.read(authControllerProvider);" not in s:
              pattern = re.compile(
                  r"(?ms)^\s*if \(isLoggedIn && mounted\) \{\s*"
                  r"WidgetsBinding\.instance\.addPostFrameCallback\(\(_\) => _closeScreen\(\)\);\s*"
                  r"\} else \{\s*_maybeClose\(\);\s*\}"
              )
              coordinated_close = """      if (isLoggedIn && mounted) {
                final auth = ref.read(authControllerProvider);
                if (auth.oauthSignedIn) {
                  _closeAfterReport = true;
                }
                _maybeClose();
              } else {
                _maybeClose();
              }"""
              s, count = pattern.subn(coordinated_close, s, count=1)
              if count != 1:
                  raise SystemExit("coordinated login regex patch point not found")

          p.write_text(s)

          router = Path("daviewer/lib/app/router.dart")
          rs = router.read_text()
          anchor = "    location == '/watch' ||\n"
          if anchor not in rs:
              raise SystemExit("router search patch point not found")
          rs = rs.replace(anchor, anchor + "    location == '/search' ||\n    location == '/downloads' ||\n    location == '/sources' ||\n", 1)
          tail = "    location.startsWith('/settings/');"
          if tail not in rs:
              raise SystemExit("router tail patch point not found")
          rs = rs.replace(tail, "    location.startsWith('/settings/') ||\n    location.startsWith('/artwork/') ||\n    location.startsWith('/tag/');", 1)
          router.write_text(rs)

          detail = Path("daviewer/lib/features/artwork/artwork_detail_screen.dart")
          ds = detail.read_text()
          image_anchor = "              onDownloadImage: (asset, page) =>\n                  unawaited(_confirmAndDownloadImage(asset, page)),\n            ),\n            const SizedBox(height: 16),\n"
          image_replacement = "              onDownloadImage: (asset, page) =>\n                  unawaited(_confirmAndDownloadImage(asset, page)),\n            ),\n" + Path("/tmp/quick_download_widget.txt").read_text() + "            const SizedBox(height: 16),\n"
          if image_anchor not in ds:
              raise SystemExit("quick download button patch point not found")
          detail.write_text(ds.replace(image_anchor, image_replacement, 1))
          print("Patched", p, router, "and", detail)
          PY

      - name: Patch request pacing and 429 backoff
        shell: bash
        run: |
          cat > daviewer/lib/core/network/provider_rate_limit_interceptor.dart <<'DART'
          import 'dart:async';

          import 'package:dio/dio.dart';

          /// Smooths bursts to DeviantArt endpoints and retries safe reads when
          /// the provider asks us to slow down. This does not bypass provider
          /// limits; it prevents the app from needlessly reaching them.
          final class ProviderRateLimitInterceptor extends Interceptor {
            ProviderRateLimitInterceptor(
              this._dio, {
              this.minimumSpacing = const Duration(milliseconds: 350),
              this.maxRetries = 5,
            });

            final Dio _dio;
            final Duration minimumSpacing;
            final int maxRetries;

            Future<void> _queue = Future<void>.value();
            DateTime _nextAllowed = DateTime.fromMillisecondsSinceEpoch(0);

            bool _targetsProvider(RequestOptions options) {
              final host = options.uri.host.toLowerCase();
              return host == 'deviantart.com' ||
                  host.endsWith('.deviantart.com') ||
                  host == 'deviantart.net' ||
                  host.endsWith('.deviantart.net');
            }

            Future<void> _waitForSlot() {
              final completer = Completer<void>();
              _queue = _queue.then((_) async {
                final now = DateTime.now();
                final wait = _nextAllowed.difference(now);
                if (wait > Duration.zero) {
                  await Future<void>.delayed(wait);
                }
                _nextAllowed = DateTime.now().add(minimumSpacing);
                completer.complete();
              });
              return completer.future;
            }

            @override
            void onRequest(
              RequestOptions options,
              RequestInterceptorHandler handler,
            ) async {
              if (_targetsProvider(options)) {
                await _waitForSlot();
              }
              handler.next(options);
            }

            @override
            void onError(DioException err, ErrorInterceptorHandler handler) async {
              final options = err.requestOptions;
              final status = err.response?.statusCode;
              final method = options.method.toUpperCase();
              final safeRead = method == 'GET' || method == 'HEAD';
              final retryCount =
                  (options.extra['daviewerProviderRetry'] as int?) ?? 0;

              if (!_targetsProvider(options) ||
                  !safeRead ||
                  retryCount >= maxRetries ||
                  (status != 429 && status != 503)) {
                handler.next(err);
                return;
              }

              final retryAfter = _retryAfter(err.response);
              final fallbackSeconds = 2 << retryCount;
              final delay = retryAfter ??
                  Duration(
                    seconds: fallbackSeconds > 30 ? 30 : fallbackSeconds,
                  );

              final candidate = DateTime.now().add(delay);
              if (candidate.isAfter(_nextAllowed)) {
                _nextAllowed = candidate;
              }

              options.extra['daviewerProviderRetry'] = retryCount + 1;
              try {
                final response = await _dio.fetch<dynamic>(options);
                handler.resolve(response);
              } on DioException catch (retryError) {
                handler.next(retryError);
              }
            }

            Duration? _retryAfter(Response<dynamic>? response) {
              final raw = response?.headers.value('retry-after')?.trim();
              if (raw == null || raw.isEmpty) return null;

              final seconds = int.tryParse(raw);
              if (seconds != null && seconds >= 0) {
                return Duration(seconds: seconds > 60 ? 60 : seconds);
              }

              final date = DateTime.tryParse(raw)?.toUtc();
              if (date == null) return null;
              final wait = date.difference(DateTime.now().toUtc());
              if (wait <= Duration.zero) return const Duration(seconds: 1);
              return wait > const Duration(seconds: 60)
                  ? const Duration(seconds: 60)
                  : wait;
            }
          }
          DART

          python3 - <<'PY'
          from pathlib import Path

          p = Path("daviewer/lib/core/runtime/app_runtime.dart")
          s = p.read_text()

          import_anchor = "import '../network/proxy_controller.dart';\n"
          if "provider_rate_limit_interceptor.dart" not in s:
              if import_anchor not in s:
                  raise SystemExit("runtime import patch point not found")
              s = s.replace(
                  import_anchor,
                  "import '../network/provider_rate_limit_interceptor.dart';\n" + import_anchor,
                  1,
              )

          runtime_anchor = "    final runtime = _build(null, dio: dio, proxyController: proxyController);\n"
          if "ProviderRateLimitInterceptor(dio)" not in s:
              if runtime_anchor not in s:
                  raise SystemExit("runtime creation patch point not found")
              s = s.replace(
                  runtime_anchor,
                  "    dio.interceptors.add(ProviderRateLimitInterceptor(dio));\n" + runtime_anchor,
                  1,
              )

          p.write_text(s)

          feed = Path("daviewer/lib/core/feed/artwork_feed_controller.dart")
          fs = feed.read_text()
          field_anchor = "  Future<void>? _activeFirstPageFetch;\n"
          if "_lastLoadMoreAt" not in fs:
              if field_anchor not in fs:
                  raise SystemExit("feed field patch point not found")
              fs = fs.replace(
                  field_anchor,
                  field_anchor + "  DateTime? _lastLoadMoreAt;\n",
                  1,
              )

          load_anchor = """  Future<void> loadMore() async {
              if (!mounted || state.isLoading || !state.hasMore) return;
              final cursor = state.nextCursor;
          """
          load_replacement = """  Future<void> loadMore() async {
              if (!mounted || state.isLoading || !state.hasMore) return;
              final now = DateTime.now();
              final previousLoad = _lastLoadMoreAt;
              if (previousLoad != null &&
                  now.difference(previousLoad) < const Duration(milliseconds: 700)) {
                return;
              }
              _lastLoadMoreAt = now;
              final cursor = state.nextCursor;
          """
          if "previousLoad != null" not in fs:
              if load_anchor not in fs:
                  raise SystemExit("feed loadMore patch point not found")
              fs = fs.replace(load_anchor, load_replacement, 1)

          feed.write_text(fs)
          print("Patched provider pacing/backoff and feed burst guard")
          PY

      - name: Add integrated art sources browser
        shell: bash
        run: |
          mkdir -p daviewer/lib/features/sources
          cat > daviewer/lib/features/sources/art_sources_screen.dart <<'DART'
          import 'dart:async';
          import 'dart:convert';

          import 'package:cached_network_image/cached_network_image.dart';
          import 'package:dakit_flutter/dakit_flutter.dart';
          import 'package:dio/dio.dart';
          import 'package:flutter/material.dart';
          import 'package:flutter_riverpod/flutter_riverpod.dart';
          import 'package:flutter_inappwebview/flutter_inappwebview.dart';

          import '../../core/runtime/runtime_provider.dart';

          enum ArtSource {
            pixiv('Pixiv', 'https://www.pixiv.net/en/'),
            newgrounds('Newgrounds', 'https://www.newgrounds.com/art'),
            bluesky('Bluesky', 'https://bsky.app/'),
            mastodon('Mastodon', 'https://mastodon.social/'),
            tumblr('Tumblr', 'https://www.tumblr.com/'),
            artStation('ArtStation', 'https://www.artstation.com/'),
            behance('Behance', 'https://www.behance.net/');

            const ArtSource(this.label, this.homeUrl);

            final String label;
            final String homeUrl;

            Uri searchUri(String rawQuery) {
              final query = rawQuery.trim();
              if (query.isEmpty) return Uri.parse(homeUrl);
              switch (this) {
                case ArtSource.artStation:
                  return Uri.parse(
                    'https://www.artstation.com/search?sort_by=relevance&query=${Uri.encodeQueryComponent(query)}',
                  );
                case ArtSource.tumblr:
                  return Uri.parse(
                    'https://www.tumblr.com/search/${Uri.encodeComponent(query)}',
                  );
                case ArtSource.behance:
                  return Uri.parse(
                    'https://www.behance.net/search/projects?search=${Uri.encodeQueryComponent(query)}',
                  );
                case ArtSource.pixiv:
                  return Uri.parse(
                    'https://www.pixiv.net/en/tags/${Uri.encodeComponent(query)}/artworks',
                  );
                case ArtSource.newgrounds:
                  return Uri.parse(
                    'https://www.newgrounds.com/search/conduct/art?suitabilities=etma&terms=${Uri.encodeQueryComponent(query)}',
                  );
                case ArtSource.bluesky:
                  return Uri.parse(
                    'https://bsky.app/search?q=${Uri.encodeQueryComponent(query)}',
                  );
                case ArtSource.mastodon:
                  final tag = query
                      .replaceFirst(RegExp(r'^#'), '')
                      .replaceAll(RegExp(r'[^A-Za-z0-9_]+'), '');
                  return Uri.parse(
                    'https://mastodon.social/tags/${Uri.encodeComponent(tag.isEmpty ? 'transart' : tag)}',
                  );
              }
            }

            Map<String, String>? get imageHeaders {
              switch (this) {
                case ArtSource.pixiv:
                  return const <String, String>{
                    'Referer': 'https://www.pixiv.net/',
                  };
                case ArtSource.artStation:
                  return const <String, String>{
                    'Referer': 'https://www.artstation.com/',
                  };
                case ArtSource.newgrounds:
                  return const <String, String>{
                    'Referer': 'https://www.newgrounds.com/',
                  };
                case ArtSource.bluesky:
                  return const <String, String>{
                    'Referer': 'https://bsky.app/',
                  };
                case ArtSource.mastodon:
                case ArtSource.tumblr:
                case ArtSource.behance:
                  return null;
              }
            }

            String get note {
              switch (this) {
                case ArtSource.artStation:
                  return 'Mature art follows your ArtStation browsing settings.';
                case ArtSource.tumblr:
                  return 'Sensitive posts follow Tumblr content labels and your account settings.';
                case ArtSource.behance:
                  return 'Adult projects may require an 18+ account with Safe Browsing disabled.';
                case ArtSource.pixiv:
                  return 'Age-restricted works follow your Pixiv birthday and viewing settings.';
                case ArtSource.newgrounds:
                  return 'Newgrounds M/A art follows your account content-rating settings.';
                case ArtSource.bluesky:
                  return 'Adult media follows your Bluesky moderation and adult-content settings.';
                case ArtSource.mastodon:
                  return 'Mastodon uses public hashtag media; sensitive posts stay subject to the instance and account rules.';
              }
            }
          }

          const List<String> transArtQueries = <String>[
            'transgender art',
            'trans woman art',
            'trans femme art',
            'trans man art',
            'transmasc art',
            'trans bulge art',
            'nonbinary art',
            'genderfluid art',
            '#transart',
            '#transfem',
            '#transmasc',
            '#nonbinaryart',
          ];

          final class ArtSourcesScreen extends ConsumerStatefulWidget {
            const ArtSourcesScreen({super.key});

            @override
            ConsumerState<ArtSourcesScreen> createState() =>
                _ArtSourcesScreenState();
          }

          final class _ArtSourcesScreenState
              extends ConsumerState<ArtSourcesScreen> {
            final TextEditingController _searchController =
                TextEditingController(text: 'transgender art');
            final ScrollController _gridController = ScrollController();
            final List<String> _images = <String>[];
            final Set<String> _seen = <String>{};

            InAppWebViewController? _collector;
            ArtSource _source = ArtSource.pixiv;
            bool _loadingPage = true;
            bool _loadingMore = false;
            double _pageProgress = 0;
            String? _status;
            String? _mastodonMaxId;
            final Dio _mastodonDio = Dio(
              BaseOptions(
                baseUrl: 'https://mastodon.social',
                connectTimeout: const Duration(seconds: 12),
                receiveTimeout: const Duration(seconds: 20),
              ),
            );

            @override
            void initState() {
              super.initState();
              _gridController.addListener(_onGridScroll);
            }

            @override
            void dispose() {
              _gridController
                ..removeListener(_onGridScroll)
                ..dispose();
              _searchController.dispose();
              super.dispose();
            }

            void _onGridScroll() {
              if (!_gridController.hasClients || _loadingMore) return;
              final position = _gridController.position;
              if (position.pixels >= position.maxScrollExtent - 900) {
                unawaited(_loadMore());
              }
            }

            Future<void> _switchSource(ArtSource source) async {
              if (_source == source) return;
              setState(() {
                _source = source;
                _status = null;
                _mastodonMaxId = null;
              });
              await _search(reset: true);
            }

            Future<void> _search({
              String? supplied,
              bool reset = true,
            }) async {
              final query = (supplied ?? _searchController.text).trim();
              if (supplied != null) {
                _searchController.text = supplied;
                _searchController.selection = TextSelection.collapsed(
                  offset: _searchController.text.length,
                );
              }

              if (reset) {
                setState(() {
                  _images.clear();
                  _seen.clear();
                  _loadingPage = true;
                  _pageProgress = 0;
                  _status = 'Searching ${_source.label}…';
                });
              }

              if (_source == ArtSource.mastodon) {
                await _searchMastodon(query, reset: reset);
                return;
              }

              final controller = _collector;
              if (controller == null) return;
              await controller.loadUrl(
                urlRequest: URLRequest(
                  url: WebUri(_source.searchUri(query).toString()),
                ),
              );
            }

            String _mastodonTagFor(String raw) {
              final query = raw.trim().toLowerCase().replaceFirst('#', '');
              const aliases = <String, String>{
                'transgender art': 'transart',
                'trans woman art': 'transfemart',
                'trans femme art': 'transfemart',
                'trans man art': 'transmascart',
                'transmasc art': 'transmascart',
                'trans bulge art': 'transart',
                'nonbinary art': 'nonbinaryart',
                'genderfluid art': 'genderfluidart',
              };
              final alias = aliases[query];
              if (alias != null) return alias;
              final compact = query.replaceAll(RegExp(r'[^a-z0-9_]+'), '');
              return compact.isEmpty ? 'transart' : compact;
            }

            Future<void> _searchMastodon(
              String rawQuery, {
              required bool reset,
            }) async {
              final tag = _mastodonTagFor(rawQuery);
              if (reset) _mastodonMaxId = null;

              setState(() {
                _loadingPage = true;
                _status = 'Loading #$tag from Mastodon…';
              });

              try {
                final response = await _mastodonDio.get<List<dynamic>>(
                  '/api/v1/timelines/tag/${Uri.encodeComponent(tag)}',
                  queryParameters: <String, dynamic>{
                    'only_media': true,
                    'limit': 40,
                    if (_mastodonMaxId != null) 'max_id': _mastodonMaxId,
                  },
                );

                final data = response.data ?? const <dynamic>[];
                final fresh = <String>[];
                String? lastId;

                for (final item in data) {
                  if (item is! Map) continue;
                  final map = Map<String, dynamic>.from(item);
                  final id = map['id']?.toString();
                  if (id != null && id.isNotEmpty) lastId = id;

                  final attachments = map['media_attachments'];
                  if (attachments is! List) continue;
                  for (final attachment in attachments) {
                    if (attachment is! Map) continue;
                    final media = Map<String, dynamic>.from(attachment);
                    final type = media['type']?.toString();
                    if (type != 'image' && type != 'gifv') continue;
                    final url = (media['url'] ?? media['preview_url'])?.toString();
                    if (url == null || url.isEmpty) continue;
                    if (_seen.add(url)) fresh.add(url);
                  }
                }

                if (!mounted) return;
                setState(() {
                  _mastodonMaxId = lastId;
                  _images.addAll(fresh);
                  _loadingPage = false;
                  _status = _images.isEmpty
                      ? 'No media found for #$tag'
                      : '${_images.length} images · #$tag';
                });
              } on DioException catch (error) {
                if (!mounted) return;
                setState(() {
                  _loadingPage = false;
                  _status = error.response?.statusCode == 401
                      ? 'This Mastodon instance requires sign-in for public timelines.'
                      : 'Mastodon request failed. Try another tag.';
                });
              }
            }

            Future<void> _extractImages() async {
              final controller = _collector;
              if (controller == null) return;

              const script = r'''
              (() => {
                const out = [];
                const seen = new Set();

                const add = (url, el) => {
                  if (!url || typeof url !== 'string') return;
                  url = url.trim();
                  if (!/^https?:/i.test(url)) return;
                  if (/avatar|favicon|emoji|logo|badge|sprite/i.test(url)) {
                    const w = el?.naturalWidth || el?.clientWidth || 0;
                    const h = el?.naturalHeight || el?.clientHeight || 0;
                    if (Math.max(w, h) < 500) return;
                  }
                  if (!seen.has(url)) {
                    seen.add(url);
                    out.push(url);
                  }
                };

                const bestSrcset = (srcset) => {
                  if (!srcset) return '';
                  const parts = srcset.split(',');
                  return parts[parts.length - 1]
                    .trim()
                    .split(/\s+/)[0] || '';
                };

                document.querySelectorAll('img').forEach((img) => {
                  const w = img.naturalWidth || img.clientWidth || 0;
                  const h = img.naturalHeight || img.clientHeight || 0;
                  if (w > 0 && h > 0 && (w < 150 || h < 150)) return;
                  add(bestSrcset(img.getAttribute('srcset')), img);
                  add(img.currentSrc, img);
                  add(img.getAttribute('data-src'), img);
                  add(img.getAttribute('data-original'), img);
                  add(img.getAttribute('data-lazy-src'), img);
                  add(img.src, img);
                });

                document.querySelectorAll('source[srcset]').forEach((source) => {
                  add(bestSrcset(source.getAttribute('srcset')), source);
                });

                document.querySelectorAll('[style*="background-image"]').forEach((el) => {
                  const bg = getComputedStyle(el).backgroundImage || '';
                  const match = bg.match(/url\(["']?(.*?)["']?\)/);
                  if (match) add(match[1], el);
                });

                return JSON.stringify(out);
              })();
              ''';

              try {
                final dynamic raw = await controller.evaluateJavascript(
                  source: script,
                );
                final urls = _decodeUrlList(raw);
                if (!mounted || urls.isEmpty) return;

                final fresh = <String>[];
                for (final url in urls) {
                  if (_seen.add(url)) fresh.add(url);
                }
                if (fresh.isEmpty) return;

                setState(() {
                  _images.addAll(fresh);
                  _status = '${_images.length} images';
                });
              } on Object {
                if (mounted && _images.isEmpty) {
                  setState(() => _status = 'Could not read images from this page.');
                }
              }
            }

            List<String> _decodeUrlList(dynamic raw) {
              dynamic value = raw;
              for (var i = 0; i < 2; i += 1) {
                if (value is String) {
                  try {
                    value = jsonDecode(value);
                  } on Object {
                    break;
                  }
                }
              }
              if (value is! List) return const <String>[];
              return value
                  .whereType<String>()
                  .where((url) => url.startsWith('http://') || url.startsWith('https://'))
                  .toList(growable: false);
            }

            Future<void> _loadMore() async {
              if (_loadingMore) return;
              if (_source == ArtSource.mastodon) {
                setState(() => _loadingMore = true);
                try {
