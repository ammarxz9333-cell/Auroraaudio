      - name: Build installable debug APK
        shell: bash
        run: |
          cd daviewer
          dart format lib/features/web_login/web_login_screen.dart lib/app/router.dart lib/features/home/home_screen.dart lib/features/sources/art_sources_screen.dart lib/features/artwork/artwork_detail_screen.dart lib/core/network/provider_rate_limit_interceptor.dart lib/core/runtime/app_runtime.dart lib/core/feed/artwork_feed_controller.dart
          flutter analyze lib/features/web_login/web_login_screen.dart lib/app/router.dart lib/features/home/home_screen.dart lib/features/sources/art_sources_screen.dart lib/features/artwork/artwork_detail_screen.dart lib/core/network/provider_rate_limit_interceptor.dart lib/core/runtime/app_runtime.dart lib/core/feed/artwork_feed_controller.dart
          flutter build apk --debug
          cp build/app/outputs/flutter-apk/app-debug.apk ../DAViewer-quick-download.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DAViewer-multi-source
          path: DAViewer-quick-download.apk
          retention-days: 7
          if-no-files-found: error
