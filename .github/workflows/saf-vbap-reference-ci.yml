name: SAF VBAP Reference CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "config/saf-reference-v1.json"
      - "docs/saf-vbap-reference.md"
      - "validation/open-immersive/saf_*"
      - "fixtures/scenes/7_1_4_reference.json"
      - "fixtures/scenes/11_1_4_research.json"
      - "crates/aurora-renderer-vbap/**"
      - "crates/aurora-simulation-assurance/**"
      - "config/external-components-v1.json"
      - "THIRD_PARTY_LICENSES.md"
      - ".github/workflows/saf-vbap-reference-ci.yml"

permissions:
  contents: read

concurrency:
  group: saf-vbap-reference-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  saf-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SAF_COMMIT: 18fd5aba46e20787b51f28f7197a68506c965c07
    steps:
      - name: Checkout Aurora
        uses: actions/checkout@v4

      - name: Checkout pinned SAF
        uses: actions/checkout@v4
        with:
          repository: leomccormack/Spatial_Audio_Framework
          ref: 18fd5aba46e20787b51f28f7197a68506c965c07
          path: saf
          fetch-depth: 1

      - name: Verify immutable pin and upstream license boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C saf rev-parse HEAD)" = "$SAF_COMMIT"
          python3 - <<'PY'
          import json
          ref = json.load(open('config/saf-reference-v1.json', encoding='utf-8'))
          assert ref['pinned_commit'] == '18fd5aba46e20787b51f28f7197a68506c965c07'
          assert ref['integration'] == 'external-reference-only'
          assert ref['baseline']['tracker_enabled'] is False
          assert ref['baseline']['hades_enabled'] is False
          print('SAF-PIN-PASS')
          PY
          grep -q "ISC License" saf/LICENSE.md
          grep -q "GNU GPLv2" saf/README.md
          grep -q "@license GNU GPLv2" saf/framework/modules/saf_tracker/saf_tracker.c
          grep -q "@license GNU GPLv2" saf/framework/modules/saf_tracker/saf_tracker_internal.c
          grep -q "@license GNU GPLv2" saf/test/src/test__tracker_module.c
          grep -q "@license GNU GPLv2" saf/test/src/test__hades_module.c
          echo "SAF-UPSTREAM-LICENSE-BOUNDARY-DETECTED"

      - name: Remove disabled GPL sources from validation build graph
        shell: bash
        run: |
          set -euo pipefail
          git -C saf apply ../validation/open-immersive/saf-permissive-core.patch
          python3 - <<'PY'
          from pathlib import Path
          modules = Path('saf/framework/modules/CMakeLists.txt').read_text(encoding='utf-8')
          tests = Path('saf/test/CMakeLists.txt').read_text(encoding='utf-8')
          assert modules.count('saf_tracker/saf_tracker.c') == 1
          assert modules.count('saf_tracker/saf_tracker_internal.c') == 1
          assert modules.count('saf_tracker/saf_tracker_internal.h') == 1
          assert 'test__tracker_module.c' not in tests
          assert 'test__hades_module.c' not in tests
          print('SAF-GPL-SOURCE-EXCLUSION-PASS')
          PY

      - name: Install SAF build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes \
            cmake \
            build-essential \
            libopenblas-dev \
            liblapack-dev \
            liblapacke-dev

      - name: Configure permissive SAF core only
        shell: bash
        run: |
          set -euo pipefail
          cmake -S saf -B saf-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DSAF_PERFORMANCE_LIB=SAF_USE_OPEN_BLAS_AND_LAPACKE \
            -DSAF_ENABLE_TRACKER_MODULE=OFF \
            -DSAF_ENABLE_HADES_MODULE=OFF \
            -DSAF_ENABLE_SOFA_READER_MODULE=OFF \
            -DSAF_BUILD_TESTS=ON
          grep -R "SAF_ENABLE_TRACKER_MODULE:BOOL=OFF" saf-build/CMakeCache.txt
          grep -R "SAF_ENABLE_HADES_MODULE:BOOL=OFF" saf-build/CMakeCache.txt
          python3 - <<'PY'
          import json
          commands = json.load(open('saf-build/compile_commands.json', encoding='utf-8'))
          files = [entry['file'].replace('\\', '/') for entry in commands]
          forbidden = [
              path for path in files
              if '/saf_tracker/' in path
              or '/saf_hades/' in path
              or path.endswith('/test__tracker_module.c')
              or path.endswith('/test__hades_module.c')
          ]
          if forbidden:
              raise SystemExit(f'GPL translation units unexpectedly compiled: {forbidden}')
          print(f'SAF-PERMISSIVE-COMPILE-GRAPH-PASS files={len(files)}')
          PY

      - name: Build pinned SAF permissive validation core
        shell: bash
        run: |
          set -euo pipefail
          cmake --build saf-build --config Release --parallel 2
          test -f saf-build/framework/libsaf.a -o -f saf-build/framework/libsaf.so
          echo "SAF-BUILD-PASS"

      - name: Run remaining upstream SAF tests with GPL test units excluded
        shell: bash
        run: |
          set -euo pipefail
          test -x saf-build/test/saf_test
          saf-build/test/saf_test
          echo "SAF-UPSTREAM-PERMISSIVE-TESTS-PASS"

      - name: Generate Aurora 7.1.4 VBAP trajectory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/saf-vbap-reference/aurora
          cargo run -p aurora-simulation-assurance --release --bin aurora-evaluate-vbap3d -- \
            --scene fixtures/scenes/7_1_4_reference.json \
            --output-dir output/saf-vbap-reference/aurora \
            --duration-seconds 1.0 \
            --sample-rate 48000
          test -s output/saf-vbap-reference/aurora/gain-trajectory.json
          test -s output/saf-vbap-reference/aurora/rendered-reference.wav
          echo "AURORA-VBAP3D-7-1-4-TRAJECTORY-PASS"

      - name: Prepare identical 7.1.4 SAF geometry and source directions
        shell: bash
        run: |
          set -euo pipefail
          python3 validation/open-immersive/saf_vbap_reference_evidence.py prepare \
            --scene fixtures/scenes/7_1_4_reference.json \
            --aurora-trajectory output/saf-vbap-reference/aurora/gain-trajectory.json \
            --speaker-out output/saf-vbap-reference/saf-speakers.txt \
            --source-out output/saf-vbap-reference/saf-sources.txt \
            --mapping-out output/saf-vbap-reference/mapping.json

      - name: Build and run SAF 7.1.4 VBAP gain probe
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -O2 \
            -I saf/framework/include \
            validation/open-immersive/saf_vbap_reference_probe.c \
            saf-build/framework/libsaf.a \
            -lopenblas -llapacke -latomic -lm \
            -o output/saf-vbap-reference/saf-vbap-probe
          output/saf-vbap-reference/saf-vbap-probe \
            output/saf-vbap-reference/saf-speakers.txt \
            output/saf-vbap-reference/saf-sources.txt \
            output/saf-vbap-reference/saf-gains.txt
          test -s output/saf-vbap-reference/saf-gains.txt
          echo "SAF-VBAP-7-1-4-PROBE-PASS"

      - name: Compare Aurora and SAF 7.1.4 semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 validation/open-immersive/saf_vbap_reference_evidence.py compare \
            --aurora-trajectory output/saf-vbap-reference/aurora/gain-trajectory.json \
            --mapping output/saf-vbap-reference/mapping.json \
            --saf-gains output/saf-vbap-reference/saf-gains.txt \
            --output output/saf-vbap-reference/differential-summary.json
          echo "AURORA-SAF-VBAP-7-1-4-DIFFERENTIAL-PASS"

      - name: Generate Aurora 11.1.4 research trajectory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/saf-vbap-reference/11_1_4/aurora
          cargo run -p aurora-simulation-assurance --release --bin aurora-evaluate-vbap3d -- \
            --scene fixtures/scenes/11_1_4_research.json \
            --output-dir output/saf-vbap-reference/11_1_4/aurora \
            --duration-seconds 1.0 \
            --sample-rate 48000
          test -s output/saf-vbap-reference/11_1_4/aurora/gain-trajectory.json
          python3 - <<'PY'
          import json
          fixture = json.load(open('fixtures/scenes/11_1_4_research.json', encoding='utf-8'))
          metadata = json.load(open('output/saf-vbap-reference/11_1_4/aurora/metadata.json', encoding='utf-8'))['payload']
          summary = json.load(open('output/saf-vbap-reference/11_1_4/aurora/summary.json', encoding='utf-8'))['payload']
          assert fixture['layout'] == 'custom'
          assert fixture['research_layout'] == '11.1.4-research-custom'
          assert len(fixture['speakers']) == 16
          assert metadata['output_channels'] == 16
          assert metadata['wav_exported'] is False
          assert summary['wav_exported'] is False
          assert 'rendered-reference.wav' not in summary['artifacts']
          print('AURORA-VBAP3D-11-1-4-RESEARCH-JSON-ONLY-PASS')
          PY

      - name: Prepare identical 11.1.4 research SAF geometry and source directions
        shell: bash
        run: |
          set -euo pipefail
          python3 validation/open-immersive/saf_vbap_reference_evidence.py prepare \
            --scene fixtures/scenes/11_1_4_research.json \
            --aurora-trajectory output/saf-vbap-reference/11_1_4/aurora/gain-trajectory.json \
            --speaker-out output/saf-vbap-reference/11_1_4/saf-speakers.txt \
            --source-out output/saf-vbap-reference/11_1_4/saf-sources.txt \
            --mapping-out output/saf-vbap-reference/11_1_4/mapping.json

      - name: Run SAF 11.1.4 research VBAP gain probe
        shell: bash
        run: |
          set -euo pipefail
          output/saf-vbap-reference/saf-vbap-probe \
            output/saf-vbap-reference/11_1_4/saf-speakers.txt \
            output/saf-vbap-reference/11_1_4/saf-sources.txt \
            output/saf-vbap-reference/11_1_4/saf-gains.txt
          test -s output/saf-vbap-reference/11_1_4/saf-gains.txt
          echo "SAF-VBAP-11-1-4-RESEARCH-PROBE-PASS"

      - name: Compare Aurora and SAF 11.1.4 research semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 validation/open-immersive/saf_vbap_reference_evidence.py compare \
            --aurora-trajectory output/saf-vbap-reference/11_1_4/aurora/gain-trajectory.json \
            --mapping output/saf-vbap-reference/11_1_4/mapping.json \
            --saf-gains output/saf-vbap-reference/11_1_4/saf-gains.txt \
            --output output/saf-vbap-reference/11_1_4/differential-summary.json
          echo "AURORA-SAF-VBAP-11-1-4-RESEARCH-DIFFERENTIAL-PASS"

      - name: Emit baseline evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib
          cfg = pathlib.Path('config/saf-reference-v1.json')
          patch = pathlib.Path('validation/open-immersive/saf-permissive-core.patch')
          research = json.load(open('output/saf-vbap-reference/11_1_4/differential-summary.json', encoding='utf-8'))
          data = {
              'schema_version': 1,
              'saf_commit': '18fd5aba46e20787b51f28f7197a68506c965c07',
              'config_sha256': hashlib.sha256(cfg.read_bytes()).hexdigest(),
              'permissive_core_patch_sha256': hashlib.sha256(patch.read_bytes()).hexdigest(),
              'performance_library': 'SAF_USE_OPEN_BLAS_AND_LAPACKE',
              'tracker_enabled': False,
              'hades_enabled': False,
              'sofa_reader_enabled': False,
              'gpl_tracker_sources_compiled': False,
              'gpl_hades_sources_compiled': False,
              'gpl_tracker_test_source_compiled': False,
              'gpl_hades_test_source_compiled': False,
              'permissive_upstream_tests_passed': True,
              'seven_one_four_reference_differential_passed': True,
              'eleven_one_four_research_differential_passed': bool(research['passed']),
              'status': 'REFERENCE-BASELINE-PASS',
              'truth_boundary': 'Pinned external SAF validation build with GPL tracker/HADES module and test translation units excluded from the compile graph. 7.1.4 and an explicitly custom Aurora 11.1.4 research geometry are exercised as separate software-only gain differentials. The research geometry is not asserted as a standardized layout. No runtime adoption, physical acoustics, binaural, HOA, proprietary-renderer equivalence, or certification is claimed.'
          }
          pathlib.Path('output/saf-vbap-reference/baseline-summary.json').write_text(
              json.dumps(data, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(data, indent=2, sort_keys=True))
          PY

      - name: Upload SAF reference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saf-vbap-reference-${{ github.sha }}
          path: |
            output/saf-vbap-reference/**/*.json
            output/saf-vbap-reference/**/*.txt
            output/saf-vbap-reference/*.json
            output/saf-vbap-reference/*.txt
          if-no-files-found: error
          retention-days: 14
