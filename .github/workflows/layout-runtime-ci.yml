name: Aurora Wider Layout Runtime CI

on:
  push:
    branches:
      - feature/direct-earc-linux-ingest
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/aurora-layout-playback-runtime/**"
      - "crates/aurora-speaker-output/**"
      - "crates/aurora-cli/**"
      - "crates/aurora-decoder-open/**"
      - "scripts/validate_layout_runtime.sh"
      - ".github/workflows/layout-runtime-ci.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/aurora-layout-playback-runtime/**"
      - "crates/aurora-speaker-output/**"
      - "crates/aurora-cli/**"
      - "crates/aurora-decoder-open/**"
      - "scripts/validate_layout_runtime.sh"
      - ".github/workflows/layout-runtime-ci.yml"

permissions:
  contents: read

concurrency:
  group: aurora-layout-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layout-runtime:
    name: Wider layout runtime validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
      - name: Install Linux audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev pkg-config
      - name: Validate script syntax
        run: bash -n scripts/validate_layout_runtime.sh
      - name: Run wider-layout software validation
        run: bash scripts/validate_layout_runtime.sh
