name: Product MSRV Repair Once

on:
  push:
    branches:
      - product/q995-clean-baseline

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'MSRV_REPAIR_DONE') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/q995-clean-baseline
      - uses: dtolnay/rust-toolchain@1.78.0
        with:
          components: rustfmt
      - name: Install Linux audio build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libasound2-dev
      - name: Fix 3D iterator compatibility
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('crates/aurora-renderer-vbap3d/src/lib.rs'); s=p.read_text(); r=[('for first in 0..speakers.len() {','for (first, first_speaker) in speakers.iter().enumerate() {'),('is_spatial_speaker(&speakers[first])','is_spatial_speaker(first_speaker)'),('vector_between(listener, speakers[first].position)','vector_between(listener, first_speaker.position)'),('for second in (first + 1)..speakers.len() {','for (second, second_speaker) in speakers.iter().enumerate().skip(first + 1) {'),('is_spatial_speaker(&speakers[second])','is_spatial_speaker(second_speaker)'),('vector_between(listener, speakers[second].position)','vector_between(listener, second_speaker.position)'),('for third in (second + 1)..speakers.len() {','for (third, third_speaker) in speakers.iter().enumerate().skip(second + 1) {'),('is_spatial_speaker(&speakers[third])','is_spatial_speaker(third_speaker)'),('vector_between(listener, speakers[third].position)','vector_between(listener, third_speaker.position)')]; [(_ for _ in ()).throw(SystemExit('missing '+a)) if a not in s else None for a,b in r]; [None for a,b in r if not (s:=s.replace(a,b,1))]; p.write_text(s)"
      - name: Fix output DSP Rust 1.78 mutable borrows
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('crates/aurora-dsp-output/src/lib.rs'); s=p.read_text(); a='                let high = hp[1].process(hp[0].process(input));\n                let low = lp[1].process(lp[0].process(input));'; b='                let high_stage_1 = hp[0].process(input);\n                let high = hp[1].process(high_stage_1);\n                let low_stage_1 = lp[0].process(input);\n                let low = lp[1].process(low_stage_1);'; (_ for _ in ()).throw(SystemExit('missing DSP cascade')) if a not in s else None; p.write_text(s.replace(a,b,1))"
      - name: Add core test dependency
        shell: bash
        run: |
          if ! grep -q '^serde_json.workspace = true$' crates/aurora-core/Cargo.toml; then
            printf '\n[dev-dependencies]\nserde_json.workspace = true\n' >> crates/aurora-core/Cargo.toml
          fi
      - name: Restore accepted Rust 1.78 transitive pins
        shell: bash
        run: |
          cargo update -p half --precise 2.4.1
          cargo update -p rayon --precise 1.10.0
          cargo update -p rayon-core --precise 1.12.1
          cargo fmt --all
      - name: Refresh required lock metadata
        run: cargo check --workspace --all-targets --all-features
      - name: Prove locked workspace on MSRV
        run: cargo check --workspace --all-targets --all-features --locked
      - name: Commit repaired source and lockfile
        shell: bash
        run: |
          git config user.name "aurora-ci"
          git config user.email "aurora-ci@users.noreply.github.com"
          git add Cargo.lock crates/aurora-core/Cargo.toml crates/aurora-renderer-vbap3d/src/lib.rs crates/aurora-dsp-output/src/lib.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "MSRV_REPAIR_DONE stabilize 7.1.4 renderer and output DSP"
          git push origin HEAD:product/q995-clean-baseline
