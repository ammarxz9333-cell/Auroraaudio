name: Product MSRV Repair Once

on:
  push:
    branches:
      - product/q995-clean-baseline

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'MSRV_REPAIR_DONE') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/q995-clean-baseline
      - uses: dtolnay/rust-toolchain@1.78.0
        with:
          components: rustfmt
      - name: Install Linux audio build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libasound2-dev
      - name: Fix deterministic 3D triplet iteration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/aurora-renderer-vbap3d/src/lib.rs')
          text = path.read_text()
          replacements = [
              ('for first in 0..speakers.len() {', 'for (first, first_speaker) in speakers.iter().enumerate() {'),
              ('is_spatial_speaker(&speakers[first])', 'is_spatial_speaker(first_speaker)'),
              ('vector_between(listener, speakers[first].position)', 'vector_between(listener, first_speaker.position)'),
              ('for second in (first + 1)..speakers.len() {', 'for (second, second_speaker) in speakers.iter().enumerate().skip(first + 1) {'),
              ('is_spatial_speaker(&speakers[second])', 'is_spatial_speaker(second_speaker)'),
              ('vector_between(listener, speakers[second].position)', 'vector_between(listener, second_speaker.position)'),
              ('for third in (second + 1)..speakers.len() {', 'for (third, third_speaker) in speakers.iter().enumerate().skip(second + 1) {'),
              ('is_spatial_speaker(&speakers[third])', 'is_spatial_speaker(third_speaker)'),
              ('vector_between(listener, speakers[third].position)', 'vector_between(listener, third_speaker.position)'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'expected 3D expression not found: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Restore accepted Rust 1.78 transitive pins
        shell: bash
        run: |
          cargo update -p half --precise 2.4.1
          cargo update -p rayon --precise 1.10.0
          cargo update -p rayon-core --precise 1.12.1
          cargo fmt --all
      - name: Prove locked workspace on MSRV before commit
        run: cargo check --workspace --all-targets --all-features --locked
      - name: Commit repaired source and compatible lockfile
        shell: bash
        run: |
          git config user.name "aurora-ci"
          git config user.email "aurora-ci@users.noreply.github.com"
          git add Cargo.lock crates/aurora-renderer-vbap3d/src/lib.rs
          if git diff --cached --quiet; then
            echo "Source and lockfile already repaired"
            exit 0
          fi
          git commit -m "MSRV_REPAIR_DONE pin dependencies and fix 3D iteration"
          git push origin HEAD:product/q995-clean-baseline
