name: Aurora Physical Ingress Tooling CI

on:
  pull_request:
    paths:
      - "validation/physical/**"
      - "docs/physical-joc-validation-v1.md"
      - "AGENTS.md"
      - ".github/workflows/aurora-physical-ingress-tooling-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurora-physical-ingress-tooling-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  physical-ingress-tooling:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile physical and live-ingress tooling
        run: |
          python -m py_compile validation/physical/aurora_physical_ingress.py
          python -m py_compile validation/physical/aurora_alsa_iec61937_capture.py
          python -m py_compile validation/physical/aurora_live_ingress.py
          python -m py_compile validation/physical/aurora_alsa_iec61937_stream.py
          python -m py_compile validation/physical/aurora_genavb_single_listener_evidence.py
          python -m py_compile validation/physical/aurora_genavb_nxp_gptp_evidence.py
          python -m py_compile validation/physical/aurora_esp_avb_listener_evidence.py
          python -m py_compile validation/physical/aurora_patch_esp_ptp_lock_evidence.py
          python -m py_compile validation/physical/aurora_patch_esp_avb_listener_evidence.py

      - name: Run fixed-capture ingress positive and fail-closed self-tests
        run: python validation/physical/aurora_physical_ingress.py self-test

      - name: Run ALSA slot conversion self-tests
        run: python validation/physical/aurora_alsa_iec61937_capture.py self-test

      - name: Run bounded live-ingress threshold and relock self-tests
        run: python validation/physical/aurora_live_ingress.py self-test

      - name: Run continuous ALSA stream conversion self-tests
        run: python validation/physical/aurora_alsa_iec61937_stream.py self-test

      - name: Run GenAVB one-listener evidence correlator self-tests
        run: python validation/physical/aurora_genavb_single_listener_evidence.py self-test

      - name: Run NXP gPTP evidence bundler self-tests
        run: python validation/physical/aurora_genavb_nxp_gptp_evidence.py self-test

      - name: Run ESP listener evidence bundler self-tests
        run: python validation/physical/aurora_esp_avb_listener_evidence.py self-test

      - name: Verify ESP PTP and AVB instrumentation applies to exact pinned sources
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          ESP_PTP_SHA=5b7eec233a93733ae954beefb6df3bb9c12dc901
          ESP_AVB_SHA=5e75bd3ed91b5407a254a5e49bfc18fc35e6cbb9

          git clone --filter=blob:none --no-checkout https://github.com/scrambletools/esp_ptp.git "$RUNNER_TEMP/esp_ptp"
          git -C "$RUNNER_TEMP/esp_ptp" fetch --depth 1 origin "$ESP_PTP_SHA"
          git -C "$RUNNER_TEMP/esp_ptp" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/esp_ptp" rev-parse HEAD)" = "$ESP_PTP_SHA"
          python validation/physical/aurora_patch_esp_ptp_lock_evidence.py apply-check \
            --root "$RUNNER_TEMP/esp_ptp"
          grep -q 'status->clock_stable' "$RUNNER_TEMP/esp_ptp/ptp.c"

          git clone --filter=blob:none --no-checkout https://github.com/scrambletools/esp_avb.git "$RUNNER_TEMP/esp_avb"
          git -C "$RUNNER_TEMP/esp_avb" fetch --depth 1 origin "$ESP_AVB_SHA"
          git -C "$RUNNER_TEMP/esp_avb" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/esp_avb" rev-parse HEAD)" = "$ESP_AVB_SHA"
          python validation/physical/aurora_patch_esp_avb_listener_evidence.py apply-check \
            --root "$RUNNER_TEMP/esp_avb"
          grep -q 'listener_evidence.frames_rx' "$RUNNER_TEMP/esp_avb/avb.c"
          grep -q 'clock_source_info.btc_id' "$RUNNER_TEMP/esp_avb/avb.c"
          grep -q 'gptp_clock_stable' "$RUNNER_TEMP/esp_avb/include/esp_avb.h"
