name: Aurora 11.1.4 Layout Reference CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "config/layout-11-1-4-reference-v1.json"
      - "fixtures/scenes/11_1_4_soundbar_reference.json"
      - "docs/layout-11-1-4-reference.md"
      - "validation/open-immersive/saf_*"
      - "crates/aurora-renderer-vbap/**"
      - "crates/aurora-simulation-assurance/**"
      - ".github/workflows/layout-11-1-4-reference-ci.yml"

permissions:
  contents: read

concurrency:
  group: layout-11-1-4-reference-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layout-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SAF_COMMIT: 18fd5aba46e20787b51f28f7197a68506c965c07
      SCENE: fixtures/scenes/11_1_4_soundbar_reference.json
      CONFIG: config/layout-11-1-4-reference-v1.json
      OUTPUT: output/layout-11-1-4-reference
    steps:
      - name: Checkout Aurora
        uses: actions/checkout@v4

      - name: Verify declared 11.1.4 research contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          cfg = json.load(open('config/layout-11-1-4-reference-v1.json', encoding='utf-8'))
          assert cfg['layout_id'] == '11.1.4-soundbar-reference'
          assert cfg['classification'] == 'custom-research-layout'
          assert cfg['not_a_standard_claim'] is True
          model = cfg['channel_model']
          assert model['horizontal_channels'] == 11
          assert model['lfe_channels'] == 1
          assert model['top_channels'] == 4
          assert model['total_outputs'] == 16
          assert model['spatial_outputs_excluding_lfe'] == 15
          assert len(model['custom_roles']) == 4
          scene = json.load(open(cfg['fixture'], encoding='utf-8'))
          enabled = [speaker for speaker in scene['speakers'] if speaker['enabled']]
          assert len(enabled) == 16
          assert sum(s['channel_role'] == 'low-frequency-effects' for s in enabled) == 1
          assert sum(s['channel_role'].startswith('top-') for s in enabled) == 4
          roles = {s['channel_role'] for s in enabled}
          assert set(model['custom_roles']).issubset(roles)
          print('AURORA-11-1-4-CONTRACT-PASS')
          PY

      - name: Checkout exact pinned SAF
        uses: actions/checkout@v4
        with:
          repository: leomccormack/Spatial_Audio_Framework
          ref: 18fd5aba46e20787b51f28f7197a68506c965c07
          path: saf
          fetch-depth: 1

      - name: Enforce permissive SAF validation build graph
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C saf rev-parse HEAD)" = "$SAF_COMMIT"
          grep -q "ISC License" saf/LICENSE.md
          grep -q "@license GNU GPLv2" saf/framework/modules/saf_tracker/saf_tracker.c
          grep -q "@license GNU GPLv2" saf/test/src/test__hades_module.c
          git -C saf apply ../validation/open-immersive/saf-permissive-core.patch
          python3 - <<'PY'
          from pathlib import Path
          modules = Path('saf/framework/modules/CMakeLists.txt').read_text(encoding='utf-8')
          tests = Path('saf/test/CMakeLists.txt').read_text(encoding='utf-8')
          assert modules.count('saf_tracker/saf_tracker.c') == 1
          assert 'test__tracker_module.c' not in tests
          assert 'test__hades_module.c' not in tests
          print('SAF-PERMISSIVE-PATCH-PASS')
          PY

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes cmake build-essential libopenblas-dev liblapack-dev liblapacke-dev

      - name: Build pinned permissive SAF core
        shell: bash
        run: |
          set -euo pipefail
          cmake -S saf -B saf-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DSAF_PERFORMANCE_LIB=SAF_USE_OPEN_BLAS_AND_LAPACKE \
            -DSAF_ENABLE_TRACKER_MODULE=OFF \
            -DSAF_ENABLE_HADES_MODULE=OFF \
            -DSAF_ENABLE_SOFA_READER_MODULE=OFF \
            -DSAF_BUILD_TESTS=ON
          python3 - <<'PY'
          import json
          commands = json.load(open('saf-build/compile_commands.json', encoding='utf-8'))
          files = [entry['file'].replace('\\', '/') for entry in commands]
          forbidden = [
              path for path in files
              if '/saf_tracker/' in path
              or '/saf_hades/' in path
              or path.endswith('/test__tracker_module.c')
              or path.endswith('/test__hades_module.c')
          ]
          if forbidden:
              raise SystemExit(f'GPL translation units unexpectedly compiled: {forbidden}')
          print(f'SAF-PERMISSIVE-COMPILE-GRAPH-PASS files={len(files)}')
          PY
          cmake --build saf-build --config Release --parallel 2
          saf-build/test/saf_test
          echo "SAF-PERMISSIVE-BUILD-TEST-PASS"

      - name: Validate Aurora 11.1.4 geometry and renderer invariants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT/aurora-layout"
          cargo run -p aurora-simulation-assurance --release --bin aurora-validate-immersive-layout -- \
            --scene "$SCENE" \
            --output-dir "$OUTPUT/aurora-layout" \
            --duration-seconds 1.0 \
            --sample-rate 48000 \
            --max-gain-step 0.15 \
            --normalization-tolerance 0.001
          python3 - <<'PY'
          import json
          summary = json.load(open('output/layout-11-1-4-reference/aurora-layout/summary.json', encoding='utf-8'))['payload']
          assert summary['passed'] is True
          assert summary['layout'] == '11.1.4-soundbar-reference'
          assert summary['output_channels'] == 16
          assert summary['spatial_channels'] == 15
          assert summary['lfe_channels'] == 1
          assert summary['top_channels'] == 4
          assert summary['custom_role_channels'] == 4
          assert summary['listener_inside_hull'] is True
          assert summary['normalization_failures'] == 0
          assert summary['non_finite_failures'] == 0
          assert summary['lfe_nonzero_frames'] == 0
          print('AURORA-11-1-4-LAYOUT-GATE-PASS')
          PY

      - name: Generate Aurora 11.1.4 VBAP trajectory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT/aurora-differential"
          cargo run -p aurora-simulation-assurance --release --bin aurora-evaluate-vbap3d -- \
            --scene "$SCENE" \
            --output-dir "$OUTPUT/aurora-differential" \
            --duration-seconds 1.0 \
            --sample-rate 48000
          test -s "$OUTPUT/aurora-differential/gain-trajectory.json"

      - name: Prepare identical SAF geometry and directions
        shell: bash
        run: |
          set -euo pipefail
          python3 validation/open-immersive/saf_vbap_reference_evidence.py prepare \
            --scene "$SCENE" \
            --aurora-trajectory "$OUTPUT/aurora-differential/gain-trajectory.json" \
            --speaker-out "$OUTPUT/saf-speakers.txt" \
            --source-out "$OUTPUT/saf-sources.txt" \
            --mapping-out "$OUTPUT/mapping.json"
          python3 - <<'PY'
          import json
          mapping = json.load(open('output/layout-11-1-4-reference/mapping.json', encoding='utf-8'))
          assert len(mapping['spatial_indices']) == 15
          assert len(mapping['lfe_indices']) == 1
          assert len(mapping['spatial_speaker_ids']) == 15
          print('AURORA-11-1-4-SAF-MAPPING-PASS')
          PY

      - name: Build and run SAF VBAP gain probe
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -O2 \
            -I saf/framework/include \
            validation/open-immersive/saf_vbap_reference_probe.c \
            saf-build/framework/libsaf.a \
            -lopenblas -llapacke -latomic -lm \
            -o "$OUTPUT/saf-vbap-probe"
          "$OUTPUT/saf-vbap-probe" \
            "$OUTPUT/saf-speakers.txt" \
            "$OUTPUT/saf-sources.txt" \
            "$OUTPUT/saf-gains.txt"
          test -s "$OUTPUT/saf-gains.txt"

      - name: Compare Aurora and SAF 11.1.4 semantics
        shell: bash
        run: |
          set -euo pipefail
          eval "$(python3 - <<'PY'
          import json
          cfg = json.load(open('config/layout-11-1-4-reference-v1.json', encoding='utf-8'))['saf_reference']
          keys = {
              'MAX_POWER_ERROR': 'max_power_error',
              'LOW_SIMILARITY_THRESHOLD': 'low_similarity_threshold',
              'MAX_LOW_SIMILARITY_FRACTION': 'max_low_similarity_fraction',
              'MIN_MEAN_COSINE_SIMILARITY': 'min_mean_cosine_similarity',
              'MIN_DOMINANT_AGREEMENT': 'min_dominant_speaker_agreement',
              'MAX_MEAN_CENTROID_ERROR_DEG': 'max_mean_centroid_error_deg',
              'MAX_CENTROID_ERROR_DEG': 'max_centroid_error_deg',
              'MAX_MEAN_HEIGHT_ENERGY_DELTA': 'max_mean_height_energy_delta',
              'MAX_HEIGHT_ENERGY_DELTA': 'max_height_energy_delta',
          }
          for shell_key, json_key in keys.items():
              print(f'{shell_key}={cfg[json_key]}')
          PY
          )"
          python3 validation/open-immersive/saf_vbap_reference_evidence.py compare \
            --aurora-trajectory "$OUTPUT/aurora-differential/gain-trajectory.json" \
            --mapping "$OUTPUT/mapping.json" \
            --saf-gains "$OUTPUT/saf-gains.txt" \
            --output "$OUTPUT/differential-summary.json" \
            --max-power-error "$MAX_POWER_ERROR" \
            --low-similarity-threshold "$LOW_SIMILARITY_THRESHOLD" \
            --max-low-similarity-fraction "$MAX_LOW_SIMILARITY_FRACTION" \
            --min-mean-cosine-similarity "$MIN_MEAN_COSINE_SIMILARITY" \
            --min-dominant-agreement "$MIN_DOMINANT_AGREEMENT" \
            --max-mean-centroid-error-deg "$MAX_MEAN_CENTROID_ERROR_DEG" \
            --max-centroid-error-deg "$MAX_CENTROID_ERROR_DEG" \
            --max-mean-height-energy-delta "$MAX_MEAN_HEIGHT_ENERGY_DELTA" \
            --max-height-energy-delta "$MAX_HEIGHT_ENERGY_DELTA"
          python3 - <<'PY'
          import json
          path = 'output/layout-11-1-4-reference/differential-summary.json'
          data = json.load(open(path, encoding='utf-8'))
          assert data['passed'] is True
          assert data['metrics']['spatial_speaker_count'] == 15
          data['scene'] = 'fixtures/scenes/11_1_4_soundbar_reference.json'
          data['layout'] = '11.1.4-soundbar-reference'
          data['truth_boundary'] = (
              'Software-only differential for Aurora custom 11.1.4 soundbar-oriented research geometry '
              'against pinned SAF 3D VBAP. This is not a standardized Dolby/DTS/Samsung/ITU channel-role claim '
              'and does not establish physical acoustics, reflected up-firing behavior, wireless synchronization, '
              'proprietary-renderer equivalence, or certification.'
          )
          with open(path, 'w', encoding='utf-8') as handle:
              json.dump(data, handle, indent=2, sort_keys=True)
              handle.write('\n')
          print('AURORA-SAF-11-1-4-DIFFERENTIAL-PASS')
          PY

      - name: Emit 11.1.4 evidence manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib
          fixture = pathlib.Path('fixtures/scenes/11_1_4_soundbar_reference.json')
          config = pathlib.Path('config/layout-11-1-4-reference-v1.json')
          diff = json.load(open('output/layout-11-1-4-reference/differential-summary.json', encoding='utf-8'))
          layout = json.load(open('output/layout-11-1-4-reference/aurora-layout/summary.json', encoding='utf-8'))['payload']
          evidence = {
              'schema_version': 1,
              'layout': '11.1.4-soundbar-reference',
              'aurora_sha': '${{ github.sha }}',
              'saf_commit': '18fd5aba46e20787b51f28f7197a68506c965c07',
              'fixture_sha256': hashlib.sha256(fixture.read_bytes()).hexdigest(),
              'config_sha256': hashlib.sha256(config.read_bytes()).hexdigest(),
              'output_channels': layout['output_channels'],
              'spatial_channels': layout['spatial_channels'],
              'validated_triplets': layout['validated_triplets'],
              'aurora_layout_passed': layout['passed'],
              'saf_differential_passed': diff['passed'],
              'differential_metrics': diff['metrics'],
              'status': 'REFERENCE-VALIDATED',
              'truth_boundary': 'Reference-validated only for this exact custom research fixture and exact SAF pin; physical soundbar behavior remains PHYSICAL-PENDING.'
          }
          pathlib.Path('output/layout-11-1-4-reference/evidence-manifest.json').write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(evidence, indent=2, sort_keys=True))
          PY

      - name: Upload 11.1.4 reference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-11-1-4-reference-${{ github.sha }}
          path: output/layout-11-1-4-reference/**
          if-no-files-found: error
          retention-days: 14
