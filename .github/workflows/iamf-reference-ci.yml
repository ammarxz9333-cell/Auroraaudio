name: IAMF Rendered PCM Reference CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/aurora-decoder-iamf/**"
      - "config/iamf-reference-v1.json"
      - "validation/open-immersive/iamf_reference_evidence.py"
      - ".github/workflows/iamf-reference-ci.yml"
      - "config/external-components-v1.json"
      - "config/simulation-coverage-v1.json"
      - "AGENTS.md"

permissions:
  contents: read

concurrency:
  group: iamf-reference-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rendered-pcm-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install libiamf build tooling
        run: sudo apt-get update && sudo apt-get install --yes cmake ninja-build git curl

      - name: Self-test IAMF evidence analyzer
        run: python3 validation/open-immersive/iamf_reference_evidence.py self-test

      - name: Test Aurora IAMF reference adapter boundary
        run: cargo test -p aurora-decoder-iamf --all-features --locked

      - name: Fetch exact pinned IAMF references
        shell: bash
        run: |
          set -euo pipefail
          LIBIAMF_COMMIT="$(python3 -c 'import json; print(json.load(open("config/iamf-reference-v1.json"))["libiamf"]["commit"])')"
          OAR_COMMIT="$(python3 -c 'import json; print(json.load(open("config/iamf-reference-v1.json"))["libiamf"]["oar_submodule_commit"])')"
          IAMF_TOOLS_COMMIT="$(python3 -c 'import json; print(json.load(open("config/iamf-reference-v1.json"))["fixture_source"]["commit"])')"
          FIXTURE_REL="$(python3 -c 'import json; print(json.load(open("config/iamf-reference-v1.json"))["fixture_source"]["fixture"])')"

          LIBIAMF="${RUNNER_TEMP}/libiamf"
          mkdir -p "${LIBIAMF}"
          git -C "${LIBIAMF}" init
          git -C "${LIBIAMF}" remote add origin https://github.com/AOMediaCodec/libiamf.git
          git -C "${LIBIAMF}" sparse-checkout init --cone
          git -C "${LIBIAMF}" sparse-checkout set code .gitmodules LICENSE PATENTS
          git -C "${LIBIAMF}" fetch --depth=1 --filter=blob:none origin "${LIBIAMF_COMMIT}"
          git -C "${LIBIAMF}" checkout --detach FETCH_HEAD
          test "$(git -C "${LIBIAMF}" rev-parse HEAD)" = "${LIBIAMF_COMMIT}"
          git -C "${LIBIAMF}" submodule update --init --recursive --depth 1 code/dep_external/src/oar
          test "$(git -C "${LIBIAMF}/code/dep_external/src/oar" rev-parse HEAD)" = "${OAR_COMMIT}"
          test -f "${LIBIAMF}/LICENSE"
          test -f "${LIBIAMF}/PATENTS"

          FIXTURE="${RUNNER_TEMP}/official.iamf"
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/AOMediaCodec/iamf-tools/${IAMF_TOOLS_COMMIT}/${FIXTURE_REL}" \
            --output "${FIXTURE}"
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/AOMediaCodec/iamf-tools/${IAMF_TOOLS_COMMIT}/LICENSE" \
            --output "${RUNNER_TEMP}/iamf-tools-LICENSE"
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/AOMediaCodec/iamf-tools/${IAMF_TOOLS_COMMIT}/PATENTS" \
            --output "${RUNNER_TEMP}/iamf-tools-PATENTS"
          test -s "${FIXTURE}"
          test -s "${RUNNER_TEMP}/iamf-tools-LICENSE"
          test -s "${RUNNER_TEMP}/iamf-tools-PATENTS"
          printf '%s\n' "IAMF_FIXTURE=${FIXTURE}" >> "${GITHUB_ENV}"

      - name: Build exact pinned libiamf iamfdec
        shell: bash
        run: |
          set -euo pipefail
          cmake -S "${RUNNER_TEMP}/libiamf/code" -B "${RUNNER_TEMP}/libiamf-build" -G Ninja \
            -DIAMF_TEST_TOOL=ON \
            -DIAMF_ENABLE_BINAURALIZER=OFF
          cmake --build "${RUNNER_TEMP}/libiamf-build" --target iamfdec --parallel 2
          IAMFDEC="$(find "${RUNNER_TEMP}/libiamf-build" -type f -name iamfdec -perm -111 -print -quit)"
          test -n "${IAMFDEC}"
          printf '%s\n' "IAMFDEC=${IAMFDEC}" >> "${GITHUB_ENV}"

      - name: Decode official IAMF fixture directly and through Aurora
        shell: bash
        run: |
          set -euo pipefail
          DIRECT_WAV="${RUNNER_TEMP}/iamf-direct.wav"
          ADAPTER_F32="${RUNNER_TEMP}/iamf-adapter.f32le"
          REPORT="${RUNNER_TEMP}/iamf-reference-evidence.json"
          "${IAMFDEC}" -o3 "${DIRECT_WAV}" -s0 -r 48000 -d 32 "${IAMF_FIXTURE}"
          test -s "${DIRECT_WAV}"
          cargo run --quiet --locked -p aurora-decoder-iamf \
            --features libiamf-process \
            --example iamf_rendered_pcm_probe -- \
            "${IAMFDEC}" "${IAMF_FIXTURE}" "${ADAPTER_F32}"
          test -s "${ADAPTER_F32}"
          python3 validation/open-immersive/iamf_reference_evidence.py \
            "${DIRECT_WAV}" "${ADAPTER_F32}" "${REPORT}"
          cat "${REPORT}"

      - name: Upload IAMF rendered PCM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iamf-rendered-pcm-${{ github.sha }}
          path: ${{ runner.temp }}/iamf-reference-evidence.json
          if-no-files-found: warn
          retention-days: 14
