name: JOCForge Reference CI

on:
  pull_request:
    paths:
      - ".github/workflows/jocforge-reference-ci.yml"
      - "config/external-components-v1.json"
      - "config/jocforge-reference-v1.json"
      - "config/jocforge-smoke-vectors-v1.json"
      - "docs/jocforge-reference.md"
      - "THIRD_PARTY_LICENSES.md"
      - "validation/open-immersive/jocforge_reference_evidence.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jocforge-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Aurora
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg

      - name: Checkout pinned JOCForge
        uses: actions/checkout@v4
        with:
          repository: chyinan/JOCForge
          ref: 05a4108e0c6288130dec1203b301979a91475fca
          path: external/JOCForge
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable pin and Aurora registry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C external/JOCForge rev-parse HEAD)" = "05a4108e0c6288130dec1203b301979a91475fca"
          python3 scripts/check_external_components.py
          python3 -m json.tool config/jocforge-reference-v1.json >/dev/null
          python3 -m json.tool config/jocforge-smoke-vectors-v1.json >/dev/null

      - name: Build and test pinned JOCForge
        working-directory: external/JOCForge
        run: |
          cargo check --workspace --locked
          cargo test --workspace --locked

      - name: Generate representative fourteen-vector corpus
        working-directory: external/JOCForge
        shell: bash
        run: |
          set -euo pipefail
          OUT=artifacts/aurora-smoke
          mkdir -p "$OUT"

          cargo run -p jocforge --locked -- fixture --seconds 1 "$OUT/synthetic-reference.bw64"

          # Five public-profile source-derived encodes.
          cargo run -p jocforge --locked -- encode "$OUT/synthetic-reference.bw64" "$OUT/idx0.ec3" --profile idx0
          cargo run -p jocforge --locked -- encode "$OUT/synthetic-reference.bw64" "$OUT/idx1.ec3" --profile idx1
          cargo run -p jocforge --locked -- encode "$OUT/synthetic-reference.bw64" "$OUT/idx2.ec3" --profile idx2
          cargo run -p jocforge --locked -- encode "$OUT/synthetic-reference.bw64" "$OUT/idx3.ec3" --profile "5.X Phase"
          cargo run -p jocforge --locked -- encode "$OUT/synthetic-reference.bw64" "$OUT/idx4.ec3" --profile "5.X+2 Phase"

          # Block-partition structural probes.
          cargo run -p jocforge --locked -- conformance-short idx0 6 "$OUT/partition-6.ec3"
          cargo run -p jocforge --locked -- conformance-short idx0 3+3 "$OUT/partition-3x3.ec3"
          cargo run -p jocforge --locked -- conformance-short idx0 2+2+2 "$OUT/partition-2x3.ec3"
          cargo run -p jocforge --locked -- conformance-short idx0 1+1+1+1+1+1 "$OUT/partition-1x6.ec3"

          # Dependent-substream, EMDF, and LFE ownership probes.
          cargo run -p jocforge --locked -- conformance-multi-dependent idx1 2 "$OUT/multi-dependent-2.ec3"
          cargo run -p jocforge --locked -- conformance-short-multi-dependent idx0 1 3+3 "$OUT/short-multi-deployed.ec3" --emdf deployed --lfe absent
          cargo run -p jocforge --locked -- conformance-short-multi-dependent idx0 1 2+2+2 "$OUT/independent-lfe.ec3" --emdf etsi --lfe independent
          cargo run -p jocforge --locked -- conformance-dependent-lfe idx0 1 "$OUT/dependent-lfe-supplement.ec3"
          cargo run -p jocforge --locked -- conformance-dependent-lfe idx0 1 "$OUT/dependent-lfe-replacement.ec3" --replacement

          python3 ../../validation/open-immersive/jocforge_reference_evidence.py \
            --fixture-dir "$OUT" \
            --vector-manifest ../../config/jocforge-smoke-vectors-v1.json \
            --output ../../output/evaluation/jocforge-reference-summary.json \
            --generator-commit 05a4108e0c6288130dec1203b301979a91475fca

      - name: Verify generated stream parseability
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess

          manifest = json.loads(pathlib.Path('config/jocforge-smoke-vectors-v1.json').read_text())
          root = pathlib.Path('external/JOCForge/artifacts/aurora-smoke')
          for vector in manifest['vectors']:
              path = root / vector['output']
              if not path.is_file() or path.stat().st_size <= 0:
                  raise SystemExit(f"missing or empty vector: {path}")
              subprocess.run(
                  ['ffprobe', '-v', 'error', '-show_entries', 'stream=codec_name,sample_rate,channels', '-of', 'json', str(path)],
                  check=True,
                  stdout=subprocess.DEVNULL,
              )
          PY

      - name: Show deterministic Aurora evidence summary
        run: cat output/evaluation/jocforge-reference-summary.json

      - name: Upload JOCForge evidence
        uses: actions/upload-artifact@v4
        with:
          name: jocforge-reference-${{ github.sha }}
          path: |
            output/evaluation/jocforge-reference-summary.json
            config/jocforge-reference-v1.json
            config/jocforge-smoke-vectors-v1.json
          retention-days: 14
