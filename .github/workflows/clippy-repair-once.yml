name: Temporary Clippy Repair

on:
  push:
    branches:
      - software-completion

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout software-completion
        uses: actions/checkout@v4
        with:
          ref: software-completion
          fetch-depth: 0

      - name: Remove constant-value test assertion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/aurora-decoder-iamf/src/lib.rs')
          text = path.read_text()
          needle = '        assert!(!IAMF_OBJECT_SCENE_AVAILABLE);\n'
          if text.count(needle) != 1:
              raise SystemExit(f'expected exactly one constant assertion, found {text.count(needle)}')
          path.write_text(text.replace(needle, '', 1))
          PY

      - name: Format
        run: cargo fmt --all

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/aurora-decoder-iamf/src/lib.rs
          git commit -m "test: remove constant IAMF capability assertion"
          git push origin HEAD:software-completion
