name: Temporary Clippy Fix Head Tracker

on:
  push:
    branches:
      - head-tracker-delivery-sim-v1
    paths:
      - '.github/workflows/temp-clippy-fix-head-tracker.yml'

permissions:
  contents: write

jobs:
  clippy-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: head-tracker-delivery-sim-v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Install Linux audio build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Apply machine-applicable clippy fixes
        run: cargo clippy --fix --workspace --all-targets --all-features --allow-dirty --allow-staged
      - name: Apply canonical rustfmt
        run: cargo fmt --all
      - name: Commit fixes if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No machine-applicable clippy fixes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "Apply clippy fixes for tracker simulation"
          git push origin HEAD:head-tracker-delivery-sim-v1
