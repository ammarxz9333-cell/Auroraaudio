name: Temporary Clippy Diagnose Head Tracker

on:
  push:
    branches:
      - head-tracker-delivery-sim-v1
    paths:
      - '.github/workflows/temp-clippy-fix-head-tracker.yml'

permissions:
  contents: write

jobs:
  clippy-diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: head-tracker-delivery-sim-v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install Linux audio build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Capture strict clippy output
        shell: bash
        run: |
          set +e
          cargo clippy --workspace --all-targets --all-features -- -D warnings > tmp-clippy-output.txt 2>&1
          status=$?
          echo "exit_status=$status" >> tmp-clippy-output.txt
          exit 0
      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-clippy-output.txt
          git commit -m "Capture clippy diagnostic"
          git push origin HEAD:head-tracker-delivery-sim-v1
