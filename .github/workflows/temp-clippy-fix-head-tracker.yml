name: Temporary Clippy Diagnose Head Tracker

on:
  push:
    branches:
      - head-tracker-delivery-sim-v1
    paths:
      - '.github/workflows/temp-clippy-fix-head-tracker.yml'

permissions:
  contents: read

jobs:
  clippy-diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: head-tracker-delivery-sim-v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install Linux audio build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Capture strict clippy output
        shell: bash
        run: |
          set +e
          cargo clippy --workspace --all-targets --all-features -- -D warnings > clippy-output.txt 2>&1
          status=$?
          echo "exit_status=$status" >> clippy-output.txt
          exit 0
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: head-tracker-clippy-output
          path: clippy-output.txt
          if-no-files-found: error
          retention-days: 1
