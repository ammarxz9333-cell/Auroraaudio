name: Market Radar Council Learning

on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * 1-5"
  pull_request:
    paths:
      - "market-radar/council_memory.py"
      - "market-radar/test_council_memory.py"
      - "market-radar/council_prediction.schema.json"

permissions:
  contents: write

jobs:
  test-and-rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile market-radar/council_memory.py market-radar/test_council_memory.py
      - name: Run council memory tests
        run: |
          python - <<'PY'
          import importlib.util, pathlib
          p=pathlib.Path("market-radar/test_council_memory.py")
          spec=importlib.util.spec_from_file_location("t",p); m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          for name in sorted(x for x in dir(m) if x.startswith("test_")):
              getattr(m,name)()
              print("PASS",name)
          PY
      - name: Rebuild learning state
        if: github.event_name != 'pull_request'
        run: python market-radar/council_memory.py rebuild
      - name: Persist changed learning state
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- market-radar/learning/council-state.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-radar/learning/council-state.json
          git commit -m "chore(market-radar): rebuild council learning state"
          git push
