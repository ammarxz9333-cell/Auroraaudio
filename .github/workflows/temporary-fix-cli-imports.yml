name: Temporary CLI clippy fix

on:
  push:
    branches:
      - refactor/runtime-materialize-delay-v1

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[cli-import-fix-bot]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/runtime-materialize-delay-v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux audio build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Remove stale CLI engine imports
        shell: python
        run: |
          from pathlib import Path
          replacements = {
              Path('crates/aurora-cli/src/main.rs'): (
                  '    identify_roles, ProcessStatus, RealTimeEngine, RealTimeEngineConfig, RealTimeFault,\n    RealTimeMetrics, TestSignal,\n',
                  '    identify_roles, ProcessStatus, RealTimeEngineConfig, RealTimeFault, RealTimeMetrics,\n    TestSignal,\n',
              ),
              Path('crates/aurora-cli/src/realtime_commands.rs'): (
                  '    ProcessStatus, RealTimeEngine, RealTimeEngineConfig, RubatoAsrc, TestSignal,\n',
                  '    ProcessStatus, RealTimeEngineConfig, RubatoAsrc, TestSignal,\n',
              ),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'{path}: stale import anchor missing')
              path.write_text(text.replace(old, new, 1))
      - name: Format and verify CLI clippy
        run: |
          cargo fmt --all
          cargo clippy -p aurora-cli --all-targets --all-features -- -D warnings
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/aurora-cli/src/main.rs crates/aurora-cli/src/realtime_commands.rs
          git commit -m "Remove stale CLI realtime engine imports [cli-import-fix-bot]"
          git push origin HEAD:refactor/runtime-materialize-delay-v1
