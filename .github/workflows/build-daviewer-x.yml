name: Build DAViewer X APK

on:
  push:
    branches: [daviewer-x-apk-build]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Prepare DAViewer X
        shell: bash
        run: bash daviewer_x_build/prepare.sh
      - name: Dependencies
        working-directory: daviewer
        run: flutter pub get
      - name: Build debug APK
        working-directory: daviewer
        run: flutter build apk --debug
      - name: Stage APK
        run: |
          cp daviewer/build/app/outputs/flutter-apk/app-debug.apk DAViewer-X-v0.1-debug.apk
          sha256sum DAViewer-X-v0.1-debug.apk > DAViewer-X-v0.1-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: DAViewer-X-v0.1-debug
          path: |
            DAViewer-X-v0.1-debug.apk
            DAViewer-X-v0.1-debug.apk.sha256
          if-no-files-found: error
