name: Build DAViewer X APK

on:
  push:
    branches:
      - daviewer-x-apk-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Decode DAViewer X sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p daviewerx_android/app/src/main/java/com/ammar/daviewerx
          mkdir -p daviewerx_android/app/src/main/assets
          base64 -d daviewerx_android/MainActivity.java.b64 > daviewerx_android/app/src/main/java/com/ammar/daviewerx/MainActivity.java
          base64 -d daviewerx_android/index.html.b64 > daviewerx_android/app/src/main/assets/index.html
      - name: Build debug APK
        run: gradle -p daviewerx_android :app:assembleDebug --no-daemon --stacktrace
      - name: Prepare artifact
        shell: bash
        run: |
          cp daviewerx_android/app/build/outputs/apk/debug/app-debug.apk DAViewer-X-v0.1-debug.apk
          sha256sum DAViewer-X-v0.1-debug.apk > DAViewer-X-v0.1-debug.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: DAViewer-X-v0.1-debug
          path: |
            DAViewer-X-v0.1-debug.apk
            DAViewer-X-v0.1-debug.sha256
          if-no-files-found: error
