name: Direct eARC Private CI

on:
  push:
    branches:
      - feature/direct-earc-linux-ingest
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/aurora-iec61937/**"
      - "crates/aurora-decoder-open/**"
      - "crates/aurora-decoder-engine/**"
      - "crates/aurora-direct-earc-decoder/**"
      - "crates/aurora-encoded-input/**"
      - "crates/aurora-encoded-runtime/**"
      - "crates/aurora-alsa-input/**"
      - "crates/aurora-alsa-output/**"
      - "crates/aurora-dsp-basic/**"
      - "crates/aurora-spatial-runtime/**"
      - "crates/aurora-cli/Cargo.toml"
      - "crates/aurora-cli/src/bin/aurora-direct-earc-ingest.rs"
      - "crates/aurora-cli/src/bin/aurora-direct-earc-probe.rs"
      - "crates/aurora-cli/src/bin/aurora-encoded-runtime.rs"
      - ".github/workflows/direct-earc-private-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: direct-earc-private-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  AURORA_RUST_TOOLCHAIN: "1.85.0-x86_64-pc-windows-gnu"

defaults:
  run:
    shell: powershell

jobs:
  direct-earc-windows:
    if: github.actor == github.repository_owner
    runs-on: [self-hosted, Windows, X64, aurora-private-ci]
    timeout-minutes: 25
    steps:
      - name: Configure verified portable GNU linker tools
        run: |
          if (-not (Test-Path -LiteralPath $env:AURORA_LLVM_MINGW_BIN)) {
            throw "AURORA_LLVM_MINGW_BIN is not configured on this runner."
          }
          Add-Content -Path $env:GITHUB_PATH -Value $env:AURORA_LLVM_MINGW_BIN

      - name: Check out exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Provision exact GNU Rust toolchain
        run: >-
          rustup toolchain install $env:AURORA_RUST_TOOLCHAIN
          --profile minimal --component rustfmt,clippy

      - name: Verify committed workspace lockfile
        run: |
          cargo +$env:AURORA_RUST_TOOLCHAIN metadata --format-version 1 --locked | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Cargo.lock is stale or incomplete; regenerate and commit the exact dependency graph."
            exit $LASTEXITCODE
          }

      - name: Verify direct eARC formatting
        run: >-
          cargo +$env:AURORA_RUST_TOOLCHAIN fmt
          --package aurora-iec61937
          --package aurora-decoder-open
          --package aurora-decoder-engine
          --package aurora-direct-earc-decoder
          --package aurora-encoded-input
          --package aurora-encoded-runtime
          --package aurora-alsa-input
          --package aurora-alsa-output
          --package aurora-cli
          -- --check

      - name: Check and test reusable IEC61937 parser
        run: |
          cargo +$env:AURORA_RUST_TOOLCHAIN check --locked -p aurora-iec61937 --all-targets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +$env:AURORA_RUST_TOOLCHAIN test --locked -p aurora-iec61937
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +$env:AURORA_RUST_TOOLCHAIN clippy --locked -p aurora-iec61937 --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check and test open AC3 EAC3 JOC decoder adapter
        run: |
          cargo +$env:AURORA_RUST_TOOLCHAIN check --locked -p aurora-decoder-open --all-targets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +$env:AURORA_RUST_TOOLCHAIN test --locked -p aurora-decoder-open
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +$env:AURORA_RUST_TOOLCHAIN clippy --locked -p aurora-decoder-open --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check and test decoder engine lifecycle
        run: |
          cargo +$env:AURORA_RUST_TOOLCHAIN check --locked -p aurora-decoder-engine --all-targets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +$env:AURORA_RUST_TOOLCHAIN test --locked -p aurora-decoder-engine
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +$env:AURORA_RUST_TOOLCHAIN clippy --locked -p aurora-decoder-engine --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check and test direct eARC decoder bridge
        run: |
          cargo +$env:AURORA_RUST_TOOLCHAIN check --locked -p aurora-direct-earc-decoder --all-targets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +$env:AURORA_RUST_TOOLCHAIN test --locked -p aurora-direct-earc-decoder
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +$env:AURORA_RUST_TOOLCHAIN clippy --locked -p aurora-direct-earc-decoder --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check and test unified encoded input selector
        run: |
          cargo +$env:AURORA_RUST_TOOLCHAIN check --locked -p aurora-encoded-input --all-targets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +$env:AURORA_RUST_TOOLCHAIN test --locked -p aurora-encoded-input
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +$env:AURORA_RUST_TOOLCHAIN clippy --locked -p aurora-encoded-input --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check and test unified encoded runtime
        run: |
          cargo +$env:AURORA_RUST_TOOLCHAIN check --locked -p aurora-encoded-runtime --all-targets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +$env:AURORA_RUST_TOOLCHAIN test --locked -p aurora-encoded-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +$env:AURORA_RUST_TOOLCHAIN clippy --locked -p aurora-encoded-runtime --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check and test native ALSA input portability layer
        run: |
          cargo +$env:AURORA_RUST_TOOLCHAIN check --locked -p aurora-alsa-input --all-targets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +$env:AURORA_RUST_TOOLCHAIN test --locked -p aurora-alsa-input
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +$env:AURORA_RUST_TOOLCHAIN clippy --locked -p aurora-alsa-input --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check and test native ALSA output portability layer
        run: |
          cargo +$env:AURORA_RUST_TOOLCHAIN check --locked -p aurora-alsa-output --all-targets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +$env:AURORA_RUST_TOOLCHAIN test --locked -p aurora-alsa-output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +$env:AURORA_RUST_TOOLCHAIN clippy --locked -p aurora-alsa-output --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check and test direct eARC binaries
        run: |
          cargo +$env:AURORA_RUST_TOOLCHAIN check --locked -p aurora-cli --bin aurora-direct-earc-ingest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +$env:AURORA_RUST_TOOLCHAIN test --locked -p aurora-cli --bin aurora-direct-earc-ingest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +$env:AURORA_RUST_TOOLCHAIN clippy --locked -p aurora-cli --bin aurora-direct-earc-ingest -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +$env:AURORA_RUST_TOOLCHAIN check --locked -p aurora-cli --bin aurora-direct-earc-probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +$env:AURORA_RUST_TOOLCHAIN test --locked -p aurora-cli --bin aurora-direct-earc-probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +$env:AURORA_RUST_TOOLCHAIN clippy --locked -p aurora-cli --bin aurora-direct-earc-probe -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +$env:AURORA_RUST_TOOLCHAIN check --locked -p aurora-cli --features encoded-runtime --bin aurora-encoded-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +$env:AURORA_RUST_TOOLCHAIN test --locked -p aurora-cli --features encoded-runtime --bin aurora-encoded-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +$env:AURORA_RUST_TOOLCHAIN clippy --locked -p aurora-cli --features encoded-runtime --bin aurora-encoded-runtime -- -D warnings
