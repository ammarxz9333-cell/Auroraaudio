name: Temporary renderer boundary discovery

on:
  push:
    branches:
      - refactor/runtime-materialize-renderer-v1

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/runtime-materialize-renderer-v1
      - name: Renderer coupling inventory
        shell: bash
        run: |
          set -euo pipefail
          echo '=== BasicRenderer references ==='
          grep -RIn --exclude-dir=target --exclude='temporary-renderer-boundary-discovery.yml' -E 'BasicRenderer|BasicRendererMode|renderer_mode|aurora-renderer-basic' crates Cargo.toml Cargo.lock docs || true
          echo '=== realtime engine constructors ==='
          grep -RIn --exclude-dir=target -E 'new_with_prepared_delay_processor|materialize_default_realtime_engine|RealTimeEngineConfig \{' crates || true
