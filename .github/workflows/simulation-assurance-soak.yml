name: Simulation Assurance Manual Soak

on:
  workflow_dispatch:
    inputs:
      hours:
        description: Accelerated duration represented by each profile
        required: true
        default: "24"
        type: choice
        options:
          - "24"
          - "168"
          - "720"
      start_seed:
        description: First deterministic campaign seed
        required: true
        default: 0
        type: number

permissions:
  contents: read

concurrency:
  group: simulation-assurance-soak
  cancel-in-progress: false

jobs:
  campaign:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-assurance-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-assurance-
            ${{ runner.os }}-cargo-
      - name: Run accelerated deterministic soak profile
        run: >-
          cargo run --release -p aurora-simulation-assurance --
          --level soak --scenarios 4 --soak-hours ${{ inputs.hours }}
          --start-seed ${{ inputs.start_seed }}
          --shard-index ${{ matrix.shard }} --shard-count 4
          --report output/simulation-assurance/soak-${{ inputs.hours }}h-${{ matrix.shard }}.json
      - name: Upload bounded soak report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-assurance-soak-${{ inputs.hours }}h-${{ matrix.shard }}
          path: output/simulation-assurance/**/*.json
          if-no-files-found: error

