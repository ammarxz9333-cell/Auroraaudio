[package]
name = "aurora-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "aurora-cli"
path = "src/main.rs"
bench = false

[[bin]]
name = "aurora-evaluate-renderer"
path = "src/bin/aurora-evaluate-renderer.rs"
bench = false

[[bin]]
name = "aurora-s6-postprocess"
path = "src/bin/aurora-s6-postprocess.rs"
bench = false
required-features = ["realtime"]

[[bin]]
name = "aurora-direct-earc-ingest"
path = "src/bin/aurora-direct-earc-ingest.rs"
bench = false

[[bin]]
name = "aurora-direct-earc-probe"
path = "src/bin/aurora-direct-earc-probe.rs"
bench = false

[[bin]]
name = "aurora-sim-source"
path = "src/bin/aurora-direct-earc-sim.rs"
bench = false
required-features = ["earc-sim"]

[[bin]]
name = "aurora-sim"
path = "src/bin/aurora-sim.rs"
bench = false
required-features = ["validation"]

[[bin]]
name = "aurora-encoded-runtime"
path = "src/bin/aurora-encoded-runtime.rs"
bench = false
required-features = ["encoded-runtime"]

[features]
default = ["camilladsp", "realtime", "simulation"]
camilladsp = ["dep:aurora-dsp-camilladsp", "aurora-dsp-camilladsp/camilladsp-process"]
earc-sim = ["dep:aurora-sim-source"]
encoded-runtime = ["dep:aurora-alsa-input", "dep:aurora-alsa-output", "dep:aurora-decoder-engine", "dep:aurora-encoded-input", "dep:aurora-encoded-runtime"]
validation = ["earc-sim", "encoded-runtime"]
realtime = ["dep:aurora-realtime-audio-api", "dep:aurora-realtime-audio-cpal", "dep:aurora-realtime-engine"]
simulation = ["dep:aurora-realtime-audio-sim", "dep:aurora-realtime-engine"]

[dependencies]
anyhow.workspace = true
aurora-alsa-input = { path = "../aurora-alsa-input", optional = true }
aurora-alsa-output = { path = "../aurora-alsa-output", optional = true }
aurora-audio-io = { path = "../aurora-audio-io" }
aurora-core = { path = "../aurora-core" }
aurora-decoder-api = { path = "../aurora-decoder-api" }
aurora-decoder-engine = { path = "../aurora-decoder-engine", optional = true }
aurora-dsp-basic = { path = "../aurora-dsp-basic" }
aurora-dsp-camilladsp = { path = "../aurora-dsp-camilladsp", optional = true }
aurora-encoded-input = { path = "../aurora-encoded-input", optional = true }
aurora-encoded-runtime = { path = "../aurora-encoded-runtime", optional = true }
aurora-iec61937 = { path = "../aurora-iec61937" }
aurora-renderer-api = { path = "../aurora-renderer-api" }
aurora-renderer-basic = { path = "../aurora-renderer-basic" }
aurora-realtime-audio-api = { path = "../aurora-realtime-audio-api", optional = true }
aurora-realtime-audio-cpal = { path = "../aurora-realtime-audio-cpal", optional = true }
aurora-realtime-audio-sim = { path = "../aurora-realtime-audio-sim", optional = true }
aurora-realtime-engine = { path = "../aurora-realtime-engine", optional = true }
aurora-scene = { path = "../aurora-scene" }
aurora-sim-source = { path = "../aurora-sim-source", optional = true }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
aurora-test-alloc = { path = "../aurora-test-alloc" }
