[package]
name = "aurora-decoder-mpegh"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
build = "build.rs"

[features]
default = []
native-mpegh = ["dep:libc"]

[dependencies]
aurora-core = { path = "../aurora-core" }
aurora-decoder-api = { path = "../aurora-decoder-api" }
aurora-hoa-ir = { path = "../aurora-hoa-ir" }
aurora-spatial-ir-v2 = { path = "../aurora-spatial-ir-v2" }
aurora-spatial-transport-v2 = { path = "../aurora-spatial-transport-v2" }
libc = { version = "0.2", optional = true }
thiserror.workspace = true
