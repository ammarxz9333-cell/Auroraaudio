[workspace]
members = [
    "crates/aurora-test-alloc",
    "crates/aurora-core",
    "crates/aurora-scene",
    "crates/aurora-renderer-api",
    "crates/aurora-renderer-basic",
    "crates/aurora-renderer-vbap",
    "crates/aurora-renderer-cavern",
    "crates/aurora-renderer-hoa",
    "crates/aurora-decoder-api",
    "crates/aurora-spatial-ir",
    "crates/aurora-spatial-ir-v2",
    "crates/aurora-spatial-transport-v2",
    "crates/aurora-hoa-ir",
    "crates/aurora-decoder-open",
    "crates/aurora-decoder-engine",
    "crates/aurora-direct-earc-decoder",
    "crates/aurora-decoder-iamf",
    "crates/aurora-decoder-truehdd",
    "crates/aurora-decoder-mpegh",
    "crates/aurora-super-decoder",
    "crates/aurora-spatial-runtime",
    "crates/aurora-spatial-runtime-v2",
    "crates/aurora-dsp-api",
    "crates/aurora-dsp-basic",
    "crates/aurora-dsp-camilladsp",
    "crates/aurora-audio-io",
    "crates/aurora-iec61937",
    "crates/aurora-sim-source",
    "crates/aurora-encoded-input",
    "crates/aurora-encoded-runtime",
    "crates/aurora-speaker-output",
    "crates/aurora-alsa-input",
    "crates/aurora-alsa-output",
    "crates/aurora-realtime-audio-api",
    "crates/aurora-realtime-audio-cpal",
    "crates/aurora-realtime-audio-sim",
    "crates/aurora-simulation-assurance",
    "crates/aurora-diagnostics",
    "crates/aurora-config",
    "crates/aurora-runtime-assembly",
    "crates/aurora-runtime-inspection",
    "crates/aurora-realtime-engine",
    "crates/aurora-measurement",
    "crates/aurora-cli",
]
exclude = ["crates/aurora-usb-protocol"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/ammarxz9333-cell/Auroraaudio"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
clap = { version = "=4.5.53", features = ["derive"] }
cpal = "0.15"
criterion = "0.5"
crossbeam-queue = "0.3"
rubato = { version = "0.16.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"