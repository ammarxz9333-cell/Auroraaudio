[workspace]
members = [
    "crates/aurora-core",
    "crates/aurora-scene",
    "crates/aurora-renderer-api",
    "crates/aurora-renderer-basic",
    "crates/aurora-renderer-vbap",
    "crates/aurora-renderer-vbap3d",
    "crates/aurora-decoder-api",
    "crates/aurora-decoder-iamf",
    "crates/aurora-dsp-api",
    "crates/aurora-dsp-basic",
    "crates/aurora-dsp-output",
    "crates/aurora-dsp-camilladsp",
    "crates/aurora-audio-io",
    "crates/aurora-realtime-audio-api",
    "crates/aurora-realtime-audio-cpal",
    "crates/aurora-realtime-audio-sim",
    "crates/aurora-simulation-assurance",
    "crates/aurora-diagnostics",
    "crates/aurora-config",
    "crates/aurora-runtime-assembly",
    "crates/aurora-runtime-inspection",
    "crates/aurora-evaluation",
    "crates/aurora-realtime-engine",
    "crates/aurora-measurement",
    "crates/aurora-cli",
]
exclude = [
    "crates/aurora-renderer-cavern",
    "crates/aurora-decoder-truehdd",
    "crates/aurora-usb-protocol",
]
resolver = "2"

[workspace.metadata.aurora]
product_baseline = "q995-clean-baseline"
active_component_policy = "Only workspace members are active product components. Excluded crates remain preserved research/legacy source and require an explicit reviewed reactivation decision."
legacy_preservation_policy = "Do not delete excluded crates until dependency, documentation, licensing, migration, and replacement audits are complete."
legacy_components = [
    "crates/aurora-renderer-cavern",
    "crates/aurora-decoder-truehdd",
]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/ammarxz9333-cell/Auroraaudio"
rust-version = "1.78"

[workspace.dependencies]
anyhow = "1"
clap = { version = "=4.5.53", features = ["derive"] }
cpal = "0.15"
criterion = "0.5"
crossbeam-queue = "0.3"
rubato = { version = "0.16.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
