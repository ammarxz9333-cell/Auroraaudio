# Aurora custom 11.1.4 output layout for Omniphony 0.6.
# 11 full-range bed speakers + LFE + 4 height speakers = 16 outputs.
# This is an Aurora physical-output topology, not a claim of a Dolby-standard
# 11.1.4 channel bed. Objects are rendered into this custom geometry.
name: "Aurora 11.1.4 custom"
radius_m: 1
