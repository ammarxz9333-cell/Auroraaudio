# Aurora R0 dedicated 16-channel ALSA sink.
# Install as:
#   ~/.config/pipewire/pipewire.conf.d/90-aurora-tdm.conf
# for the dedicated Aurora appliance user, then restart that user's PipeWire.
#
# The physical ALSA PCM is 16 channels because the upstream NXP AK4458 TDM
# machine-driver path explicitly supports 16ch TDM512. Omniphony renders 12
# channels; PipeWire maps those by semantic position and leaves AUX0..AUX3
# silent.
context.objects = [
    { factory = adapter
        args = {
            factory.name           = api.alsa.pcm.sink
            node.name              = "aurora_tdm"
            node.description       = "Aurora R0 TDM16"
            media.class            = "Audio/Sink"
            api.alsa.path          = "hw:AuroraTDM16,0"
            api.alsa.period-size   = 256
            api.alsa.headroom      = 0
            api.alsa.disable-mmap  = false
            node.suspend-on-idle   = false
            audio.format           = "S32LE"
            audio.rate             = 48000
            audio.channels         = 16
            audio.position         = [ FL FR FC LFE RL RR SL SR TFL TFR TRL TRR AUX0 AUX1 AUX2 AUX3 ]
            resample.disable       = true
            adapter.auto-port-config = {
                mode = dsp
                monitor = false
                control = false
                position = preserve
            }
        }
    }
]
